<script>
/* ============================================================
   CONFIGURATION DU JEU — réglages de l’Administration
   Une seule entrée « jeu » dans la table configuration de Supabase :
   {cartes:{modifiees, supprimees}, leaders, regles, progression}.
   Elle est appliquée au moteur au démarrage, pour tous les joueurs.
   ============================================================ */
const CONFIGJEU = (function(){
const M = MOTEUR;
const clone = o => JSON.parse(JSON.stringify(o));
const derivee = id => /^depart_.+_evo\d$|^visite_/.test(id);
const numeriques = o => Object.fromEntries(Object.entries(o).filter(([, v]) => typeof v === "number" || typeof v === "boolean"));
// L’état d’origine, tel que généré à partir des données de P5R
const ORIGINE = {
  cartes: clone(Object.fromEntries(Object.entries(M.C).filter(([id]) => !derivee(id)))),
  leaders: clone(M.LEADERS),
  regles: clone(numeriques(M.R)),
  bataille: clone(numeriques(BATAILLE.R)),
  progression: clone(PROFIL.REGLES)
};
const vide = () => ({cartes:{modifiees:{}, supprimees:[]}, leaders:{}, regles:{}, bataille:{}, progression:{}, fusion:{}, elements:{}, musiques:{}});
// Caractéristiques de combat d’une Persona (P5R Royal), reprises de l’origine si une modification ancienne ne les a pas
const CHAMPS_COMBAT = ["stats", "croissance", "statsMax", "affinites", "niveau", "skills"];
function normaliser(cfg){
  const n = vide();
  if(!cfg || typeof cfg !== "object") return n;
  if(cfg.cartes){ n.cartes.modifiees = cfg.cartes.modifiees || {}; n.cartes.supprimees = cfg.cartes.supprimees || []; }
  // Refonte des skills : les modifications de skills de l’ancien système (sans effets de P5R) sont ignorées
  for(const [id, c] of Object.entries(n.cartes.modifiees)) if(c && (c.kind === "skill" || c.kind === "passif") && !Array.isArray(c.effets)) delete n.cartes.modifiees[id];
  // Ancien nom : « detonation » est redevenu « technique »
  const migrer = e => { if(e && e.detonation){ e.technique = (e.technique || 0) + e.detonation; delete e.detonation; } };
  for(const c of Object.values(n.cartes.modifiees)) if(c) ["effet", "combo", "lien", "sacrifice"].forEach(b => migrer(c[b]));
  for(const [id, c] of Object.entries(n.cartes.modifiees)){
    const o = ORIGINE.cartes[id];
    if(!c || c.kind !== "persona" || !o) continue;
    for(const k of CHAMPS_COMBAT) if(c[k] === undefined && o[k] !== undefined) c[k] = clone(o[k]);
    if(!Array.isArray(c.skills) || c.skills.some(x => !Array.isArray(x))) c.skills = clone(o.skills || []);
    delete c.legendaire;
  }
  n.leaders = cfg.leaders || {}; for(const L of Object.values(n.leaders)) if(L) migrer(L.capa); n.regles = cfg.regles || {}; n.bataille = cfg.bataille || {}; n.progression = cfg.progression || {}; n.fusion = cfg.fusion || {}; n.elements = cfg.elements || {}; n.musiques = cfg.musiques || {};
  return n;
}
let actuelle = vide(), majLe = null, fusion = {}, elements = {}, musiques = {};
function appliquer(cfg){
  const c = normaliser(cfg);
  for(const id of Object.keys(M.C)) delete M.C[id];
  Object.assign(M.C, clone(ORIGINE.cartes));
  for(const [id, carte] of Object.entries(c.cartes.modifiees)) M.C[id] = clone(carte);
  for(const id of c.cartes.supprimees) delete M.C[id];
  for(const id of Object.keys(M.LEADERS)) delete M.LEADERS[id];
  Object.assign(M.LEADERS, clone(ORIGINE.leaders));
  for(const [id, L] of Object.entries(c.leaders)) M.LEADERS[id] = Object.assign(M.LEADERS[id] || {}, clone(L));
  M.genererDerivees();
  Object.assign(M.R, clone(ORIGINE.regles), numeriques(c.regles));
  Object.assign(BATAILLE.R, clone(ORIGINE.bataille), numeriques(c.bataille));
  // Anciennes règles de progression qui n’existent plus (collection de départ, expérience des Personas…) : ignorées
  const prog = Object.fromEntries(Object.entries(numeriques(c.progression)).filter(([k]) => k in ORIGINE.progression));
  Object.assign(PROFIL.REGLES, clone(ORIGINE.progression), prog);
  fusion = clone(c.fusion);
  elements = clone(c.elements);
  musiques = clone(c.musiques);
  actuelle = c;
}
async function charger(){
  try { const v = await STOCKAGE.chargerConfiguration("jeu"); if(v){ appliquer(v); majLe = v.maj || null; } }
  catch(e){ /* on garde l’origine */ }
}
async function enregistrer(cfg){
  const c = normaliser(cfg); c.maj = new Date().toISOString();
  await STOCKAGE.enregistrerConfiguration("jeu", c);
  appliquer(c); majLe = c.maj;
}
return {get fusion(){ return fusion; }, get elements(){ return elements; }, get musiques(){ return musiques; }, ORIGINE, appliquer, charger, enregistrer, normaliser, vide, derivee, get actuelle(){ return clone(actuelle); }, get majLe(){ return majLe; }};
})();

</script>
<script>
/* ============================================================
   VELVET ROOM — fusion, compendium, chaise électrique
   La table de fusion par défaut est PROVISOIRE (ce n’est pas celle de P5R) :
   l’Administration permet de la corriger paire par paire.
   ============================================================ */
const VELVET = (function(){
const M = MOTEUR;
const ARCANES = ["fou","magicien","pretresse","imperatrice","empereur","hierophante","amants","chariot","justice","ermite","fortune","force",
  "pendu","mort","temperance","diable","tour","etoile","lune","soleil","jugement","foi","conseiller","monde"];
const cle = (a, b) => [a, b].sort().join("|");
// Table par défaut : même Arcane → même Arcane ; sinon une règle arithmétique simple (provisoire)
function arcaneParDefaut(a, b){
  if(a === b) return a;
  const n = ARCANES.length - 1, ia = ARCANES.indexOf(a), ib = ARCANES.indexOf(b);
  if(ia < 0 || ib < 0) return null;
  return ARCANES[(ia + ib) % n];
}
const surcharges = () => (typeof CONFIGJEU !== "undefined" && CONFIGJEU.fusion) || {};
const arcaneFusion = (a, b) => surcharges()[cle(a, b)] || arcaneParDefaut(a, b);
const estPersona = id => { const c = M.C[id]; return c && c.kind === "persona" && !c.depart && !c.reservee && !c.visite; };
const niveauDe = c => c.niveau || (c.rang || 1) * 20 - 10;
// Les démons trésors de P5R ne naissent jamais d’une fusion
const TRESORS = new Set(["regent","queens_necklace","stone_of_scone","koh_i_noor","orlov","emperors_amulet","hope_diamond","crystal_skull"]);
const normal = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/'/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
const estTresor = id => TRESORS.has(id) || TRESORS.has(normal(M.C[id] && M.C[id].nom));

/* ---------- Fusion ---------- */
// Résultat : l’Arcane donnée par la table ; une Persona d’un niveau au moins égal à la moyenne des deux + 1,
// d’un rang au moins égal au plus fort des deux, sans dépasser le rang de cartes accessible au joueur
function resultatFusion(idA, idB){
  const P = PROFIL.profil, a = M.C[idA], b = M.C[idB];
  if(!estPersona(idA) || !estPersona(idB)) return {ok:false, raison:"Choisissez deux Personas."};
  if(idA === idB && (P.collection[idA] || 0) < 2) return {ok:false, raison:`Il faut deux exemplaires de ${a.nom} pour la fusionner avec elle-même.`};
  const arcane = arcaneFusion(a.arcane, b.arcane);
  if(!arcane) return {ok:false, raison:"Ces deux Arcanes ne peuvent pas être fusionnées."};
  const rangMax = PROFIL.rangCartesMax(P.rang), rangMin = Math.max(a.rang || 1, b.rang || 1);
  const cible = Math.floor((niveauDe(a) + niveauDe(b)) / 2) + 1;
  const candidates = Object.keys(M.C).filter(id => estPersona(id) && M.C[id].arcane === arcane && id !== idA && id !== idB && !M.C[id].unique && !estTresor(id))
    .sort((x, y) => niveauDe(M.C[x]) - niveauDe(M.C[y]));
  if(!candidates.length) return {ok:false, arcane, raison:`Aucune Persona de l’Arcane ${nomArcane(arcane)} ne peut naître de cette fusion.`};
  const permises = candidates.filter(id => M.C[id].rang <= rangMax && M.C[id].rang >= Math.min(rangMin, rangMax));
  if(!permises.length){
    const rangMini = Math.min(...candidates.map(id => M.C[id].rang));
    return {ok:false, arcane, raison:`Cette fusion donnerait une Persona ${nomArcane(arcane)} de rang ${rangMini} au moins : votre rang de Voleur fantôme ne le permet pas encore.`};
  }
  const id = permises.find(x => niveauDe(M.C[x]) >= cible) || permises[permises.length - 1];
  return {ok:true, id, arcane, cible};
}
const nomArcane = a => (typeof window !== "undefined" && window.UI && window.UI.ARCANES[a]) || a;

/* ---------- Garde-fous communs ---------- */
function verifierRetrait(ids){
  const P = PROFIL.profil, apres = PROFIL.tailleCollection() - ids.length;
  if(apres < PROFIL.TAILLE_DECK) return `Votre collection doit garder au moins ${PROFIL.TAILLE_DECK} cartes, pour pouvoir composer un deck.`;
  const besoin = {}; for(const id of ids) besoin[id] = (besoin[id] || 0) + 1;
  for(const [id, k] of Object.entries(besoin)) if((P.collection[id] || 0) < k) return `Vous ne possédez pas assez d’exemplaires de ${M.C[id].nom}.`;
  return null;
}
function retirer(ids){ const P = PROFIL.profil; for(const id of ids){ P.collection[id]--; if(P.collection[id] <= 0) delete P.collection[id]; } }
function ajouter(id){ const P = PROFIL.profil; P.collection[id] = (P.collection[id] || 0) + 1; inscrire(id); }
function inscrire(id){ const P = PROFIL.profil; if(estPersona(id)) P.compendium[id] = true; }
// Après un retrait, les decks qui utilisaient ces cartes sont réajustés puis complétés
function reconcilierDecks(){
  const P = PROFIL.profil, touches = [];
  for(const d of P.decks){
    let change = false;
    for(const [id, k] of Object.entries(d.cartes)){ const max = Math.min(P.collection[id] || 0, PROFIL.maxCopies(id)); if(k > max){ if(max) d.cartes[id] = max; else delete d.cartes[id]; change = true; } }
    if(change){ d.cartes = PROFIL.completerDeck(d.cartes, d.leader); touches.push(d.nom); }
  }
  return touches;
}
const compter = k => { const P = PROFIL.profil; P.compteurs = P.compteurs || {}; P.compteurs[k] = (P.compteurs[k] || 0) + 1; };
function fusionner(idA, idB){
  const r = resultatFusion(idA, idB); if(!r.ok) return r;
  const pb = verifierRetrait([idA, idB]); if(pb) return {ok:false, raison:pb};
  inscrire(idA); inscrire(idB);
  // La Persona obtenue hérite de la moitié des niveaux gagnés en combat par ses deux parents
  const gagnes = Math.max(0, PROFIL.niveauPersona(idA) - PROFIL.niveauBase(idA)) + Math.max(0, PROFIL.niveauPersona(idB) - PROFIL.niveauBase(idB));
  retirer([idA, idB]); ajouter(r.id);
  if(gagnes) PROFIL.gagnerNiveaux(r.id, Math.ceil(gagnes / 2));
  compter("fusions");
  const decks = reconcilierDecks();
  PROFIL.enregistrer();
  return Object.assign(r, {decks});
}

/* ---------- Compendium ---------- */
const prixCompendium = id => (PROFIL.REGLES.prixCompendium || 100) * (M.C[id].rang || 1);
function acheter(id){
  const P = PROFIL.profil;
  if(!P.compendium[id] || !estPersona(id)) return {ok:false, raison:"Cette Persona n’est pas inscrite au compendium."};
  if(M.C[id].rang > PROFIL.rangCartesMax(P.rang)) return {ok:false, raison:"Votre rang de Voleur fantôme ne permet pas encore de la racheter."};
  const prix = prixCompendium(id);
  if(P.fragments < prix) return {ok:false, raison:`Il vous faut ${prix} Fragments de Velvet (vous en avez ${P.fragments}).`};
  P.fragments -= prix; ajouter(id); compter("rachats"); PROFIL.enregistrer();
  return {ok:true, prix};
}

/* ---------- Chaise électrique ---------- */
// Skills de la Persona : obtenables s’ils sont appris (niveau de la Persona) et d’un rang accessible au joueur.
// Les skills uniques (rang 9) ne s’obtiennent que de cette façon.
function skillsPersona(id){
  const P = PROFIL.profil, c = M.C[id]; if(!c) return [];
  const max = PROFIL.rangCartesMax(P.rang), niv = PROFIL.niveauPersona(id);
  // [skill, niveau, condition] : la condition (rang de Confident…) remplace le niveau quand il y en a une
  return (c.skills || []).map(e => Array.isArray(e) ? e : [e, 1]).filter(([s]) => M.C[s] && (M.C[s].kind === "skill" || M.C[s].kind === "passif") && !M.C[s].reservee)
    .map(([s, appris, condition]) => ({id: s, appris, condition, passif: M.C[s].kind === "passif", ok: !condition && appris <= niv && M.C[s].rang <= max,
      raison: condition ? condition : appris > niv ? `appris au niveau ${appris}` : M.C[s].rang > max ? `cartes de rang ${M.C[s].rang} pas encore débloquées` : ""}));
}
const skillsChaise = id => skillsPersona(id).filter(s => s.ok).map(s => s.id);
function chaise(idPersona, idSkill){
  if(!estPersona(idPersona)) return {ok:false, raison:"Choisissez une Persona."};
  if(!skillsChaise(idPersona).includes(idSkill)) return {ok:false, raison:"Ce skill ne peut pas être obtenu de cette Persona."};
  const pb = verifierRetrait([idPersona]); if(pb) return {ok:false, raison:pb};
  inscrire(idPersona); retirer([idPersona]); ajouter(idSkill); compter("chaise");
  const decks = reconcilierDecks();
  PROFIL.enregistrer();
  return {ok:true, decks};
}

return {ARCANES, cle, arcaneFusion, arcaneParDefaut, resultatFusion, fusionner, prixCompendium, acheter, skillsChaise, skillsPersona, chaise, estPersona, inscrire};
})();

</script>
<script>
/* ============================================================
   MUSIQUE — un ou plusieurs morceaux par moment du jeu, choisis dans l’Administration
   Le navigateur n’autorise le son qu’après une première action du joueur (clic, touche).
   ============================================================ */
const MUSIQUE = (function(){
const CLE = "p5-musique";
const SLOTS = [
  ["accueil", "Accueil et menus", "Écrans de l’accueil, de la préparation du duel et des sections en construction."],
  ["duel", "Duel", "Pendant les duels."],
  ["tension", "Duel : moment décisif", "Quand un joueur passe sous 20 PV. Sans morceau, la musique du duel continue."],
  ["victoire", "Victoire", "Fin de duel gagné (jouée une fois)."],
  ["defaite", "Défaite", "Fin de duel perdu (jouée une fois)."],
  ["leblanc", "Café Leblanc", "Sans morceau, la musique de l’accueil est utilisée."],
  ["velvet", "Velvet Room", "Sans morceau, la musique de l’accueil est utilisée."]
];
const REPLI = {tension:"duel", duel:"accueil", leblanc:"accueil", velvet:"accueil"};
const UNE_FOIS = {victoire:true, defaite:true};
const reglages = {volume:0.5, muet:false};
try { Object.assign(reglages, JSON.parse(localStorage.getItem(CLE) || "{}")); } catch(e){}
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(reglages)); } catch(e){} };
let audio = null, slotJoue = null, voulu = null, debloque = false, ctrl = null;

const pistes = slot => ((typeof CONFIGJEU !== "undefined" && CONFIGJEU.musiques && CONFIGJEU.musiques[slot]) || []).filter(p => p && p.url);
const aDesPistes = () => SLOTS.some(([s]) => pistes(s).length);
function resoudre(slot){ let s = slot; const vus = new Set(); while(s && !pistes(s).length && !vus.has(s)){ vus.add(s); s = REPLI[s]; } return s && pistes(s).length ? s : null; }
const cible = () => reglages.muet ? 0 : reglages.volume;
function fondu(a, vers, ms, fin){
  if(!a) return;
  const depart = a.volume, t0 = performance.now();
  const pas = t => { const k = Math.min(1, (t - t0) / ms); a.volume = Math.max(0, Math.min(1, depart + (vers - depart) * k)); if(k < 1) requestAnimationFrame(pas); else if(fin) fin(); };
  requestAnimationFrame(pas);
}
function lancer(s){
  const l = pistes(s), p = l[Math.floor(Math.random() * l.length)];
  const a = new Audio(p.url);
  a.loop = !UNE_FOIS[s] && l.length === 1;
  a.volume = 0;
  // Plusieurs morceaux : on enchaîne au hasard
  a.addEventListener("ended", () => { if(audio === a && !UNE_FOIS[s]) lancer(s); });
  a.play().then(() => fondu(a, cible(), 600)).catch(() => {});
  if(audio && audio !== a){ const ancien = audio; fondu(ancien, 0, 500, () => ancien.pause()); }
  audio = a;
}
// Demande la musique d’un moment du jeu (appelé à chaque affichage)
function jouer(slot){
  voulu = slot;
  majControle();
  if(!debloque) return;
  const s = resoudre(slot);
  if(s === slotJoue && (audio || !s)) return;
  slotJoue = s;
  if(!s){ if(audio){ const a = audio; audio = null; fondu(a, 0, 500, () => a.pause()); } return; }
  lancer(s);
}
function debloquer(){ if(debloque) return; debloque = true; if(voulu) jouer(voulu); }
["pointerdown", "keydown"].forEach(t => document.addEventListener(t, debloquer, {capture:true}));

/* ---------- Réglage du volume (en haut à droite, seulement s’il y a des morceaux) ---------- */
function majControle(){
  if(!ctrl){
    ctrl = document.createElement("div"); ctrl.className = "musique-ctrl";
    ctrl.innerHTML = `<button type="button" class="musique-bouton" aria-label="Couper ou remettre la musique"></button>
      <input type="range" min="0" max="100" step="5" aria-label="Volume de la musique">`;
    document.body.appendChild(ctrl);
    ctrl.querySelector("button").addEventListener("click", () => { reglages.muet = !reglages.muet; sauver(); if(audio) audio.volume = cible(); majControle(); });
    ctrl.querySelector("input").addEventListener("input", e => { reglages.volume = +e.target.value / 100; reglages.muet = false; sauver(); if(audio) audio.volume = cible(); majControle(); });
  }
  ctrl.hidden = !aDesPistes();
  ctrl.querySelector("button").textContent = reglages.muet || !reglages.volume ? "♪ Coupé" : "♪";
  ctrl.querySelector("button").setAttribute("aria-pressed", String(reglages.muet));
  ctrl.querySelector("input").value = Math.round(reglages.volume * 100);
}
return {SLOTS, jouer, aDesPistes, pistes, reglages};
})();

</script>
<script>
/* ============================================================
   ADMINISTRATION — réservée aux comptes de la table admins
   On travaille sur un brouillon ; « Publier » l’enregistre dans Supabase
   et l’applique à tous les joueurs.
   ============================================================ */
const ADMIN = (function(){
const M = MOTEUR, U = () => window.UI;
const esc = s => U().esc(s);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const ORI = CONFIGJEU.ORIGINE;
const EFFETS = [["deg","Dégâts"],["yen","Yen"],["pv","PV"],["pioche","Pioche"],["defausse","Peur (défausse adverse)"],["purge","Purge"],["vision","Vision"]];
// Effets avancés, regroupés (dépliés seulement si la carte en utilise)
const EFFETS_AVANCES = [
  ["Altérations (subies par l’adversaire à son prochain tour)", [["brulure","Brûlure (PV perdus)"],["rage","Rage"],["gel","Gel (3 cartes)"],["sommeil","Sommeil"],["choc","Choc"],["vertige","Vertige (¥ en plus)"],["confusion","Confusion (¥ perdus)"],["oubli","Oubli"],["lavage","Lavage de cerveau"],["desespoir","Désespoir (SP perdus)"]]],
  ["Malus", [["affaiblir","Affaibli (dégâts adverses en moins)"],["vulnerable","Défense adverse baissée"]]],
  ["Protections et bonus", [["bouclier","Bouclier"],["renvoi","Renvoi"],["attaque","Attaque +"],["double","Double effet"],["dissiper","Dissipe"],["purifier","Purifie"],["prep","Préparation"],["remplacer","Renouvelle le marché"],["technique","Technique (+ dégâts si altération)"],["sp","SP gagnés"],["rappel","Rappel (reprendre de la défausse)"]]],
  ["Effets d’Arcane", [["copie","Copie (Fou)"],["skillsPlus","+ dégâts par skill"],["hasard","Hasard"],["parDefausse","+ dégâts / 4 cartes en défausse"],["perdrePV","PV perdus (vous)"],["defausseSoi","Défausse (vous)"],["parLien","+ dégâts par Lien"],["remise","Remise au marché"]]]
];
const CONDS = [["","Aucune"],["deuxPersonas","Exactement 2 Personas jouées"],["premiere","Première carte jouée du tour"],["moinsPV","Moins de PV que l’adversaire"],["seulePersona","Seule Persona du tour"],["pvBas","20 PV ou moins"]];
const BLOCS = [["effet","Effet"],["combo","One More (combo d’élément)"],["lien","Lien d’Arcane (Personas)"],["sacrifice","Sacrifice"]];
const TYPES = {persona:"Persona", skill:"Skill", passif:"Passif", objet:"Objet"};
const REGLES_COMBAT = [
  ["pvLeader","PV du Leader"],["perteKO","PV perdus par le Leader quand une de ses Personas tombe, par rang"],["spDepart","SP au départ"],["spTour","SP gagnés par tour"],["spMax","SP maximum"],
  ["nivLeaderDepart","Niveau de départ de la Persona du Leader"],["nivLeaderTour","Niveaux gagnés par tour par la Persona du Leader"],["nivTour","Niveaux gagnés par tour par une Persona en jeu"],
  ["pvBase","PV d’une Persona : base"],

const supprimee = id => A.b.cartes.supprimees.includes(id);

// Jauge : valeur de la carte comparée au budget de son rang
// Budget : base + points par rang × rang de la carte
function budgetCarte(c){ const R = M.R, rang = c.rang || c.cout || 0; return {b: Math.round((R.budgetBase + R.budgetParYen * rang) * 100) / 100, rang}; }
const virgule = n => String(Math.round(n * 100) / 100).replace(".", ",");
function jaugeBudget(c){
  const {b, rang} = budgetCarte(c), v = VALEURS.valeurCarte(c), r = b > 0 ? v / b : 0;
  const etat = r > 1.15 ? "trop" : r > 1.03 ? "limite" : r < 0.75 ? "faible" : "ok";
  const txt = {trop:"au-dessus du budget", limite:"légèrement au-dessus", faible:"bien en dessous", ok:"dans le budget"}[etat];
  return `<div class="a-jauge ${etat}"><div class="a-jauge-barre"><i style="width:${Math.min(100, Math.round(100 * r / 1.3))}%"></i><span class="a-jauge-repere" style="left:${Math.round(100 / 1.3)}%"></span></div>
    <span><b>Valeur ${virgule(v)}</b> pour un budget de ${virgule(b)} (rang ${rang}) : ${txt}.</span></div>`;
}

/* ---------- Onglet Cartes ---------- */
const enPersonas = () => A.onglet === "personas";
const selActuelle = () => enPersonas() ? A.selP : A.sel;
function listeCartes(){
  const q = A.q.trim().toLowerCase();
  const ids = idsCartes().filter(id => {
    const c = carte(id) || ORI.cartes[id];
    if(enPersonas() ? c.kind !== "persona" : c.kind === "persona") return false;
    if(!enPersonas() && A.fType && c.kind !== A.fType) return false;
    if(enPersonas() && A.fArc && c.arcane !== A.fArc) return false;
    if(A.fEl && (c.el || "") !== (A.fEl === "aucun" ? "" : A.fEl)) return false;
    if(A.fRang && String(c.rang || 0) !== A.fRang) return false;
    if(A.fModif === "modifiees" && !estModifiee(id)) return false;
    if(A.fModif === "nouvelles" && !estNouvelle(id)) return false;
    if(A.fModif === "supprimees" && !supprimee(id)) return false;
    return !q || c.nom.toLowerCase().includes(q) || id.includes(q);
  }).sort((a, b) => {
    const ca = carte(a) || ORI.cartes[a], cb = carte(b) || ORI.cartes[b];
    // Tri par rang (croissant ou décroissant), puis par nom à rang égal
    const d = A.tri === "rang" ? (ca.rang || 0) - (cb.rang || 0) : A.tri === "rang-desc" ? (cb.rang || 0) - (ca.rang || 0) : 0;
    return d || ca.nom.localeCompare(cb.nom);
  });
  return ids.map(id => {
    const c = carte(id) || ORI.cartes[id];
    const tag = supprimee(id) ? `<span class="a-tag sup">supprimée</span>` : c.reservee ? `<span class="a-tag">Leader</span>` : estNouvelle(id) ? `<span class="a-tag nou">nouvelle</span>` : estModifiee(id) ? `<span class="a-tag mod">modifiée</span>` : "";
    return `<li><button type="button" class="${selActuelle() === id ? "actif" : ""}" data-act="a-sel" data-id="${esc(id)}">
      <span class="chip ${c.el ? "el-" + c.el : c.kind === "objet" ? "el-objet" : "el-aucun"}">${c.el ? esc(M.ELEMENTS[c.el].court) : c.kind === "objet" ? "Obj" : "—"}</span>
      <span class="a-li-nom">${esc(c.nom)}</span><small>${c.kind === "persona" ? `${esc(U().ARCANES[c.arcane] || "")} · niv. ${c.niveau || 1} · rang ${c.rang} · ${(c.skills || []).length} skills` : `${TYPES[c.kind] || c.kind} · ${c.unique ? "unique" : c.rang ? "rang " + c.rang : "départ"} · ${c.kind === "skill" || c.kind === "passif" ? (c.cout ? (c.cout.sp ? c.cout.sp + " SP" : c.cout.pvPct + " % PV") : "sans coût") : (c.cout || 0) + " ¥"}`}</small>${tag}</button></li>`;
  }).join("") || `<li class="a-vide">Aucune carte.</li>`;
}

const imageDe = dt => { if(!dt) return null; for(const it of Array.from(dt.items || [])) if(it.kind === "file" && it.type.startsWith("image/")) return it.getAsFile(); for(const f of Array.from(dt.files || [])) if(f.type.startsWith("image/")) return f; return null; };
// Redimensionne (600 px au plus) en gardant la transparence, puis envoie dans Supabase
async function traiterImage(fichier, chemin){
  if(!fichier || !fichier.type.startsWith("image/")){ A.erreur = "Ce fichier n’est pas une image."; U().render(); return; }
  A.envoiImage = chemin; A.erreur = null; U().render();
  try {
    const url = URL.createObjectURL(fichier);
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const [table] = chemin.split(".");
    const k = Math.min(1, (table === "elements" ? 256 : 600) / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    let blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.9));
    if(!blob || blob.type !== "image/webp") blob = await new Promise(r => cv.toBlob(r, "image/png"));
    const lien = await STOCKAGE.envoyerImage(blob, table === "leaders" ? "leaders" : table === "elements" ? "elements" : "cartes");
    ecrire(chemin, lien);
    A.envoyees.push(lien);
    A.msg = "Image envoyée. Pensez à publier.";
  } catch(e){ A.erreur = "L’envoi de l’image a échoué. Vérifiez votre connexion, puis réessayez."; }
  A.envoiImage = false; U().render();
}

  if(!fichier) return;

  if(fichier.size > 20 * 1024 * 1024){ A.erreur = "Ce fichier dépasse 20 Mo. Réduisez sa qualité (128 kbit/s suffit), puis réessayez."; U().render(); return; }
  A.envoiImage = "musiques." + slot; A.erreur = null; U().render();
  try {
    const url = await STOCKAGE.envoyerFichier(fichier, "musiques");
    A.b.musiques = A.b.musiques || {}; (A.b.musiques[slot] = A.b.musiques[slot] || []).push({url, nom: fichier.name.replace(/\.[^.]+$/, "")});
    A.envoyees.push(url); A.sale = true; A.msg = "Morceau envoyé. Pensez à publier.";
  } catch(e){ A.erreur = "L’envoi du morceau a échoué. Vérifiez votre connexion, puis réessayez."; }
  A.envoiImage = false; U().render();
}

const GROUPES = {kind:"Type", el:"Élément", rang:"Rang", arcane:"Arcane", cout:"Coût"};
function libelleGroupe(g, v){
  if(g === "kind") return TYPES[v] ? TYPES[v] + "s" : v;
  if(g === "el") return v ? M.ELEMENTS[v].nom : "Sans élément";
  if(g === "rang") return v ? "★".repeat(v) + ` (rang ${v})` : "Sans rang";
  if(g === "arcane") return U().ARCANES[v] || "Sans Arcane";
  if(g === "cout") return `${v} ¥`;
  return String(v);
}

/* ---------- Ménage des images ---------- */
// Adresses des images utilisées par une configuration
const urlsDe = cfg => new Set((JSON.stringify(cfg || {}).match(/https?:\/\/[^"\s]+\/object\/public\/images\/[^"\s]+/g)) || []);
// Supprime du stockage les images qui ne sont plus utilisées par la configuration publiée
async function nettoyerImages(candidates){
  const utilisees = urlsDe(CONFIGJEU.actuelle);
  const aSupprimer = [...new Set(candidates)].filter(u => !utilisees.has(u));
  for(const u of aSupprimer) await STOCKAGE.supprimerImage(u);
  return aSupprimer.length;
}

/* ---------- Écriture dans le brouillon ---------- */
function ecrire(chemin, v){
  const ks = chemin.split("."), table = ks.shift();
  let o;
  if(table === "cartes") o = carteEditable(ks.shift());
  else if(table === "leaders"){ const id = ks.shift(); o = leaderEditable(id); if(ks[0] === "capa" && !o.capa) o.capa = clone(leader(id).capa || {}); if(ks[0] === "evos" && !o.evos) o.evos = clone(leader(id).evos || ["", ""]); }
  else { o = A.b[table]; A.sale = true; }
  const dernier = ks.pop();
  for(const k of ks){ if(o[k] == null || typeof o[k] !== "object") o[k] = {}; o = o[k]; }
  if(v === undefined || v === "" || (v === 0 && table !== "regles" && table !== "bataille" && table !== "progression" && dernier !== "cout" && dernier !== "rang") || v === false) delete o[dernier]; else o[dernier] = v;
  // Un bloc d’effets vide disparaît (pas de combo, pas de sacrifice…)
  if(table === "cartes" && ks.length === 1 && ["combo","lien","sacrifice"].includes(ks[0])){
    const c = A.b.cartes.modifiees[chemin.split(".")[1]];
    if(c[ks[0]] && !Object.keys(c[ks[0]]).length) c[ks[0]] = ks[0] === "combo" ? null : undefined;
  }
  A.sale = true;
}
// Mise à jour de l’aperçu sans redessiner la page (on garde le focus)
function majApercu(){
  const sel = selActuelle();
  if((A.onglet !== "cartes" && A.onglet !== "personas") || !sel) return;
  const c = carte(sel); if(!c) return;
  const ap = document.querySelector(".a-apercu-carte"), lo = document.querySelector(".a-apercu-loupe");
  if(ap) ap.innerHTML = U().carteJeu({id:sel, uid:"apercu"}, {def:c});
  if(lo) lo.innerHTML = U().loupeHTML(sel, c);
  const jg = document.querySelector(".a-jauge-place"); if(jg) jg.innerHTML = jaugeBudget(c);
  const barre = document.querySelector(".a-barre"); if(barre) barre.hidden = false;
}
function saisie(t, evt){
  if(t.dataset.aFiltre === "catGroupe"){ if(evt === "change"){ A.catGroupe = t.value; U().render(); } return; }
  if(t.dataset.aFiltre === "arcFusion"){ if(evt === "change"){ A.arcFusion = t.value; U().render(); } return; }
  if(t.dataset.aFusion && evt === "change"){
    const [x, y] = t.dataset.aFusion.split("|"); A.b.fusion = A.b.fusion || {};
    if(t.value === VELVET.arcaneParDefaut(x, y)) delete A.b.fusion[t.dataset.aFusion]; else A.b.fusion[t.dataset.aFusion] = t.value;
    A.sale = true; U().render(); return;
  }
  if(t.dataset.aSkill){
    if(evt !== "change") return;
    const v = Math.min(99, Math.max(1, Math.round(+t.value || 1)));
    majSkill(t.dataset.aSkill, (c, i) => { c.skills[i][1] = v; }); U().render(); return;
  }
  if(t.dataset.aFiltre === "nouveauSkill"){ A.nouveauSkill = t.value; return; }
  if(t.dataset.aFiltre === "nouvelEffet"){ A.nouvelEffet = t.value; return; }
  if(t.dataset.aFiltre === "fArc"){ A.fArc = t.value; rafraichirListe(); return; }
  if(t.dataset.aFiltre){ A[t.dataset.aFiltre] = t.value; if(evt === "input" || t.tagName === "SELECT") rafraichirListe(); return; }
  if(t.dataset.aImage && evt === "change"){ traiterImage(t.files[0], t.dataset.aImage); return; }
  if(t.dataset.aMusique && evt === "change"){ envoyerMusique(t.files[0], t.dataset.aMusique); return; }
  if(t.hasAttribute("data-a-import") && evt === "change"){ importer(t.files[0]); return; }
  const chemin = t.dataset.aF; if(!chemin) return;
  const type = t.dataset.t;
  if(evt === "input" && (t.tagName === "SELECT" || type === "b")) return;
  let v = type === "n" ? (t.value === "" ? 0 : Math.max(0, Math.round(+t.value))) : type === "d" ? (t.value === "" ? 0 : Math.max(0, Math.round(+String(t.value).replace(",", ".") * 100) / 100)) : type === "b" ? t.checked : t.value;
  if(type === "el") v = t.value || null;
  if(type === "l") v = t.value.split(/[,;]\s*|\s+/).filter(Boolean).map(x => isNaN(+x) ? x : +x);
  ecrire(chemin, v);
  // Skill : puissance, coups, précision, critique et élément sont recopiés dans l’effet « Dégâts »
  const mSkill = chemin.match(/^cartes\.([^.]+)\.(puissance|coups|precision|critique|el)$/);
  if(mSkill && ["skill", "passif"].includes((carte(mSkill[1]) || {}).kind)){
    const c = carteEditable(mSkill[1]);
    for(const e of c.effets || []) if(e.t === "degats") e[mSkill[2]] = v ?? (mSkill[2] === "el" ? null : 0);
  }
  if(/^cartes\.[^.]+\.rang$/.test(chemin) && (carte(chemin.split(".")[1]) || {}).kind !== "passif"){ ecrire(chemin.replace(/rang$/, "cout"), v); const c = carte(chemin.split(".")[1]); if(c && c.kind === "persona") carteEditable(chemin.split(".")[1]).rangManuel = true; }
  // Niveau de départ : le rang (et le coût) en découlent, sauf rang réglé à la main ou Persona de Leader
  if(/^cartes\.[^.]+\.niveau$/.test(chemin)){
    const id = chemin.split(".")[1], c = carteEditable(id);
    c.niveau = Math.min(99, Math.max(1, v || 1));
    if(!(M.C[id] || {}).reservee && !c.rangManuel){ c.rang = rangDuNiveau(c.niveau); c.cout = c.rang; }
    if(evt === "change") U().render();
  }
  if(evt === "input") majApercu();
  else if(t.tagName === "SELECT" || type === "b") U().render();
}
function rafraichirListe(){ const ul = document.querySelector(".a-items"); if(ul && (A.onglet === "cartes" || A.onglet === "personas")) ul.innerHTML = listeCartes(); }

function nouvelId(base){ let id = base, n = 2; while(ORI.cartes[id] || A.b.cartes.modifiees[id]) id = `${base}_${n++}`; return id; }
function exporter(){
  const blob = new Blob([JSON.stringify(A.b, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "persona5-configuration.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importer(f){
  if(!f) return;
  try { const v = JSON.parse(await f.text()); if(!v || typeof v !== "object" || !v.cartes) throw 0; A.b = CONFIGJEU.normaliser(v); A.sale = true; A.msg = "Configuration importée. Vérifiez-la, puis publiez."; A.erreur = null; }
  catch(e){ A.erreur = "Ce fichier n’est pas une configuration valide."; }
  U().render();
}

async function clic(act, id){
  A.msg = null; A.erreur = null;
  switch(act){
    case "a-accueil":
      if(A.sale && !confirm("Vos modifications ne sont pas publiées. Quitter quand même ?")) return;
      nettoyerImages(A.envoyees); A.envoyees = [];
      A.b = null; U().aller("accueil"); return;
    case "a-onglet": A.onglet = id; A.confirmer = null; break;
    case "a-sel": if(enPersonas()) A.selP = id; else A.sel = id; A.confirmer = null; break;
    case "a-voir-skill": A.onglet = "cartes"; A.sel = id; A.q = ""; A.fType = ""; A.fEl = ""; A.fModif = ""; A.fRang = ""; U().render(); window.scrollTo(0, 0); return;
    case "a-retirer-combo": delete carteEditable(id).combo; break;
    case "a-nettoyer-combos": { let n = 0; for(const [k, c] of Object.entries(A.b.cartes.modifiees)) if(c.kind === "persona" && c.combo){ delete c.combo; n++; } A.sale = A.sale || n > 0; A.msg = `${n} One More inactif${n > 1 ? "s" : ""} retiré${n > 1 ? "s" : ""}. Pensez à publier.`; break; }
    case "a-skill-retirer": majSkill(id, (c, i) => c.skills.splice(i, 1)); break;
    case "a-skill-inne": majSkill(id, (c, i) => { c.skills[i][1] = c.niveau || 1; }); break;
    case "a-skill-ajouter": {
      if(!A.nouveauSkill){ A.erreur = "Choisissez d’abord un skill dans la liste."; break; }
      const niv = Math.min(99, Math.max(1, Math.round(+(document.getElementById("a-skill-niv") || {}).value || 1)));
      const s = A.nouveauSkill; majSkill(id + "|0", c => c.skills.push([s, niv])); A.nouveauSkill = ""; break;
    }
    case "a-sel-leader": A.selLeader = id; break;
    case "a-nouvelle": {
      if(enPersonas()){ const nid = nouvelId("persona_perso"); A.b.cartes.modifiees[nid] = {nom:"Nouvelle Persona", kind:"persona", el:"feu", arcane:"fou", rang:1, cout:1, niveau:1, skills:[], effet:{deg:2}, lien:{yen:1}}; A.selP = nid; }
      else { const nid = nouvelId("carte_perso"); A.b.cartes.modifiees[nid] = {nom:"Nouvelle carte", kind:"skill", el:"feu", rang:1, cout:1, effet:{deg:3}, combo:{deg:2}}; A.sel = nid; }
      A.sale = true; A.fModif = ""; A.q = ""; break; }
    case "a-dupliquer": { const c = clone(carte(id)); c.nom += " (copie)"; delete c.reservee; const nid = nouvelId(id + "_copie"); A.b.cartes.modifiees[nid] = c; if(enPersonas()) A.selP = nid; else A.sel = nid; A.sale = true; break; }
    case "a-origine": delete A.b.cartes.modifiees[id]; A.sale = true; break;
    case "a-demander-sup": A.confirmer = id; break;
    case "a-annuler-sup": A.confirmer = null; break;
    case "a-supprimer":
      if(ORI.cartes[id]){ if(!A.b.cartes.supprimees.includes(id)) A.b.cartes.supprimees.push(id); delete A.b.cartes.modifiees[id]; }
      else { delete A.b.cartes.modifiees[id]; A.sel = null; A.selP = null; }
      A.confirmer = null; A.sale = true; break;
    case "a-restaurer": A.b.cartes.supprimees = A.b.cartes.supprimees.filter(x => x !== id); A.sale = true; break;
    case "a-retirer-image": ecrire(id, undefined); break;
    case "a-leader-origine": delete A.b.leaders[id]; A.sale = true; break;
    case "a-fusion-defaut": A.b.fusion = {}; A.sale = true; break;
    case "a-musique-retirer": { const [slot, i] = id.split("|"); (A.b.musiques[slot] || []).splice(+i, 1); A.sale = true; break; }
    case "a-cat-ouvrir": if(carte(id).kind === "persona"){ A.selP = id; A.onglet = "personas"; } else { A.sel = id; A.onglet = "cartes"; } A.q = ""; A.fType = ""; A.fEl = ""; A.fModif = ""; A.fRang = ""; U().render(); window.scrollTo(0, 0); return;
    case "a-cat-tout": document.querySelectorAll(".a-groupe").forEach(x => { A.catOuverts[x.dataset.cat] = id === "1"; }); break;
    case "a-stats":
      A.enCours = true; U().render();
      try { A.stats = await STOCKAGE.statistiques(); } catch(e){ A.erreur = "Les statistiques n’ont pas pu être chargées."; }
      A.enCours = false; break;
    case "a-exporter": exporter(); return;
    case "a-eff-suppr": { const c = carteEditable(selActuelle()); c.effets.splice(+id, 1); A.sale = true; break; }
    case "a-eff-ajout": { const c = carteEditable(selActuelle()), t = A.nouvelEffet || "degats"; c.effets = c.effets || []; c.effets.push(Object.assign({t}, JSON.parse(JSON.stringify(TYPES_EFFETS[t][1])))); A.sale = true; break; }
    case "a-reinit": A.confirmer = "tout"; break;
    case "a-reinit-ok": A.b = CONFIGJEU.vide(); A.confirmer = null; A.sale = true; A.msg = "Réglages d’origine chargés. Publiez pour les appliquer."; break;
    case "a-annuler": nettoyerImages(A.envoyees); A.envoyees = []; ouvrir(); A.msg = "Modifications annulées."; break;
    case "a-publier":
      A.enCours = true; U().render();
      try {
        const avant = [...urlsDe(CONFIGJEU.actuelle), ...A.envoyees];
        await CONFIGJEU.enregistrer(A.b); A.b = CONFIGJEU.actuelle; A.sale = false;
        const n = await nettoyerImages(avant); A.envoyees = [];
        A.msg = `Publié : tous les joueurs reçoivent ces réglages à leur prochaine visite.${n ? ` ${n} image${n > 1 ? "s" : ""} inutilisée${n > 1 ? "s" : ""} supprimée${n > 1 ? "s" : ""} du stockage.` : ""}`;
      }
      catch(e){ A.erreur = "La publication a échoué. Vérifiez que votre compte est bien administrateur, et votre connexion."; }
      A.enCours = false; break;
    default: return;
  }
  U().render();
}

// Images : coller (Ctrl+V) ou glisser-déposer sur une zone d’image
document.addEventListener("paste", e => {
  if(!window.UI || U().ecran !== "admin") return;
  const zone = document.querySelector("[data-depot].cible") || document.querySelector("[data-depot]"), f = imageDe(e.clipboardData);
  if(zone && f){ e.preventDefault(); traiterImage(f, zone.dataset.depot); }
});
["dragover","dragleave","drop"].forEach(t => document.addEventListener(t, e => {
  if(!window.UI || U().ecran !== "admin") return;
  const z = e.target.closest && e.target.closest("[data-depot]");
  if(t === "dragover"){ e.preventDefault(); if(z) z.classList.add("survol"); return; }
  if(t === "dragleave"){ if(z) z.classList.remove("survol"); return; }
  e.preventDefault(); if(!z) return;
  const f = imageDe(e.dataTransfer); if(f) traiterImage(f, z.dataset.depot);
}));
document.addEventListener("toggle", e => {
  const g = e.target; if(!g.classList || !g.classList.contains("a-groupe")) return;
  const avant = !!A.catOuverts[g.dataset.cat]; A.catOuverts[g.dataset.cat] = g.open;
  if(g.open && !avant) U().render();
}, true);
// La zone d’image cliquée devient la cible du collage (utile quand il y en a plusieurs, comme pour les éléments)
document.addEventListener("click", e => {
  if(!window.UI || U().ecran !== "admin") return;
  const z = e.target.closest && e.target.closest("[data-depot]"); if(!z) return;
  document.querySelectorAll("[data-depot].cible").forEach(x => x.classList.remove("cible")); z.classList.add("cible");
});
window.addEventListener("beforeunload", e => { if(window.UI && U().ecran === "admin" && A.sale){ e.preventDefault(); e.returnValue = ""; } });

return {ouvrir, html, clic, saisie, peutQuitter};
})();

function txtEffet(e, d){

// Deck de l’ordinateur : autant de Personas de chaque rang que le deck du joueur, tirées au hasard
function deckOrdinateur(deckJoueur, leader){
  const res = [], reserve = new Set(), L = LEADERS[leader];
  const parRang = {}; for(const id of deckJoueur){ const r = M.C[id].rang; parRang[r] = (parRang[r] || 0) + 1; }
  const pool = r => Object.keys(M.C).filter(id => { const c = M.C[id]; return c.kind === "persona" && c.stats && !c.depart && !c.visite && !c.reservee && c.rang === r && !reserve.has(id); });
  for(const [r, n] of Object.entries(parRang)){
    const l = pool(+r).sort(() => Math.random() - 0.5);
    // Un peu plus de Personas de l’élément et de l’Arcane du Leader
    l.sort((a, b) => ((M.C[b].el === L.el) + (M.C[b].arcane === L.arcane)) - ((M.C[a].el === L.el) + (M.C[a].arcane === L.arcane)) || Math.random() - 0.5);
    const choix = [...l.slice(0, Math.ceil(n / 3)), ...l.slice(Math.ceil(n / 3)).sort(() => Math.random() - 0.5)].slice(0, n);
    for(const id of choix){ res.push(id); reserve.add(id); }
  }
  return res;
}

      <li><b>Niveaux</b> : une Persona entre en jeu à son niveau de P5R et gagne 1 niveau par tour en jeu ; elle apprend ses skills en montant. La Persona du Leader commence au niveau ${R2.nivLeaderDepart} et gagne ${R2.nivLeaderTour} niveaux par tour ; elle évolue avec son Confident (rangs 10 et 11), jamais pendant le combat.</li>
      <li><b>Dégâts</b> : la formule de P5R. Une attaque forte, ou sur une faiblesse, met une Persona du même rang K.O. en 1 ou 2 coups. Le Leader, dont la Persona monte moins vite que le terrain, subit des dégâts réduits (× ${String(R2.degatsLeader).replace(".", ",")}) et ne craint pas les morts instantanées.</li>
      <li><b>Réanimation</b> : Recarm, Samarecarm… renvoient une Persona de votre défausse dans votre deck, une seule fois par combat.</li>
      <li><b>One More</b> : toucher une faiblesse ou réussir un critique met la cible à terre (elle perd sa prochaine action). L’attaquant rejoue une fois par tour, ou passe le relais à un allié qui n’a pas encore agi. Si toutes les Personas adverses en jeu sont à terre : <b>All-Out Attack</b>, qui frappe toutes les Personas adverses et le Leader.</li>
      <li><b>K.O.</b> : une Persona K.O. part à la défausse et son Leader perd ${R2.perteKO} PV par rang. Les soins ne rendent au Leader que ${Math.round(R2.soinLeader * 100)} % de leur valeur.</li>
      <li><b>Lien d’Arcane</b> : deux Personas de la même Arcane en jeu, ou une Persona de l’Arcane de votre Leader, gagnent le bonus de leur Arcane (Fou : 2 niveaux par tour, Chariot : attaque +15 %…). Survolez une carte pour le lire.</li>
      <li><b>Alerte de sécurité</b> : à partir du tour ${R2.alerteDebut}, chaque Leader perd ${R2.alerte} PV de plus à chaque fin de tour (${R2.alerte}, ${2 * R2.alerte}, ${3 * R2.alerte}…).</li>
      <li><b>Après la partie</b> : les niveaux gagnés par vos Personas sont ajoutés à votre collection (pour la fusion). Le gagnant choisit une nouvelle Persona parmi trois.</li>
    </ol>
    <div class="actions"><button type="button" class="btn fort" data-act="regles-fermer">Compris</button></div></div></div>`;
}

// Moment du jeu pour la musique

  }
  if(ui.ecran === "leblanc") return "leblanc";

// Zones qui défilent à l’intérieur de la page : leur position est gardée d’un affichage à l’autre
const ZONES_DEFILEMENT = [".a-items", ".ed-deck", ".deck-liste", ".detail", ".journal", ".rangee", ".a-liste", ".fenetre"];
function render(){
  const x = window.scrollX, y = window.scrollY, dockMain = document.querySelector(".main-cartes"), sx = dockMain ? dockMain.scrollLeft : 0;
  const ecranAvant = ui.ecran, defilements = ZONES_DEFILEMENT.map(sel => [...document.querySelectorAll(sel)].map(e => [e.scrollTop, e.scrollLeft]));
  if(ui.ecran === "jeu" && S) recompense();
  const actif = document.activeElement, idActif = actif && actif.id, pos = actif && actif.selectionStart;
  if(!PROFIL.etat.pret){ app.innerHTML = `<div class="chargement"><p>Chargement…</p></div>`; return; }
  if(STOCKAGE.connexionRequise()){ S = null; ui.ecran = "accueil"; app.innerHTML = connexionHTML(); return; }
  if(ui.ecran === "admin" && !PROFIL.etat.admin) ui.ecran = "accueil";
  app.innerHTML = ui.ecran === "admin" ? ADMIN.html() : ui.ecran === "jeu" && S ? batailleHTML() : ui.ecran === "accueil" ? accueilHTML() : ui.ecran === "bientot" ? bientotHTML() : ui.ecran === "leblanc" ? leblancHTML() : ui.ecran === "velvet" ? velvetHTML() : prepHTML();
  if(idActif){ const el = document.getElementById(idActif); if(el){ el.focus({preventScroll:true}); try { if(pos != null) el.setSelectionRange(pos, pos); } catch(e){} } }
  if(typeof MUSIQUE !== "undefined") MUSIQUE.jouer(slotMusique());
  // Sur le même écran, rien ne bouge : ni la page, ni les listes qui défilent
  if(ui.ecran === ecranAvant){
    ZONES_DEFILEMENT.forEach((sel, k) => document.querySelectorAll(sel).forEach((e, i) => { const p = defilements[k][i]; if(p){ e.scrollTop = p[0]; e.scrollLeft = p[1]; } }));
    window.scrollTo(x, y);
  }
  if(ui.ecran === "jeu" && S){ effetsBataille(); const m = document.querySelector(".main-cartes"); if(m) m.scrollLeft = sx; window.scrollTo(x, y); }
}

/* ---------- Déroulement : ordinateur, actions du joueur ---------- */
// Tant que c’est à l’ordinateur d’agir, il joue une action à la fois, avec une pause pour qu’on suive
function suite(){
  if(!S || S.fini){ ui.bt.ia = false; render(); return; }
  const c = S.acteur && KC.trouver(S.C, S.acteur);
  if(S.phase !== "combat" || !c || c.camp !== 1){ ui.bt.ia = false; ui.bt.rapide = false; render(); return; }
  ui.bt.ia = true; render();
  const partie = S;
  setTimeout(() => {
    if(S !== partie) return;
    IA_BATAILLE.agir(S);
    suite();
  }, ui.bt.rapide ? 60 : 900);
}
function demarrer(){
  const P = PROFIL.profil, c0 = cfg.joueurs[0], d = P && c0.deckId ? P.decks.find(x => x.id === c0.deckId) : null;
  const leader = d ? d.leader : c0.leader, deck = d ? Object.keys(d.cartes) : deckTest();
  S = BT.creer({seed: cfg.seed++, joueurs:[{nom: (P && P.nomCode) || "Vous", leader, deck, evo: d && P ? PROFIL.confident(leader).evo : 0}, {nom:"L’ordinateur", leader: cfg.joueurs[1].leader, deck: deckOrdinateur(deck, cfg.joueurs[1].leader), ia:true}]});
  S.deckId = d ? d.id : null;
  ui.bt = {sel:[], skill:null, cibles:[], ia:false, rapide:false, vu:0};
  Object.assign(ui, {ecran:"jeu", loupe:null, regles:false});
  render();
}
// Cibles possibles d’un skill pour le combattant qui agit
function ciblesDe(idSkill){
  const c = KC.trouver(S.C, S.acteur), s = idSkill === "attaque" || idSkill === "tir" ? KC.attaqueDeBase(idSkill) : M.C[idSkill];
  if(s.cible === "un") return KC.ennemis(S.C, c).map(x => x.id);
  if(s.cible === "allie") return (s.effets.some(e => e.t === "reanimer") ? S.C.combattants.filter(x => x.camp === c.camp && x.ko && !x.leader && BT.enJeu(S, c.camp).length >= 0) : KC.allies(S.C, c)).map(x => x.id);
  return null;   // pas de cible à choisir
}
function agirJoueur(idSkill, idCible){
  const r = BT.agir(S, idSkill, idCible);
  ui.bt.skill = null; ui.bt.cibles = []; ui.bt.defausse = false;
  if(!r.ok){ toast(r.raison || "Action impossible."); render(); return; }
  suite();
}
function toast(t){ const b = document.createElement("div"); b.className = "toast"; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 2600); }
function clicBataille(act, id){
  if(act === "quitter"){ if(S.fini || confirm("Abandonner la partie ? Elle comptera comme une défaite.")){ if(!S.fini){ S.fini = true; S.vainqueur = 1; recompense(); } S = null; ui.ecran = "prep"; render(); } return; }
  if(act === "rejouer"){ demarrer(); return; }
  if(act === "passer"){ ui.bt.rapide = true; return; }
  if(S.fini || ui.bt.ia) return;
  const c = S.acteur && KC.trouver(S.C, S.acteur);
  switch(act){
    case "sel": {
      if(S.phase !== "placement") return;
      const i = ui.bt.sel.indexOf(id);
      if(i >= 0) ui.bt.sel.splice(i, 1); else if(ui.bt.sel.length < BT.placesLibres(S, 0) && BT.jouables(S, 0).includes(id)) ui.bt.sel.push(id);
      render(); return;
    }
    case "rappel": { const r = BT.rappeler(S, 0, id); if(!r.ok) toast(r.raison); render(); return; }
    case "reveler": {
      IA_BATAILLE.placer(S, 1);
      const r = BT.poser(S, 0, ui.bt.sel);
      if(!r.ok){ toast(r.raison); render(); return; }
      ui.bt.sel = []; suite(); return;
    }
    case "skill": {
      if(!c || c.camp !== 0 || S.unPlus) return;
      if(id === "garde"){ agirJoueur("garde"); return; }
      // Réanimation : choisir une Persona de la défausse
      if(BT.estReanimation(M.C[id])){ ui.bt.skill = id; ui.bt.cibles = []; ui.bt.defausse = true; render(); return; }
      const cibles = ciblesDe(id);
      if(!cibles){ agirJoueur(id, null); return; }
      if(!cibles.length){ toast("Aucune cible possible."); return; }
      if(cibles.length === 1 && ui.bt.skill === id){ agirJoueur(id, cibles[0]); return; }
      ui.bt.skill = id; ui.bt.cibles = cibles; render(); return;
    }
    case "skill-annuler": ui.bt.skill = null; ui.bt.cibles = []; ui.bt.defausse = false; render(); return;
    case "cible-def": if(ui.bt.skill && ui.bt.defausse) agirJoueur(ui.bt.skill, id); return;
    case "cible": if(ui.bt.skill && ui.bt.cibles.includes(id)) agirJoueur(ui.bt.skill, id); return;
    case "om": { const r = BT.unPlus(S, id); if(r && r.ok === false) toast(r.raison || "Impossible."); suite(); return; }
    case "om-relais": { const r = BT.unPlus(S, "relais", id); if(r && r.ok === false) toast(r.raison || "Impossible."); suite(); return; }
  }
}
// Chiffres qui s’envolent au-dessus des combattants touchés, et bandeaux One More / All-Out Attack
function effetsBataille(){
  const nouveaux = S.journal.slice(ui.bt.vu); ui.bt.vu = S.journal.length;
  let cut = null;
  for(const e of nouveaux){
    if(e.t === "allout") cut = ["All-Out Attack !", false];
    else if(e.t === "onemore" && !cut) cut = ["One More !", true];
    else if(e.t === "tour" && e.tour > 1 && !cut) cut = [`Tour ${e.tour}`, true];
    const cible = e.cible && app.querySelector(`[data-cb="${e.cible}"]`);
    if(!cible) continue;
    const txt = e.t === "degats" ? `−${e.v}` : e.t === "soin" ? `+${e.v}` : e.t === "alteration" ? (TEXTES_SKILLS.NOMS_ETATS[e.etat] || "") : e.t === "rate" ? "Raté" : null;
    if(!txt) continue;
    const s = document.createElement("span"); s.className = "flot " + (e.t === "soin" ? "soin" : e.t === "degats" ? "" : "info") + (e.faiblesse ? " faible" : "") + (e.critique ? " crit" : ""); s.textContent = txt + (e.faiblesse ? " Faible !" : e.critique ? " Critique !" : "");
    cible.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
  if(cut && !ui.bt.rapide) cutin(cut[0], cut[1]);
}

/* ---------- Simulation (Administration) ---------- */
function simuler(){
  const s = ui.simu = {total:cfg.nbSimu, fait:0, v:[0, 0], tours:0, ko:0, om:0, aoa:0, min:Infinity, max:0, enCours:true, l0:cfg.joueurs[0].leader, l1:cfg.joueurs[1].leader};
  const P = PROFIL.profil, d = P && cfg.joueurs[0].deckId ? P.decks.find(x => x.id === cfg.joueurs[0].deckId) : null;
  if(d) s.l0 = d.leader;
  let graine = cfg.seed * 1000;
  const lot = () => {
    if(ui.simu !== s) return;
    for(let k = 0; k < 5 && s.fait < s.total; k++){
      const deck = d ? Object.keys(d.cartes) : deckTest();
      const T = IA_BATAILLE.jouerPartie(BT.creer({seed: graine++, joueurs:[{leader:s.l0, deck, ia:true}, {leader:s.l1, deck:deckOrdinateur(deck, s.l1), ia:true}]}));
      if(T.vainqueur === 0 || T.vainqueur === 1) s.v[T.vainqueur]++;
      s.tours += T.tour; s.min = Math.min(s.min, T.tour); s.max = Math.max(s.max, T.tour); s.fait++;
      s.ko += T.stats[0].ko + T.stats[1].ko; s.om += T.stats[0].onemore + T.stats[1].onemore; s.aoa += T.stats[0].aoa + T.stats[1].aoa;
    }
    if(s.fait >= s.total) s.enCours = false;
    if(ui.ecran === "prep") render();
    if(s.enCours) setTimeout(lot, 0);
  };
  render(); setTimeout(lot, 30);
}
/* ---------- Actions du Café Leblanc ---------- */
function actionCafe(act, id){
  const f = ui.cafe, P = PROFIL.profil;
  switch(act){
    case "cafe-onglet": f.onglet = id; f.edit = null; break;
    case "filtre-el": f.el = id; break;
    case "deck-modifier": { const d = P.decks.find(x => x.id === id); f.edit = id; f.brouillon = {nom:d.nom, leader:d.leader, cartes:Object.assign({}, d.cartes)}; break; }
    case "deck-actif": PROFIL.choisirDeckActif(id); break;
    case "deck-suppr": if(confirm("Supprimer ce deck ?")) PROFIL.supprimerDeck(id); break;
    case "deck-nouveau": { const d = PROFIL.creerDeck(f.nouveauLeader); f.edit = d.id; f.brouillon = {nom:d.nom, leader:d.leader, cartes:Object.assign({}, d.cartes)}; break; }
    case "deck-plus": f.brouillon.cartes[id] = (f.brouillon.cartes[id] || 0) + 1; break;
    case "deck-moins": f.brouillon.cartes[id]--; if(f.brouillon.cartes[id] <= 0) delete f.brouillon.cartes[id]; break;
    case "deck-vider": f.brouillon.cartes = {}; break;
    case "deck-completer": f.brouillon.cartes = PROFIL.completerDeck(f.brouillon.cartes, f.brouillon.leader); break;
    case "deck-annuler": f.edit = null; f.brouillon = null; break;
    case "deck-enregistrer": PROFIL.majDeck(f.edit, {nom: f.brouillon.nom.trim() || "Deck sans nom", leader: f.brouillon.leader, cartes: f.brouillon.cartes}); f.edit = null; f.brouillon = null; break;
    case "prendre": { const [i, cid] = id.split(":"); PROFIL.choisirRecompense(+i, cid); break; }
    default: return;
  }
  render();
}

  if(act === "aller"){
    if(id === "accueil"){ S = null; ui.ecran = "accueil"; }
    else if(id === "duel"){ const d = PROFIL.profil && PROFIL.deckActif(); cfg.joueurs[0].deckId = d && PROFIL.validerDeck(d).ok ? d.id : null; cfg.joueurs[0].leader = d && cfg.joueurs[0].deckId ? d.leader : (PROFIL.profil ? PROFIL.profil.leaderFavori : cfg.joueurs[0].leader); ui.ecran = "prep"; }
    else if(id === "leblanc"){ ui.ecran = "leblanc"; ui.cafe.edit = null; }
    else if(id === "velvet"){ ui.ecran = "velvet"; ui.velvet.confirm = null; ui.velvet.resultat = null; }
    else if(id === "admin"){ if(PROFIL.etat.admin){ ui.ecran = "admin"; ADMIN.ouvrir(); } else ui.ecran = "accueil"; }
    else { ui.ecran = "bientot"; ui.section = id; }
    ui.regles = false; render(); window.scrollTo(0, 0); return;
  }
  if(act === "deconnexion"){ ui.compte = {email:"", envoye:false, enCours:false, erreur:null}; STOCKAGE.deconnexion().then(render); return; }
  if(act === "autre-email"){ ui.compte.envoye = false; render(); return; }
  if(STOCKAGE.connexionRequise()) return;
  if(ui.ecran === "leblanc"){ actionCafe(act, id); return; }
  if(ui.ecran === "velvet"){ actionVelvet(act, id); return; }
  if(ui.ecran === "admin"){ ADMIN.clic(act, id, b); return; }
  if(act === "prendre"){ const [i, cid] = id.split(":"); PROFIL.choisirRecompense(+i, cid); if(S && S.recompense){ S.recompense.prise = cid; S.recompense.offre = null; } render(); return; }
  if(ui.ecran === "accueil" || ui.ecran === "bientot") return;
  if(ui.ecran === "prep"){
    if(act === "leader"){ const [k, l] = id.split(":"); cfg.joueurs[+k].leader = l; render(); }
    if(act === "jouer") demarrer();
    if(act === "simuler") simuler();
    return;
  }
  if(ui.ecran === "jeu" && S){ clicBataille(act, id); return; }
});
app.addEventListener("submit", async e => {
  if(e.target.dataset.form !== "connexion") return;
  e.preventDefault();
  const c = ui.compte; c.email = document.getElementById("compte-email").value.trim(); c.erreur = null; c.enCours = true; render();
  try { await STOCKAGE.connexion(c.email); c.envoye = true; }
  catch(err){ c.erreur = "Le lien n’a pas pu être envoyé. Vérifiez l’adresse, puis réessayez."; }
  c.enCours = false; render();
});
app.addEventListener("change", e => {
  const t = e.target;
  if(ui.ecran === "admin"){ ADMIN.saisie(t, "change"); return; }
  if(t.dataset.profil === "nom"){ PROFIL.renommer(t.value); return; }
  if(t.dataset.filtre === "type" || t.dataset.filtre === "rang"){ ui.cafe[t.dataset.filtre] = t.value; render(); return; }
  if(t.dataset.velvet === "arc"){ ui.velvet.arc = t.value; render(); return; }
  if(t.dataset.cafe === "nouveauLeader"){ ui.cafe.nouveauLeader = t.value; return; }
  if(t.dataset.cafe === "brouillonLeader"){ ui.cafe.brouillon.leader = t.value; render(); return; }
  if(t.dataset.deck === "choix"){ const d = PROFIL.profil.decks.find(x => x.id === t.value); cfg.joueurs[0].deckId = d ? d.id : null; if(d) cfg.joueurs[0].leader = d.leader; render(); return; }
});
app.addEventListener("input", e => {
  const t = e.target, v = +t.value;
  if(ui.ecran === "admin"){ ADMIN.saisie(t, "input"); return; }
  if(t.dataset.filtre === "q"){ ui.cafe.q = t.value; render(); return; }
  if(t.dataset.velvet === "q"){ ui.velvet.q = t.value; render(); return; }
  if(t.dataset.cafe === "brouillonNom"){ ui.cafe.brouillon.nom = t.value; return; }
  void v;
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(ui.regles){ ui.regles = false; render(); }
  else if(ui.ecran === "jeu" && S && ui.bt.skill){ ui.bt.skill = null; ui.bt.cibles = []; render(); }
});
window.UI = {iconeEl, esc, carteJeu, loupeHTML, txtEffet, chipEl, nomEl, portrait, ARCANES, ORDRE_EL, ELEMENTS, LEADERS, render, pl, get ecran(){ return ui.ecran; },
  aller(e){ ui.ecran = e; render(); window.scrollTo(0, 0); }};
render();
PROFIL.init(() => { if(ui.ecran !== "jeu" || STOCKAGE.connexionRequise()) render(); });
})();

</script>
