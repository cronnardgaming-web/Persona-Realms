  violet:{nom:"Violet", vrai:"Kasumi Yoshizawa", arcane:"foi", el:"sac", faiblesse:"mau", capa:{pv:2}, persona:"Cendrillon", evos:["Vanadis", "Ella"]}
};

// Recalculé quand l’Admin modifie un Leader.
function genererDerivees(){
  for(const id of Object.keys(C)) if(/^depart_.+_evo\d$|^visite_/.test(id)) delete C[id];
  const normal = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  // Les Personas des Leaders et leurs évolutions leur sont réservées : ni récompense, ni deck
  const reservees = new Set(Object.values(LEADERS).flatMap(L => [L.persona, ...(L.evos || [])]).map(normal).filter(Boolean));
  for(const c of Object.values(C)) if(!c.depart){ if(reservees.has(normal(c.nom))) c.reservee = true; else delete c.reservee; }
}
genererDerivees();

const def = c => C[c.id];

return {R, C, ELEMENTS, LEADERS, def, genererDerivees};
})();
if(typeof module !== "undefined") module.exports = MOTEUR;

</script>
<script>
/* ============================================================
   TEXTES DES SKILLS — description en français, tirée des effets.
   Utilisé par l’import (outils/importer-skills.js) et par le jeu,
   pour que la description suive les réglages de l’Administration.
   ============================================================ */
const TEXTES_SKILLS = (function(){
const NOMS_ETATS = {brulure:"Brûlure", gel:"Gel", choc:"Choc", vertige:"Vertige", confusion:"Confusion", peur:"Peur", oubli:"Oubli", sommeil:"Sommeil", rage:"Rage", desespoir:"Désespoir", lavage:"Lavage de cerveau", faim:"Faim"};
const NOMS_EL = {phy:"Physique", gun:"Gun", feu:"Feu", gla:"Glace", ele:"Électricité", ven:"Vent", psy:"Psy", nuc:"Nucléaire", sac:"Sacré", mau:"Maudit", pur:"Pur", magie:"magiques", mort:"de mort instantanée"};
const nEl = e => NOMS_EL[e] || e;
const x = v => String(v).replace(".", ",");
const cibleTxt = {un:"1 ennemi", tous:"tous les ennemis", allie:"1 allié", allies:"tous les alliés", soi:"soi-même", universel:"tout le monde"};
const coupsTxt = c => !c ? "" : c[0] === c[1] ? (c[0] > 1 ? ` ${c[0]} fois` : "") : ` ${c[0]} à ${c[1]} fois`;
const etatTxt = e => NOMS_ETATS[e] || e;
function phrase(e, s, S, vus){
  switch(e.t){
    case "degats": return `Dégâts ${e.el === "pur" ? "Pur" : e.el === "phy" ? "physiques" : e.el === "gun" ? "Gun" : "de " + nEl(e.el)} (puissance ${e.puissance}) à ${cibleTxt[s.cible] || "la cible"}${coupsTxt(e.coups || s.coups)}`;
    case "alteration": return `${e.chance} % de chances d’infliger ${etatTxt(e.etat)}`;
    case "mort": return `${e.chance} % de chances de mort instantanée${e.el === "mau" && s.el !== "mau" ? " (Maudit)" : ""}`;
    case "mortSi": return `Tue sur le coup les ennemis sous ${etatTxt(e.etat)} (${e.chance} %)`;
    case "fraction": return `Réduit les PV actuels de ${e.pct} %`;
    case "drain": return `Inflige ${e.degats} dégâts et rend autant de ${e.ressource === "sp" ? "SP" : "PV"}`;
    case "sensibilite": return `Sensibilité aux altérations ×${x(e.mult)} pendant ${e.tours} tours`;
    case "bonusATerre": return `Bonus contre un ennemi à terre porté à ×${x(e.mult)}`;
    case "malusSoi": return `Ensuite, les dégâts du lanceur sont multipliés par ${x(e.mult)} jusqu’à la fin du combat`;
    case "bonusRelais": return `Dégâts ×${x(e.mult)} après un Relais`;
    case "condition": return "Utilisable seulement quand le groupe est encerclé";
    case "comme": return vus.has(e.skill) || !S[e.skill] ? `Effet de ${e.skill}` : texte(S[e.skill], S, new Set([...vus, e.skill]));
    case "soin": return `Rend des PV (puissance ${e.puissance})`;
    case "soinPct": return `Rend ${e.pct} % des PV`;
    case "reanimer": return `Ranime un allié K.O. avec ${e.pct} % de ses PV`;
    case "guerir": return `Guérit : ${(e.etats || []).map(etatTxt).join(", ")}`;
    case "stat": return `${{atq:"Attaque", def:"Défense", agi:"Précision et esquive"}[e.stat]} ×${x(e.mult)} pendant ${e.tours} tours`;
    case "charge": return `Prochaine attaque ${e.type === "magie" ? "magique" : "Physique ou Gun"} : dégâts ×${x(e.mult)}`;
    case "critPlus": return `Taux de critique +${e.plus} %${e.tours ? ` pendant ${e.tours} tours` : ""}${e.el ? " (Gun)" : ""}${e.si === "embuscade" ? " après une embuscade réussie" : e.si === "encercle" ? " quand le groupe est encerclé" : ""}`;
    case "karn": return `Renvoie la prochaine attaque ${e.type === "magie" ? "magique (hors Pur)" : "Physique ou Gun"}`;
    case "bloque": return "Annule la prochaine attaque de mort instantanée";
    case "retire": return {"karn-phys":"Retire Tetrakarn", "karn-magie":"Retire Makarakarn", kaja:"Annule les bonus (-kaja)", kunda:"Annule les malus (-kunda)"}[e.quoi];
    case "mur": return `Ajoute une résistance au ${nEl(e.el)} pendant ${e.tours} tours`;
    case "brise": return `Retire la résistance au ${nEl(e.el)} pendant ${e.tours} tours`;
    case "boost": return `Dégâts ${e.el === "magie" ? "magiques" : e.el === "pur" ? "Pur" : "de " + nEl(e.el)} infligés ×${x(e.mult)}`;
    case "boostDegats": return `Dégâts infligés ×${x(e.mult)}${e.depassePlafond ? ", sans plafond" : ""}`;
    case "boostAOA": return `Dégâts de l’All-Out Attack ×${x(e.mult)}`;
    case "cout": return `Coût des skills en ${e.ressource === "pv" ? "PV" : e.ressource === "sp" ? "SP" : "PV et SP"} ×${x(e.mult)}`;
    case "boostSoin": return `Puissance des soins ×${x(e.mult)}`;
    case "esquive": return `Esquive ${e.el === "tout" ? "" : e.el === "magieHorsPur" ? "contre la magie (hors Pur) " : "contre le " + nEl(e.el) + " "}×${x(e.mult)}${e.si === "meteo" ? " par météo spéciale" : ""}`;
    case "affinite": return `${{rs:"Résiste au", nu:"Annule le", rp:"Renvoie le", ab:"Absorbe le"}[e.val]} ${nEl(e.el)}`;
    case "boostAlt": return `Chance d’infliger ${e.etat === "tous" ? "les altérations" : e.etat === "mort-sac" ? "la mort instantanée (Sacré)" : e.etat === "mort-mau" ? "la mort instantanée (Maudit)" : etatTxt(e.etat)} ×${x(e.mult)}${e.si === "meteo" ? " par météo spéciale" : ""}`;
    case "resistAlt": return `Sensibilité ${e.etat === "tous" ? "aux altérations" : "à " + etatTxt(e.etat)} ×${x(e.mult)}`;
    case "immunise": return `Immunisé : ${(e.etats || []).map(etatTxt).join(", ")}`;
    case "contre": return `${e.chance} % de chances de renvoyer les dégâts ${(e.types || []).map(nEl).join(" ou ")} reçus`;
    case "auto": return `Lance ${S[e.skill] ? S[e.skill].nom : e.skill} au début du combat`;
    case "regen": return e.ressource === "pv" ? `Rend ${e.pct} % des PV à chaque tour${e.si ? " après une embuscade réussie" : ""}` : `Rend ${e.n} SP à chaque tour${e.si ? " après une embuscade réussie" : ""}`;
    case "croissance": return `Gagne ${e.pct} % de l’expérience même sans combattre`;
    case "apresCombat": return `Après le combat, rend ${e.pvPct} % des PV et des SP maximum`;
    case "endure": return e.pvPct ? "Une fois par combat, survit à un coup mortel avec tous ses PV" : `Une fois par combat, survit ${e.contre === "mort" ? "à une mort instantanée" : "à un coup mortel"} avec 1 PV`;
    case "critRecu": return `Critiques reçus ×${x(e.mult)}`;
    case "critMult": return `Taux de critique ×${x(e.mult)}`;
    case "precisionRecue": return `Précision des ennemis contre soi ×${x(e.mult)}${e.si ? " quand le groupe est encerclé" : ""}`;
    case "guerisonRapide": return e.tours ? "Les altérations ne durent qu’un tour" : `Durée des altérations ×${x(e.mult)}`;
    case "degatsRecus": return `Dégâts reçus ×${x(e.mult)}, mais aucune esquive`;
    case "apresRelais": return e.skill ? `Lance ${S[e.skill] ? S[e.skill].nom : e.skill} après un Relais` : `Rend ${e.sp} SP après un Relais`;
    case "releve": return `Après le combat, rend ${e.pct} % des ${e.ressource === "sp" ? "SP" : "PV"} aux alliés en réserve`;
    case "navigation": return {soutienMoral:"Peut lancer un bonus (-kaja) ou un soin pendant le combat", soutienMoralPlus:`Ajoute au Soutien moral : ${e.ajoute || ""}`, releveUrgence:"Peut échanger le groupe avec la réserve quand 2 alliés sont K.O.", gardeFinale:"Peut annuler un coup mortel pour tout le groupe", braquage:"Peut braquer les ennemis au début du combat", analyse:"Affiche les affinités déjà découvertes des ennemis"}[e.quoi];
    case "exploration": return {objetRare:"Repère les ennemis qui portent un objet rare", carteMementos:"Peut révéler tout l’étage de Mementos en y entrant", fouilles:"Peut restaurer les objets à fouiller après le combat"}[e.quoi];
  }
  return e.t;
}
// Texte complet d’un skill (S : catalogue de tous les skills, pour les skills repris)
function texte(s, S, vus){ return (s.effets || []).map(e => phrase(e, s, S || {}, vus || new Set())).filter(Boolean).join(". "); }
return {texte: (s, S) => texte(s, S) + ".", NOMS_ETATS, NOMS_EL};
})();
if(typeof module !== "undefined") module.exports = TEXTES_SKILLS;

</script>
<script>
/* ============================================================
   COMBAT — moteur façon Persona 5 Royal
   Exécute les effets des skills (donnees/skills-p5r.json) entre
   combattants qui ont PV, PS, stats et affinités.
   Les chiffres des skills sont ceux de P5R ; les formules internes
   (dégâts, faiblesse, critique, durées…) sont des approximations
   de la communauté, toutes regroupées dans REGLAGES.
   ============================================================ */
const COMBAT = (function(){
// Dans le navigateur, les skills sont lus dans les cartes du jeu (réglages de l’Administration compris)
const SKILLS = typeof require !== "undefined" && typeof window === "undefined" ? require("../donnees/skills-p5r.json") : (typeof MOTEUR !== "undefined" ? MOTEUR.C : {});

const REGLAGES = {
  degatsBase: 5,          // dégâts = base × √(attaque ÷ endurance × puissance)
  variation: 0.05,        // ±5 % de hasard sur les dégâts
  plafond: 9999,
  puissanceAOA: 100,
  garde: 0.5,      // puissance de chaque membre dans l’All-Out Attack
  aoaLeader: 1,           // multiplicateur des dégâts de l’All-Out Attack sur le Leader
  faiblesse: 1.25, resiste: 0.5,
  critique: 1.5, technique: 1.5, aTerre: 1,      // multiplicateurs ; « à terre » : bonus par défaut (Rebellion Blade le porte à ×2,5)
  relais: [1, 1.5, 2, 2.5],                      // bonus de dégâts et de soins selon le nombre de Relais enchaînés
  soinBase: 5,            // soin = base × √(magie × puissance)
  attaque: {el:"phy", puissance:50, precision:95, critique:5},   // attaque de base (Rage, Confusion, Lavage)
  tir: {el:"gun", puissance:50, precision:90, critique:10},      // tir de base
  dureeAlteration: 3,
  brulurePct: 6, sommeilPct: 8, desespoirPct: 8,  // % des PV / SP perdus ou rendus à chaque tour
  peurInaction: 0.5, rageAttaque: 1.5, rageDefense: 0.5, faimAttaque: 0.5, vertigePrecision: 0.5,
  chocContagion: 0.5,     // chance qu’un attaquant au corps à corps attrape le Choc
  mortFaiblesse: 1.5, mortResiste: 0.5,
  chanceLuck: 0.5,        // points de % gagnés par point de Chance d’écart (critique, altérations, morts)
  navigation: {soutienMoral:0.2, gardeFinale:0.25, releveUrgence:0.5, braquage:0.3},
  exploration: {carteMementos:0.3, fouilles:0.3}
};
// Faiblesses techniques : altération → éléments qui déclenchent une Technique
const TECHNIQUE = {brulure:["ven","nuc"], gel:["phy","gun","nuc"], choc:["phy","gun","nuc"], sommeil:["phy","gun"],
  vertige:["psy"], confusion:["psy"], peur:["psy"], oubli:["psy"], rage:["psy"], desespoir:["psy"], lavage:["psy"], faim:["psy"]};
const INACTIFS = ["gel", "choc", "sommeil", "desespoir"];   // ne peuvent pas agir
const PHYSIQUES = ["phy", "gun"];
const ORDRE_AFF = {"-":0, wk:-1, rs:1, nu:2, rp:3, ab:4};

/* ---------- Hasard reproductible ---------- */
function alea(C){ let t = C.rng = (C.rng + 0x6D2B79F5) | 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const tirage = (C, pct) => alea(C) * 100 < pct;
const log = (C, texte, ev) => { C.journal.push(Object.assign({texte}, ev || {})); };

/* ---------- Combattants ---------- */
// def : {id, nom, camp, niveau, pv, sp, stats:{for,mag,end,agi,cha}, affinites:{feu:"wk"…}, skills:[ids], boss, reserve}
function combattant(def){
  const c = Object.assign({niveau:1, affinites:{}, skills:[], stats:{for:1, mag:1, end:1, agi:1, cha:1}}, def);
  c.pvMax = c.pvMax || c.pv; c.spMax = c.spMax || c.sp; c.pv = c.pv ?? c.pvMax; c.sp = c.sp ?? c.spMax;
  Object.assign(c, {etat:null, mods:{}, charge:{}, critBonus:null, karn:{}, bloqueMort:false, murs:{}, brises:{}, sensibilite:null,
    malusSoi:1, endure:{}, aTerre:false, ko:false, relais:0, unPlus:false, bonusATerre:null});
  apprendre(c, c.skills);
  c.bonus = c.bonus || [];
  return c;
}
// (Re)calcule les passifs d’un combattant à partir de ses skills
function apprendre(c, skills){ c.skills = skills; c.passifs = skills.map(id => SKILLS[id]).filter(s => s && s.categorie === "passif").flatMap(s => s.effets); }
const passifs = (c, t) => (c.bonus && c.bonus.length ? c.passifs.concat(c.bonus) : c.passifs).filter(e => e.t === t && (!e.si || e.si === c.combat?.situation || (e.si === "meteo" && c.combat?.meteo)));
const produit = (l, f) => l.reduce((m, e) => m * f(e), 1);
const cumul = l => 1 + l.reduce((s, e) => s + (e.mult - 1), 0);   // Boost + Amp s’additionnent

/* ---------- Combat ---------- */
// cfg : {camps:[[defs], [defs]], situation:"normal"|"embuscade"|"encercle", meteo, seed, navigateur:def}
function creer(cfg){
  const C = {rng:(cfg.seed >>> 0) || 1, tour:1, situation:cfg.situation || "normal", meteo:!!cfg.meteo, journal:[], combattants:[], navigateur:null, analyse:false, plafondLeve:false};
  cfg.camps.forEach((camp, i) => camp.forEach(d => { const c = combattant(Object.assign({camp:i}, d)); c.combat = C; C.combattants.push(c); }));
  if(cfg.navigateur){ C.navigateur = combattant(Object.assign({camp:0}, cfg.navigateur)); C.navigateur.combat = C; }
  // Effets de début de combat : skills automatiques, navigateur
  for(const c of actifs(C)) for(const e of passifs(c, "auto")) utiliser(C, c.id, e.skill, c.id, {gratuit:true, auto:true});
  const nav = C.navigateur;
  if(nav){
    if(aNav(C, "analyse")) C.analyse = true;
    if(aNav(C, "braquage") && tirage(C, REGLAGES.navigation.braquage * 100)){ for(const c of actifs(C).filter(x => x.camp === 1)) c.aTerre = true; log(C, "Braquage : tous les ennemis sont à terre.", {t:"braquage"}); }
  }
  return C;
}
const aNav = (C, quoi) => C.navigateur && C.navigateur.passifs.some(e => e.t === "navigation" && e.quoi === quoi);
const actifs = C => C.combattants.filter(c => !c.ko && !c.reserve);
const trouver = (C, id) => C.combattants.find(c => c.id === id);
const allies = (C, c) => actifs(C).filter(x => x.camp === c.camp);
const ennemis = (C, c) => { const l = actifs(C).filter(x => x.camp !== c.camp); return l.some(x => !x.leader) ? l.filter(x => !x.leader) : l; };

/* ---------- Valeurs calculées ---------- */
function affinite(c, el){
  let a = c.affinites[el] || "-";
  for(const e of passifs(c, "affinite")) if(e.el === el && ORDRE_AFF[e.val] > ORDRE_AFF[a]) a = e.val;
  if(c.murs[el]) a = a === "wk" ? "-" : a === "-" ? "rs" : a;
  if(c.brises[el] && ["rs", "nu", "rp"].includes(a)) a = "-";
  return a;
}
const mod = (c, stat) => (c.mods[stat] ? c.mods[stat].mult : 1);
function coutDe(c, s){
  if(!s.cout) return {pv:0, sp:0};
  const mPV = produit(passifs(c, "cout").filter(e => e.ressource === "pv"), e => e.mult), mSP = produit(passifs(c, "cout").filter(e => e.ressource === "sp"), e => e.mult);
  // Résonance (partie de cartes) : skills de l’élément du Leader −25 % de SP
  const res = c.resonance && s.el === c.resonance ? 0.75 : 1;
  return {pv: s.cout.pvPct ? Math.max(1, Math.floor(c.pvMax * s.cout.pvPct / 100 * mPV)) : 0, sp: s.cout.sp ? Math.ceil(s.cout.sp * mSP * res) : 0};
}

/* ---------- Peut-il agir ? ---------- */
function peutAgir(C, c){
  if(c.ko) return {ok:false, raison:"K.O."};
  const e = c.etat && c.etat.type;
  if(INACTIFS.includes(e)) return {ok:false, raison:`${nomEtat(e)} : ne peut pas agir`};
  if(e === "peur" && alea(C) < REGLAGES.peurInaction) return {ok:false, raison:"Peur : paralysé par la peur"};
  if(e === "rage") return {ok:true, force:"attaqueAleatoire"};
  if(e === "confusion"){ const r = alea(C); return r < 1/3 ? {ok:false, raison:"Confusion : ne fait rien"} : r < 2/3 ? {ok:true, force:"attaqueAleatoire"} : {ok:true}; }
  if(e === "lavage" && alea(C) < 0.5) return {ok:true, force:"aideEnnemi"};
  return {ok:true};
}
const NOMS = {brulure:"Brûlure", gel:"Gel", choc:"Choc", vertige:"Vertige", confusion:"Confusion", peur:"Peur", oubli:"Oubli", sommeil:"Sommeil", rage:"Rage", desespoir:"Désespoir", lavage:"Lavage de cerveau", faim:"Faim"};
const nomEtat = e => NOMS[e] || e;

/* ---------- Utiliser un skill ---------- */
// opts : {gratuit, auto, sousSkill} — renvoie {ok, raison}
function utiliser(C, idLanceur, idSkill, idCible, opts){
  opts = opts || {};
  const L = trouver(C, idLanceur) || (C.navigateur && C.navigateur.id === idLanceur ? C.navigateur : null), s = idSkill === "attaque" || idSkill === "tir" ? attaqueDeBase(idSkill) : SKILLS[idSkill];
  if(!L || !s) return {ok:false, raison:"Lanceur ou skill inconnu."};
  if(s.categorie === "passif") return {ok:false, raison:"Un skill passif agit tout seul."};
  if(!opts.sousSkill && !opts.auto){
    const p = peutAgir(C, L); if(!p.ok) return p;
    if(L.etat && L.etat.type === "oubli" && idSkill !== "attaque" && idSkill !== "tir") return {ok:false, raison:"Oubli : aucun skill utilisable"};
    for(const e of s.effets) if(e.t === "condition" && e.si === "encercle" && C.situation !== "encercle") return {ok:false, raison:"Utilisable seulement quand le groupe est encerclé."};
    const k = coutDe(L, s);
    if(!opts.gratuit){
      const bourse = L.bourse || L;
      if(k.sp > bourse.sp) return {ok:false, raison:`Pas assez de SP (${k.sp} nécessaires).`};
      if(k.pv && k.pv >= L.pv) return {ok:false, raison:`Pas assez de PV (${k.pv} nécessaires).`};
      bourse.sp -= k.sp; L.pv -= k.pv;
    }
    L.unPlus = false;
    log(C, `${L.nom} utilise ${s.nom}.`, {t:"skill", lanceur:L.id, skill:idSkill});
  }
  const cibles = opts.cibles || ciblesDe(C, L, s, idCible);
  for(const e of s.effets) appliquer(C, L, s, e, cibles);
  if(!opts.sousSkill){ if(L.relais && !L.unPlus) L.relais = 0; }
  return {ok:true, cibles:cibles.map(c => c.id)};
}
function attaqueDeBase(type){ const a = REGLAGES[type === "tir" ? "tir" : "attaque"]; return {nom:type === "tir" ? "Tir" : "Attaque", el:a.el, categorie:"attaque", cible:"un", effets:[{t:"degats", el:a.el, puissance:a.puissance, coups:[1, 1], precision:a.precision, critique:a.critique}]}; }
// Un skill ranime-t-il (directement ou par un skill qu’il reprend) ?
const ranime = s => s.effets.some(e => e.t === "reanimer" || (e.t === "comme" && SKILLS[e.skill] && ranime(SKILLS[e.skill])));
function ciblesDe(C, L, s, idCible){
  const une = l => { const c = idCible ? l.find(x => x.id === idCible) : l[0]; return c ? [c] : l.slice(0, 1); };
  switch(s.cible){
    case "un": return une(ennemis(C, L));
    case "tous": return ennemis(C, L);
    case "allie": return ranime(s) ? une(C.combattants.filter(x => x.camp === L.camp && x.ko)) : une(allies(C, L));
    case "allies": return ranime(s) ? C.combattants.filter(x => x.camp === L.camp && x.ko) : allies(C, L);
    case "soi": return [L];
    case "universel": return actifs(C);
    default: return [L];
  }
}

/* ---------- Effets ---------- */
function appliquer(C, L, s, e, cibles){
  switch(e.t){
    case "degats": for(const c of cibles) frapper(C, L, s, e, c); break;
    case "alteration": for(const c of cibles) if(!c.ko && !c.esquive) alterer(C, L, c, e.etat, e.chance); break;
    case "mort": for(const c of cibles) if(!c.ko && !c.esquive) tuer(C, L, c, e.chance, e.el); break;
    case "mortSi": for(const c of cibles) if(!c.ko && c.etat && c.etat.type === e.etat) tuer(C, L, c, e.chance, "pur", true); break;
    case "fraction": for(const c of cibles){ if(c.boss){ log(C, `${c.nom} n’est pas affecté.`); continue; } const d = Math.floor(c.pv * e.pct / 100); blesser(C, c, d, L); log(C, `${c.nom} perd ${d} PV (${e.pct} % de ses PV).`, {t:"degats", cible:c.id, v:d}); } break;
    case "drain": for(const c of cibles){ const d = Math.min(e.degats, e.ressource === "sp" ? c.sp : c.pv); if(e.ressource === "sp"){ c.sp -= d; L.sp = Math.min(L.spMax, L.sp + d); } else { blesser(C, c, d, L); soigner(C, L, d); } log(C, `${L.nom} draine ${d} ${e.ressource === "sp" ? "SP" : "PV"} à ${c.nom}.`, {t:"drain", cible:c.id, v:d}); } break;
    case "sensibilite": for(const c of cibles) c.sensibilite = {mult:e.mult, tours:e.tours}; log(C, "Sensibilité aux altérations augmentée.", {t:"sensibilite"}); break;
    case "bonusATerre": break;   // lu par frapper()
    case "malusSoi": L.malusSoi = e.mult; log(C, `Les dégâts de ${L.nom} sont réduits jusqu’à la fin du combat.`, {t:"malusSoi"}); break;
    case "bonusRelais": case "condition": break;
    case "comme": utiliser(C, L.id, e.skill, cibles[0] && cibles[0].id, {sousSkill:true, cibles}); break;
    case "soin": for(const c of cibles) soigner(C, c, Math.round(REGLAGES.soinBase * (L.echelleSoin || L.echelle || 1) * Math.sqrt(L.stats.mag * e.puissance) * boostSoin(L))); break;
    case "soinPct": for(const c of cibles) soigner(C, c, Math.round(c.pvMax * e.pct / 100)); break;
    case "reanimer": for(const c of cibles) if(c.ko){ c.ko = false; c.etat = null; c.pv = Math.max(1, Math.round(c.pvMax * e.pct / 100)); log(C, `${c.nom} est ranimé avec ${c.pv} PV.`, {t:"reanimer", cible:c.id}); } break;
    case "guerir": for(const c of cibles) if(c.etat && e.etats.includes(c.etat.type)){ log(C, `${c.nom} est guéri : ${nomEtat(c.etat.type)}.`, {t:"guerir", cible:c.id}); c.etat = null; } break;
    case "stat": for(const c of cibles){
      const actuel = c.mods[e.stat];
      // Un bonus annule un malus (et inversement) ; sinon il est renouvelé pour 3 tours
      if(actuel && (actuel.mult > 1) !== (e.mult > 1)) delete c.mods[e.stat];
      else c.mods[e.stat] = {mult:e.mult, tours:e.tours + (e.mult > 1 ? passifs(L, "bonusKaja").length : 0)};
      log(C, `${c.nom} : ${{atq:"Attaque", def:"Défense", agi:"Précision et esquive"}[e.stat]} ${e.mult > 1 ? "augmentée" : "réduite"}.`, {t:"stat", cible:c.id, stat:e.stat, mult:e.mult});
    } break;
    case "charge": for(const c of cibles) c.charge[e.type] = e.mult; log(C, `${cibles.length > 1 ? "Le groupe" : cibles[0].nom} se concentre (×${e.mult} à la prochaine attaque ${e.type === "magie" ? "magique" : "physique"}).`, {t:"charge"}); break;
    case "critPlus": for(const c of cibles) c.critBonus = {plus:e.plus, tours:e.tours}; log(C, `Taux de critique +${e.plus} %.`, {t:"critPlus"}); break;
    case "karn": for(const c of cibles) c.karn[e.type] = true; log(C, `Renvoi de la prochaine attaque ${e.type === "magie" ? "magique" : "physique"}.`, {t:"karn"}); break;
    case "bloque": for(const c of cibles) c.bloqueMort = true; log(C, "La prochaine mort instantanée sera annulée.", {t:"bloque"}); break;
    case "retire": for(const c of cibles){
      if(e.quoi === "karn-phys") delete c.karn.phys; else if(e.quoi === "karn-magie") delete c.karn.magie;
      else for(const k of Object.keys(c.mods)) if((c.mods[k].mult > 1) === (e.quoi === "kaja")) delete c.mods[k];
    } log(C, {"karn-phys":"Tetrakarn retiré.", "karn-magie":"Makarakarn retiré.", kaja:"Bonus annulés.", kunda:"Malus annulés."}[e.quoi], {t:"retire"}); break;
    case "mur": for(const c of cibles) c.murs[e.el] = e.tours; log(C, "Résistance ajoutée.", {t:"mur", el:e.el}); break;
    case "brise": for(const c of cibles) c.brises[e.el] = e.tours; log(C, "Résistance retirée.", {t:"brise", el:e.el}); break;
    default: throw new Error(`Effet inconnu : ${e.t}`);
  }
}
const boostSoin = L => produit(passifs(L, "boostSoin"), e => e.mult) * REGLAGES.relais[Math.min(3, L.relais)];

/* ---------- Dégâts ---------- */
function frapper(C, L, s, e, c){
  c.esquive = false;
  if(c.ko) return;
  const physique = PHYSIQUES.includes(e.el), magie = !physique;
  const nCoups = e.coups[0] + Math.floor(alea(C) * (e.coups[1] - e.coups[0] + 1));
  let touche = 0;
  for(let i = 0; i < nCoups && !c.ko && !L.ko; i++){
    // Précision
    if(!toucheCible(C, L, c, e, physique)){ if(i === 0) c.esquive = true; log(C, `${c.nom} esquive.`, {t:"rate", cible:c.id}); continue; }
    c.esquive = false; touche++;
    // Renvoi (Karn) puis affinité
    const typeKarn = physique ? "phys" : e.el !== "pur" ? "magie" : null;
    let cibleReelle = c, aff = affinite(c, e.el);
    if(typeKarn && c.karn[typeKarn]){ delete c.karn[typeKarn]; aff = "rp"; log(C, `${c.nom} renvoie l’attaque.`, {t:"karn", cible:c.id}); }
    if(aff === "rp"){ cibleReelle = L; aff = affinite(L, e.el); if(aff === "rp" || aff === "nu") aff = "nu"; }
    if(aff === "nu" && e.el !== "pur"){ log(C, `${cibleReelle.nom} annule l’attaque.`, {t:"annule", cible:cibleReelle.id}); continue; }
    // Contre-attaque (Counter…) : renvoie les dégâts physiques ou Gun
    if(cibleReelle === c && physique) for(const k of passifs(c, "contre")) if(k.types.includes(e.el) && tirage(C, k.chance)){ cibleReelle = L; log(C, `${c.nom} contre-attaque !`, {t:"contre", cible:c.id}); break; }
    let d = degatsBruts(L, cibleReelle, e, physique);
    // Modificateurs
    // Garde : dégâts ×0,5 et la faiblesse ne joue pas
    if(cibleReelle.garde){ d *= REGLAGES.garde; if(aff === "wk") aff = "-"; }
    if(aff === "wk" && e.el !== "pur") d *= REGLAGES.faiblesse;
    if(aff === "rs") d *= REGLAGES.resiste;
    const crit = physique && aff !== "ab" && tirage(C, chanceCritique(L, cibleReelle, e));
    if(crit) d *= REGLAGES.critique;
    const tech = cibleReelle.etat && (TECHNIQUE[cibleReelle.etat.type] || []).includes(e.el);
    if(tech) d *= REGLAGES.technique;
    if(cibleReelle.aTerre) d *= (s.effets.find(x => x.t === "bonusATerre") || {mult:REGLAGES.aTerre}).mult * produit(passifs(L, "contreATerre"), x => x.mult);
    if(cibleReelle.leader) d *= produit(passifs(L, "contreLeader"), x => x.mult);
    if(L.relais) d *= REGLAGES.relais[Math.min(3, L.relais)] * ((s.effets.find(x => x.t === "bonusRelais") || {mult:1}).mult);
    const plafond = passifs(L, "boostDegats").some(x => x.depassePlafond) ? Infinity : REGLAGES.plafond;
    d = Math.min(plafond, Math.max(1, Math.round(d * (1 + (alea(C) * 2 - 1) * REGLAGES.variation))));
    if(aff === "ab"){ soigner(C, cibleReelle, d); log(C, `${cibleReelle.nom} absorbe l’attaque (+${d} PV).`, {t:"absorbe", cible:cibleReelle.id, v:d}); continue; }
    blesser(C, cibleReelle, d, L);
    for(const v of passifs(L, "volVie")) if(cibleReelle !== L) soigner(C, L, Math.round(d * v.pct / 100));
    const notes = [aff === "wk" ? "Faiblesse !" : "", aff === "rs" ? "Résiste." : "", crit ? "Critique !" : "", tech ? "Technique !" : ""].filter(Boolean).join(" ");
    log(C, `${cibleReelle.nom} subit ${d} dégâts.${notes ? " " + notes : ""}`, {t:"degats", cible:cibleReelle.id, v:d, faiblesse:aff === "wk", critique:crit, technique:tech});
    // À terre et One More
    if((aff === "wk" || crit || tech) && cibleReelle !== L && !cibleReelle.ko){ cibleReelle.aTerre = true; L.unPlus = true; }
    // Le Sommeil cesse au premier coup ; le Choc peut passer à l’attaquant au corps à corps
    if(cibleReelle.etat && cibleReelle.etat.type === "sommeil") cibleReelle.etat = null;
    if(physique && e.el === "phy" && cibleReelle.etat && cibleReelle.etat.type === "choc" && !L.etat && alea(C) < REGLAGES.chocContagion){ L.etat = {type:"choc", tours:dureeAlt(L)}; log(C, `${L.nom} est électrocuté par le contact !`, {t:"alteration", cible:L.id, etat:"choc"}); }
  }
  // La Charge et la Concentration sont consommées par l’attaque
  if(physique && L.charge.phys) delete L.charge.phys;
  if(magie && L.charge.magie) delete L.charge.magie;
}
function degatsBruts(L, c, e, physique){
  const atk = (physique ? L.stats.for : L.stats.mag) * mod(L, "atq") * (L.etat && L.etat.type === "rage" ? REGLAGES.rageAttaque : 1) * (L.etat && L.etat.type === "faim" ? REGLAGES.faimAttaque : 1);
  const def = Math.max(1, c.stats.end * mod(c, "def") * (c.etat && c.etat.type === "rage" ? REGLAGES.rageDefense : 1));
  // Partie de cartes : le Leader a un rapport attaque/défense plafonné et un multiplicateur de dégâts subis
  const rapport = c.rapportMax ? Math.min(c.rapportMax, atk / def) : atk / def;
  let d = REGLAGES.degatsBase * (L.echelle || 1) * Math.sqrt(rapport * e.puissance) * (c.degatsSubis || 1);
  d *= cumul(passifs(L, "boost").filter(b => b.el === e.el || (b.el === "magie" && !physique)));
  d *= cumul(passifs(L, "boostDegats"));
  d *= (physique ? L.charge.phys : L.charge.magie) || 1;
  d *= L.malusSoi;
  d *= produit(passifs(c, "degatsRecus"), x => x.mult);
  return d;
}
function toucheCible(C, L, c, e, physique){
  if(e.precision >= 100) return true;
  if(c.aTerre || (c.etat && INACTIFS.includes(c.etat.type)) || passifs(c, "degatsRecus").some(x => x.sansEsquive)) return true;
  let p = (e.precision + passifs(L, "precisionPlus").reduce((s, x) => s + x.plus, 0)) * mod(L, "agi") / mod(c, "agi");
  if(L.etat && L.etat.type === "vertige") p *= REGLAGES.vertigePrecision;
  for(const x of passifs(c, "esquive")) if(x.el === e.el || x.el === "tout" || (x.el === "magieHorsPur" && !physique && e.el !== "pur")) p /= x.mult;
  p *= produit(passifs(c, "precisionRecue"), x => x.mult);
  return tirage(C, p);
}
function chanceCritique(L, c, e){
  let p = (e.critique || 0) + (L.critBonus ? L.critBonus.plus : 0) + (c.critBonus ? 0 : 0);
  for(const x of passifs(L, "critPlus")) if(!x.el || x.el === e.el) p += x.plus;
  p += (L.stats.cha - c.stats.cha) * REGLAGES.chanceLuck;
  p *= produit(passifs(L, "critMult"), x => x.mult);
  p *= produit(passifs(c, "critRecu"), x => x.mult);
  return Math.max(0, p);
}
function blesser(C, c, d, source){
  c.pv -= d;
  if(c.pv > 0) return;
  // Coup mortel : Endure, Enduring Soul, puis Garde finale du navigateur
  for(const e of passifs(c, "endure")) if(e.contre === "mortel" && !c.endure.mortel){
    c.endure.mortel = true; c.pv = e.pvPct ? c.pvMax : (e.pv || 1);
    log(C, `${c.nom} tient bon (${c.pv} PV) !`, {t:"endure", cible:c.id}); return;
  }
  if(c.camp === 0 && aNav(C, "gardeFinale") && alea(C) < REGLAGES.navigation.gardeFinale){ c.pv = 1; log(C, `Garde finale : le coup mortel sur ${c.nom} est annulé.`, {t:"gardeFinale", cible:c.id}); return; }
  ko(C, c);
}
function ko(C, c){
  c.pv = 0; c.ko = true; c.etat = null; c.aTerre = false;
  log(C, `${c.nom} est K.O.`, {t:"ko", cible:c.id});
  if(C.surKO) C.surKO(c);
  // Relève d’urgence : 2 alliés K.O. ou plus → la réserve entre en jeu
  if(c.camp === 0 && aNav(C, "releveUrgence") && C.combattants.filter(x => x.camp === 0 && !x.reserve && x.ko).length >= 2 && alea(C) < REGLAGES.navigation.releveUrgence){
    const reserve = C.combattants.filter(x => x.camp === 0 && x.reserve && !x.ko);
    for(const x of C.combattants.filter(y => y.camp === 0 && !y.reserve)) x.reserve = true;
    for(const x of reserve) x.reserve = false;
    log(C, "Relève d’urgence : la réserve prend le relais.", {t:"releve"});
  }
}
function soigner(C, c, n){
  if(c.ko || n <= 0) return;
  if(c.soinRecu !== undefined) n = Math.round(n * c.soinRecu);
  const avant = c.pv; c.pv = Math.min(c.pvMax, c.pv + n);
  if(c.pv > avant) log(C, `${c.nom} récupère ${c.pv - avant} PV.`, {t:"soin", cible:c.id, v:c.pv - avant});
}

/* ---------- Altérations et morts instantanées ---------- */
const dureeAlt = c => { const r = passifs(c, "guerisonRapide"); if(r.some(x => x.tours)) return 1; return Math.max(1, Math.ceil(REGLAGES.dureeAlteration * produit(r, x => x.mult || 1))); };
function chanceAlteration(C, L, c, etat, base){
  if(passifs(c, "immunise").some(x => x.etats.includes(etat))) return 0;
  let p = base + passifs(L, "altPlus").reduce((s, x) => s + x.plus, 0);
  for(const x of passifs(L, "boostAlt")) if(x.etat === "tous" || x.etat === etat) p *= x.mult;
  for(const x of passifs(c, "resistAlt")) if(x.etat === "tous" || x.etat === etat) p *= x.mult;
  if(c.sensibilite) p *= c.sensibilite.mult;
  p += (L.stats.cha - c.stats.cha) * REGLAGES.chanceLuck;
  return Math.max(0, p);
}
function alterer(C, L, c, etat, base){
  if(c.etat){ return; }   // une seule altération à la fois
  const p = chanceAlteration(C, L, c, etat, base);
  if(!tirage(C, p)) return;
  // Durée : Pendu (subies −1), Lune (infligées +1)
  c.etat = {type:etat, tours: Math.max(1, dureeAlt(c) - passifs(c, "dureeSubie").length + passifs(L, "dureeInfligee").length)};
  log(C, `${c.nom} subit ${nomEtat(etat)}.`, {t:"alteration", cible:c.id, etat});
}
function tuer(C, L, c, base, el, certain){
  if(c.boss){ log(C, `${c.nom} n’est pas affecté.`); return; }
  if(c.bloqueMort){ c.bloqueMort = false; log(C, `La mort instantanée sur ${c.nom} est annulée.`, {t:"bloque", cible:c.id}); return; }
  let p = base;
  if(!certain){
    const aff = affinite(c, el);
    if(["nu", "rp", "ab"].includes(aff)){ log(C, `${c.nom} est insensible.`, {t:"annule", cible:c.id}); return; }
    if(aff === "wk") p *= REGLAGES.mortFaiblesse;
    if(aff === "rs") p *= REGLAGES.mortResiste;
    for(const x of passifs(L, "boostAlt")) if(x.etat === "mort-" + el) p *= x.mult;
    p += passifs(L, "mortPlus").reduce((s, x) => s + x.plus, 0);
    p += (L.stats.cha - c.stats.cha) * REGLAGES.chanceLuck;
  }
  if(!tirage(C, p)){ log(C, `${c.nom} résiste à la mort instantanée.`, {t:"rate", cible:c.id}); return; }
  if(passifs(c, "endure").some(x => x.contre === "mort") && !c.endure.mort){ c.endure.mort = true; c.pv = 1; log(C, `${c.nom} survit à la mort instantanée (1 PV) !`, {t:"endure", cible:c.id}); return; }
  log(C, `${c.nom} est tué sur le coup.`, {t:"mort", cible:c.id}); ko(C, c);
}

/* ---------- Tours ---------- */
// Début du tour d’un combattant : altérations, régénération, Soutien moral
function debutTour(C, c){
  if(c.ko) return;
  const e = c.etat && c.etat.type;
  if(e === "brulure"){ const d = Math.max(1, Math.floor(c.pvMax * REGLAGES.brulurePct / 100)); log(C, `${c.nom} brûle (${d} dégâts).`, {t:"degats", cible:c.id, v:d}); blesser(C, c, d); }
  if(e === "sommeil"){ soigner(C, c, Math.floor(c.pvMax * REGLAGES.sommeilPct / 100)); c.sp = Math.min(c.spMax, c.sp + Math.floor(c.spMax * REGLAGES.sommeilPct / 100)); }
  if(e === "desespoir"){ const p = Math.floor(c.spMax * REGLAGES.desespoirPct / 100); c.sp = Math.max(0, c.sp - p); log(C, `${c.nom} perd ${p} SP (Désespoir).`, {t:"desespoir", cible:c.id, v:p}); }
  for(const r of passifs(c, "regen")){
    if(r.ressource === "pv") soigner(C, c, Math.max(1, Math.floor(c.pvMax * r.pct / 100)));
    else { const avant = c.sp; c.sp = Math.min(c.spMax, c.sp + r.n); if(c.sp > avant) log(C, `${c.nom} récupère ${c.sp - avant} SP.`, {t:"regenSP", cible:c.id, v:c.sp - avant}); }
  }
  if(c.camp === 0 && aNav(C, "soutienMoral") && alea(C) < REGLAGES.navigation.soutienMoral) soutienMoral(C, c);
  c.aTerre = false;
}
// Soutien moral du navigateur : un bonus (-kaja) ou un soin ; Active Support et Ultimate Support ajoutent d’autres effets
function soutienMoral(C, c){
  const groupe = allies(C, c), blesse = groupe.slice().sort((a, b) => a.pv / a.pvMax - b.pv / b.pvMax)[0];
  const ajouts = C.navigateur.passifs.filter(e => e.t === "navigation" && e.quoi === "soutienMoralPlus").map(e => e.ajoute || "").join(" + ");
  const choix = [["tarukaja", c.id], ["rakukaja", c.id], ["sukukaja", c.id]];
  if(/Charge/.test(ajouts)) choix.push(["charge", c.id]);
  if(/Concentrate/.test(ajouts)) choix.push(["concentrate", c.id]);
  if(/Hyakka Ryouran/.test(ajouts)) choix.push(["hyakka_ryouran", c.id]);
  if(blesse && blesse.pv < blesse.pvMax * 0.5) choix.unshift([/Salvation/.test(ajouts) ? "salvation" : "dia", blesse.id]);
  if(/Holy Benevolence/.test(ajouts) && C.combattants.some(x => x.camp === c.camp && x.ko)) choix.unshift(["holy_benevolence", null]);
  if(/SP Restore/.test(ajouts) && c.sp < c.spMax * 0.3){ c.sp = Math.min(c.spMax, c.sp + Math.round(c.spMax * 0.2)); log(C, `Soutien moral : ${c.nom} récupère des SP.`, {t:"soutienMoral"}); return; }
  const [skill, cible] = choix[0][0] === "dia" || choix[0][0] === "salvation" || choix[0][0] === "holy_benevolence" ? choix[0] : choix[Math.floor(alea(C) * choix.length)];
  log(C, "Soutien moral du navigateur.", {t:"soutienMoral", skill});
  utiliser(C, c.id, skill, cible, {sousSkill:true});
}
// Fin du tour : durées des bonus, malus, murs, altérations
function finTour(C, c){
  for(const k of Object.keys(c.mods)) if(--c.mods[k].tours <= 0) delete c.mods[k];
  for(const m of [c.murs, c.brises]) for(const k of Object.keys(m)) if(--m[k] <= 0) delete m[k];
  if(c.critBonus && --c.critBonus.tours <= 0) c.critBonus = null;
  if(c.sensibilite && --c.sensibilite.tours <= 0) c.sensibilite = null;
  if(c.etat && --c.etat.tours <= 0){ log(C, `${c.nom} se remet : ${nomEtat(c.etat.type)}.`, {t:"remis", cible:c.id}); c.etat = null; }
}
// All-Out Attack : toutes les Personas adverses en jeu sont à terre → chaque membre du camp frappe toutes les cibles
const allOutPossible = (C, camp) => { const l = actifs(C).filter(x => x.camp !== camp && !x.leader); return l.length > 0 && l.every(x => x.aTerre); };
function allOut(C, camp){
  if(!allOutPossible(C, camp)) return {ok:false, raison:"Toutes les Personas adverses doivent être à terre."};
  const equipe = actifs(C).filter(x => x.camp === camp), cibles = actifs(C).filter(x => x.camp !== camp);
  log(C, "All-Out Attack !", {t:"allout", camp});
  for(const c of cibles){
    let d = 0;
    for(const m of equipe){ const rapport = Math.max(m.stats.for, m.stats.mag) / Math.max(1, c.stats.end); d += REGLAGES.degatsBase * (m.echelle || 1) * Math.sqrt((c.rapportMax ? Math.min(c.rapportMax, rapport) : rapport) * REGLAGES.puissanceAOA) * (c.degatsSubis || 1); }
    d *= cumul(equipe.flatMap(m => passifs(m, "boostAOA")));
    if(c.leader) d *= REGLAGES.aoaLeader;
    d = Math.round(d * (1 + (alea(C) * 2 - 1) * REGLAGES.variation));
    blesser(C, c, d); log(C, `${c.nom} subit ${d} dégâts.`, {t:"degats", cible:c.id, v:d, allout:true});
  }
  for(const c of cibles) c.aTerre = false;
  for(const m of equipe) m.unPlus = false;
  return {ok:true};
}
// Relais (Baton Pass) : après un One More, passe la main à un allié, qui frappe plus fort
function relais(C, idDe, idVers){

    c.unPlusFait = true;
    log(S, `One More pour ${c.nom} !`, {t:"onemore", id:c.id});
    S.unPlus = {id:c.id, allOut: K.allOutPossible(S.C, c.camp)};
    return {ok:true, unPlus:true};
  }
  S.file.shift(); avancer(S);
  return {ok:true};
}
// Après un One More : rejouer, Relais vers un allié, ou All-Out Attack
function unPlus(S, choix, idAllie){
  const c = K.trouver(S.C, S.acteur), u = S.unPlus; S.unPlus = null;
  if(!c || !u) return {ok:false};
  if(choix === "allout" && u.allOut){
    K.REGLAGES.aoaLeader = R.aoaLeader;
    const avant = S.C.journal.length; K.allOut(S.C, c.camp);
    for(const e of S.C.journal.slice(avant)) log(S, e.texte, Object.assign({}, e, {src:"combat"}));
    traiterKO(S);
    S.file.shift(); if(!S.fini) avancer(S); return {ok:true};
  }
  if(choix === "relais" && idAllie){
    if(!relaisPossibles(S).some(x => x.id === idAllie)){ S.unPlus = u; return {ok:false, raison:"Relais seulement vers un allié qui n’a pas encore agi."}; }
    const r = K.relais(S.C, c.id, idAllie);
    if(r.ok){
      S.file.shift(); S.file = S.file.filter(x => x !== idAllie); S.file.unshift(idAllie);
      const a = K.trouver(S.C, idAllie); a.aTerre = false; S.acteur = a.id; a.unPlusFait = true;
      log(S, `${c.nom} passe le relais à ${a.nom}.`, {t:"relais", id:a.id}); return {ok:true};
    }
  }
  c.unPlus = false;
  return {ok:true};   // rejouer : le combattant garde la main
}

// Alliés qui peuvent recevoir le Relais : en jeu, pas encore agi ce tour
function relaisPossibles(S){
  const c = K.trouver(S.C, S.acteur); if(!c) return [];
  return S.file.slice(1).map(id => K.trouver(S.C, id)).filter(x => x && x.camp === c.camp && !x.ko && K.peutAgir(S.C, x).ok);
}
// Rappel : pendant le placement, une fois par tour, une Persona en jeu revient dans la main (elle perd ses niveaux gagnés)
function rappeler(S, i, id){
  const j = S.joueurs[i], c = K.trouver(S.C, id);
  if(S.phase !== "placement" || j.pose) return {ok:false, raison:"Le rappel se fait pendant le placement."};
  if(j.rappelTour === S.tour) return {ok:false, raison:"Une seule Persona rappelée par tour."};
  if(!c || c.camp !== i || c.leader || c.ko) return {ok:false, raison:"Persona introuvable."};
  if(j.main.length >= R.mainMax) return {ok:false, raison:`Main pleine (${R.mainMax} cartes).`};
  S.C.combattants.splice(S.C.combattants.indexOf(c), 1);
  j.terrain = j.terrain.filter(x => x !== id); j.main.push(c.carte); j.rappelTour = S.tour;
  if(c.niveauxGagnes){ j.niveauxRappel = j.niveauxRappel || {}; j.niveauxRappel[c.carte] = (j.niveauxRappel[c.carte] || 0) + c.niveauxGagnes; }
  log(S, `${j.nom} rappelle ${c.nom} dans sa main.`, {t:"rappel", joueur:i});
  liens(S);
  return {ok:true};
}
/* ---------- K.O., fin de tour, fin de partie ---------- */
function traiterKO(S){ while(S.koFile.length && !S.fini) persoKO(S, S.koFile.shift()); }
function persoKO(S, c){
  if(c.leader){ fin(S, 1 - c.camp); return; }
  const j = S.joueurs[c.camp], L = leaderDe(S, c.camp);
  j.terrain = j.terrain.filter(x => x !== c.id); j.defausse.push(c.carte);
  const perte = R.perteKO * (c.rang || 1);
  log(S, `${c.nom} part à la défausse ; ${j.nom} perd ${perte} PV.`, {t:"perte", joueur:c.camp, v:perte});
  if(L && !L.ko){ L.pv -= perte; if(L.pv <= 0){ L.pv = 0; L.ko = true; fin(S, 1 - c.camp); } }
  liens(S);
}
function finTour(S){
  const avantFin = S.C.journal.length;
  for(const c of K.actifs(S.C)) K.finTour(S.C, c);
  for(const e of S.C.journal.slice(avantFin)) log(S, e.texte, e);
  traiterKO(S); if(S.fini) return;
  for(const c of K.actifs(S.C)){
    c.garde = false; c.unPlus = false;
    // Niveaux gagnés : Leader +10, Persona +1 (Fou : +2)
    const carte = CARTES()[c.carte], gain = c.leader ? R.nivLeaderTour : R.nivTour * (c.lienArcane === "fou" ? 2 : 1);
    if(carte && c.niveau < 99){
      const n = Math.min(99, c.niveau + gain), st = statsA(carte, c.leader ? n : n), avant = c.skills.length;
      c.niveau = n; c.stats = st;
      if(!c.leader){ const pvMax = pvDe(n, st) + (c.pvBonus || 0); c.pv += pvMax - c.pvMax; c.pvMax = pvMax; }
      c.niveauxGagnes = (c.niveauxGagnes || 0) + gain;
      const nouveaux = skillsA(carte, n).filter(id => !c.skills.includes(id));
      K.apprendre(c, skillsA(carte, n));
      if(nouveaux.length) log(S, `${c.nom} atteint le niveau ${n} et apprend ${nouveaux.map(id => CARTES()[id].nom).join(", ")}.`, {t:"apprend", id:c.id});
    }
  }
  S.joueurs.forEach((j, i) => {
    const L = leaderDe(S, i);
    if(L && !L.ko) L.sp = Math.min(R.spMax, L.sp + R.spTour + 3 * enJeu(S, i).filter(c => c.lienArcane === "hierophante").length);
  });
  // Alerte de sécurité : la partie ne peut pas s’éterniser
  if(S.tour >= R.alerteDebut){
    const perte = R.alerte * (S.tour - R.alerteDebut + 1);
    log(S, `Alerte de sécurité ! Chaque Leader perd ${perte} PV.`, {t:"alerte", v:perte});
    for(let i = 0; i < 2; i++){ const L = leaderDe(S, i); L.pv = Math.max(0, L.pv - perte); }
    const a = leaderDe(S, 0).pv, b = leaderDe(S, 1).pv;
    if(a <= 0 || b <= 0){ fin(S, a <= 0 && b <= 0 ? null : a <= 0 ? 1 : 0); return; }
  }
  if(S.tour >= R.tourMax){ const a = leaderDe(S, 0).pv, b = leaderDe(S, 1).pv; fin(S, a === b ? null : a > b ? 0 : 1); return; }
  debutTour(S);
}
function debutTour(S){
  S.tour++; S.phase = "placement";
  if(S.tour > 1) for(const j of S.joueurs) for(let k = 0; k < R.pioche; k++) piocher(S, j);
  log(S, `Tour ${S.tour}.`, {t:"tour"});
}
function fin(S, gagnant){
  if(S.fini) return;
  S.fini = true; S.vainqueur = gagnant; S.phase = "fin"; S.file = []; S.acteur = null;
  log(S, gagnant === null ? "Égalité." : `${S.joueurs[gagnant].nom} gagne la partie !`, {t:"fin"});
}
// Niveaux gagnés par chaque Persona pendant la partie (reportés sur la collection)
function niveauxGagnes(S, i){
  const r = {};
  for(const c of S.C.combattants) if(c.camp === i && !c.leader && c.niveauxGagnes) r[c.carte] = (r[c.carte] || 0) + c.niveauxGagnes;
  for(const [id, n] of Object.entries(S.joueurs[i].niveauxRappel || {})) r[id] = (r[id] || 0) + n;
  return r;
}

return {R, ARCANES, idPersona, estReanimation, creer, poser, rappeler, relaisPossibles, jouables, placesLibres, agir, unPlus, skillsUtilisables, statsA, skillsA, pvDe, leaderDe, enJeu, niveauxGagnes, alea};
})();
if(typeof module !== "undefined") module.exports = BATAILLE;

</script>
<script>
/* ============================================================
   ORDINATEUR — partie de cartes
   Place ses Personas les plus fortes, puis choisit à chaque action
   le skill qui rapporte le plus (dégâts selon les affinités, achever
   un ennemi, soigner, se renforcer, altérer, tuer sur le coup).
   ============================================================ */
const IA_BATAILLE = (function(){
const B = typeof BATAILLE !== "undefined" ? BATAILLE : require("./bataille.js");
const K = typeof COMBAT !== "undefined" ? COMBAT : require("./combat.js");
const CARTES = () => (typeof MOTEUR !== "undefined" ? MOTEUR.C : require("./moteur.js").C);
const PHYS = ["phy", "gun"];

function placer(S, i){
  const C = CARTES(), libres = B.placesLibres(S, i);
  const choix = B.jouables(S, i).sort((a, b) => C[b].rang - C[a].rang || (C[b].niveau || 0) - (C[a].niveau || 0)).slice(0, Math.max(0, libres));
  return B.poser(S, i, choix);
}
// Dégâts estimés d’un effet « degats » de c sur t
function estime(c, t, e){
  const phys = PHYS.includes(e.el), atk = phys ? c.stats.for : c.stats.mag;
  let d = 5 * Math.sqrt(atk / Math.max(1, t.stats.end) * e.puissance) * ((e.coups[0] + e.coups[1]) / 2) * (e.precision >= 100 ? 1 : e.precision / 100);
  const a = K.affinite(t, e.el);
  if(a === "wk" && !t.garde) d *= 1.25 + 0.6;     // faiblesse : plus de dégâts, à terre et One More
  if(a === "rs") d *= 0.5;
  if(a === "nu") d = 0;
  if(a === "rp" || a === "ab") d = -d;
  return d;
}
function valeur(S, c, id){
  const C = CARTES(), s = id === "attaque" || id === "tir" ? K.attaqueDeBase(id) : C[id], ennemis = K.ennemis(S.C, c), allies = K.allies(S.C, c);
  // Réanimation : la meilleure Persona de la défausse retourne dans le deck
  if(B.estReanimation(s)){
    const def = S.joueurs[c.camp].defausse.slice().sort((a, b) => C[b].rang - C[a].rang);
    return def.length ? {v: 6 * C[def[0]].rang, cible:def[0]} : {v:-1, cible:null};
  }
  const deroule = sk => sk.effets.flatMap(e => e.t === "comme" && C[e.skill] ? deroule(C[e.skill]) : [e]);
  const effets = deroule(s);
  let meilleur = {v:-1, cible:null};
  const cibles = s.cible === "un" ? ennemis.map(t => [t]) : s.cible === "tous" ? [ennemis] : s.cible === "allie" ? allies.map(t => [t]) : s.cible === "allies" ? [allies] : [[c]];
  for(const groupe of cibles){
    let v = 0;
    for(const e of effets) for(const t of groupe){
      if(e.t === "degats"){ const d = estime(c, t, e); v += Math.min(d, t.pv) + (d >= t.pv ? 40 + 10 * (t.rang || 3) : 0) + (t.leader ? d * 0.5 : 0); }
      else if(e.t === "alteration" && !t.etat) v += e.chance * 0.25;
      else if(e.t === "mort" && !["nu", "rp", "ab"].includes(K.affinite(t, e.el))) v += e.chance / 100 * t.pv * (K.affinite(t, e.el) === "wk" ? 1.5 : 1) * (t.boss ? 0 : 1);
      else if(e.t === "mortSi" && t.etat && t.etat.type === e.etat) v += t.pv;
      else if(e.t === "fraction") v += t.pv * e.pct / 100;
      else if(e.t === "soin" || e.t === "soinPct"){ const manque = t.pvMax - t.pv; if(t.pv < t.pvMax * 0.6) v += Math.min(manque, e.pct ? t.pvMax * e.pct / 100 : 5 * Math.sqrt(c.stats.mag * e.puissance)); }
      else if(e.t === "reanimer") v += 0;
      else if(e.t === "guerir" && t.etat && e.etats.includes(t.etat.type)) v += 25;
      else if(e.t === "stat"){ const deja = t.mods[e.stat]; if(!deja || (deja.mult > 1) !== (e.mult > 1)) v += 12; }
      else if(e.t === "charge" && !t.charge[e.type]) v += 10;
      else if(e.t === "drain") v += e.degats;
      else if(["karn", "mur", "bloque", "critPlus", "sensibilite"].includes(e.t)) v += 4;
    }
    if(v > meilleur.v) meilleur = {v, cible:groupe.length === 1 ? groupe[0].id : null};
  }
  return meilleur;
}
function choisir(S){
  const c = K.trouver(S.C, S.acteur); if(!c) return null;
  const opts = B.skillsUtilisables(S, c).filter(o => !o.raison).map(o => Object.assign(o, valeur(S, c, o.id)));
  opts.push(Object.assign({id:"attaque", k:{sp:0, pv:0}}, valeur(S, c, "attaque")));
  opts.push(Object.assign({id:"tir", k:{sp:0, pv:0}}, valeur(S, c, "tir")));
  // Les SP sont communs : un skill coûteux doit rapporter nettement plus
  for(const o of opts) o.score = o.v - (o.k.sp || 0) * 0.4 - (o.k.pv || 0) * (c.leader ? 1.5 : 0.6);
  opts.sort((a, b) => b.score - a.score);
  return opts[0];
}
// Joue l’action du combattant courant (et son éventuel One More)
function agir(S){
  const o = choisir(S); if(!o) return false;
  let r = B.agir(S, o.id, o.cible);
  if(!r.ok) r = B.agir(S, "attaque", null);
  if(r.unPlus){ B.unPlus(S, S.unPlus && S.unPlus.allOut ? "allout" : "rejouer"); }
  return true;
}
// Partie complète entre deux ordinateurs (simulations)
function jouerPartie(S){
  let garde = 0;
  while(!S.fini && garde++ < 5000){
    if(S.phase === "placement"){ placer(S, 0); placer(S, 1); continue; }
    if(S.acteur) agir(S); else break;
  }
  return S;
}
return {placer, choisir, agir, jouerPartie};
})();
if(typeof module !== "undefined") module.exports = IA_BATAILLE;

</script>
<script>
/* ============================================================
   STOCKAGE — où sont gardées les données du joueur
   1. Supabase, si le jeu est configuré (window.P5_CONFIG) : la connexion est alors obligatoire ;
   2. l’espace personnel du compte, si le jeu tourne dans claude.ai ;
   3. ce navigateur (localStorage), seulement pour le développement, sans Supabase.
   Le reste du jeu ne connaît que ce module.
   ============================================================ */
const STOCKAGE = (function(){
const CFG = (typeof window !== "undefined" && window.P5_CONFIG) || {};
const CLE_LOCALE = "p5-deckbuilding-profil";
const etat = {mode:"local", supabaseDispo:false, utilisateur:null, erreur:null, pret:false};
let sb = null, claudeDb = null, claudeChemin = null, ecouteurs = [];

const lireLocal = () => { try { const t = localStorage.getItem(CLE_LOCALE); return t ? JSON.parse(t) : null; } catch(e){ return null; } };
const ecrireLocal = p => { try { localStorage.setItem(CLE_LOCALE, JSON.stringify(p)); } catch(e){ /* stockage plein ou indisponible */ } };
const avecDelai = (promesse, ms) => Promise.race([promesse, new Promise((_, rej) => setTimeout(() => rej(new Error("délai dépassé")), ms))]);

async function init(){
  // 1. Supabase
  if(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient){
    try {
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, detectSessionInUrl:true}});
      etat.supabaseDispo = true;
      const {data} = await avecDelai(sb.auth.getSession(), 10000);
      majSession(data && data.session);
      sb.auth.onAuthStateChange((evenement, session) => { const avant = etat.utilisateur && etat.utilisateur.id; majSession(session); if((etat.utilisateur && etat.utilisateur.id) !== avant) ecouteurs.forEach(f => f(evenement)); });
      return;
    } catch(e){ etat.erreur = "Le serveur ne répond pas. Vérifiez votre connexion, puis rechargez la page."; }
    return;
  }
  // 2. claude.ai
  if(window.claude && typeof window.claude.use === "function"){
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = user ? await user.id() : null;
      if(db && id){ claudeDb = db; claudeChemin = `data/users/${id}/profil`; etat.mode = "claude"; }
    } catch(e){ /* on reste en local */ }
  }
}
function majSession(session){
  etat.utilisateur = session && session.user ? {id: session.user.id, email: session.user.email} : null;
  etat.mode = "supabase";
}
// Avec Supabase, rien n’est accessible sans être connecté
const connexionRequise = () => etat.supabaseDispo && !etat.utilisateur;
// Appelé quand le joueur se connecte ou se déconnecte
const surChangementCompte = f => { ecouteurs.push(f); };

/* ---------- Profil ---------- */
async function chargerProfil(){
  if(etat.mode === "supabase"){
    if(!etat.utilisateur) return null;
    const {data, error} = await avecDelai(sb.from("profils").select("donnees").eq("user_id", etat.utilisateur.id).maybeSingle(), 10000);
    if(error) throw error;
    return data ? data.donnees : null;
  }
  if(etat.mode === "claude"){
    const snap = await avecDelai(claudeDb.doc(claudeChemin).get(), 10000);
    return snap.exists ? snap.data().profil : null;
  }
  return lireLocal();
}
let file = Promise.resolve();
function enregistrerProfil(p){
  const copie = JSON.parse(JSON.stringify(p));
  if(etat.mode === "local") ecrireLocal(p);
  if(etat.mode === "supabase"){
    if(!etat.utilisateur) return Promise.resolve();
    file = file.then(async () => {
      const {error} = await sb.from("profils").upsert({user_id: etat.utilisateur.id, donnees: copie, maj: new Date().toISOString()});
      if(error) throw error;
    });
  } else if(etat.mode === "claude"){
    file = file.then(() => claudeDb.doc(claudeChemin).set({profil: copie, maj: Date.now()}));
  } else return Promise.resolve();
  file = file.then(() => { etat.erreur = null; }).catch(() => { etat.erreur = "La dernière sauvegarde a échoué. Vérifiez votre connexion : votre progression sera enregistrée à la prochaine action."; });
  return file;
}
const profilLocal = lireLocal;

// Chaque partie jouée par un joueur connecté est gardée (statistiques, équilibrage)
function enregistrerPartie(r){
  if(etat.mode !== "supabase") return;
  sb.from("parties").insert({user_id: etat.utilisateur.id, leader: r.leader, adversaire: r.adversaire, victoire: !!r.victoire, tours: r.tours || 0,
    details: {combos: r.combosElement || 0, degats: r.degats || 0, aoa: r.aoa || 0}}).then(() => {}, () => {});
}

/* ---------- Compte (Supabase) ---------- */
async function connexion(email){
  if(!sb) throw new Error("La connexion n’est pas disponible.");
  const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname}});
  if(error) throw error;
}
async function deconnexion(){ if(sb) await sb.auth.signOut(); }

/* ---------- Configuration de l’Admin (partagée) ---------- */
async function chargerConfiguration(cle){
  if(!sb) return null;
  const {data, error} = await sb.from("configuration").select("valeur").eq("cle", cle).maybeSingle();
  if(error) return null;
  return data ? data.valeur : null;
}
// Enregistre la configuration (réservé aux admins par les règles de la base)
async function enregistrerConfiguration(cle, valeur){
  if(etat.mode !== "supabase" || !etat.utilisateur) throw new Error("Connexion requise.");
  const {error} = await sb.from("configuration").upsert({cle, valeur, maj: new Date().toISOString(), maj_par: etat.utilisateur.id});
  if(error) throw error;
}
// Images : envoyées dans l’espace « images », lisibles par tous
async function envoyerImage(blob, dossier){
  if(etat.mode !== "supabase") throw new Error("Connexion requise.");
  const ext = blob.type === "image/webp" ? "webp" : "png";
  const chemin = `${dossier}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  // Chaque image a un nom unique : les navigateurs peuvent la garder en cache un an
  const {error} = await sb.storage.from("images").upload(chemin, blob, {contentType: blob.type, upsert: false, cacheControl: "31536000"});
  if(error) throw error;
  return sb.storage.from("images").getPublicUrl(chemin).data.publicUrl;
}
// Fichier quelconque (musiques) : on garde le fichier d’origine, avec son extension
async function envoyerFichier(fichier, dossier){
  if(etat.mode !== "supabase") throw new Error("Connexion requise.");
  const ext = (String(fichier.name || "").match(/\.([a-z0-9]{2,5})$/i) || [, "bin"])[1].toLowerCase();
  const chemin = `${dossier}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const {error} = await sb.storage.from("images").upload(chemin, fichier, {contentType: fichier.type || "application/octet-stream", upsert: false, cacheControl: "31536000"});
  if(error) throw error;
  return sb.storage.from("images").getPublicUrl(chemin).data.publicUrl;
}
async function supprimerImage(url){
  if(!sb || !url) return;
  const m = String(url).match(/\/object\/public\/images\/(.+)$/);
  if(m) await sb.storage.from("images").remove([decodeURIComponent(m[1])]).catch(() => {});
}
// Statistiques des parties réelles (admins)
async function statistiques(){
  if(etat.mode !== "supabase") return null;
  const [leaders, total] = await Promise.all([
    sb.from("stats_leaders").select("*"),
    sb.from("parties").select("id", {count:"exact", head:true})
  ]);
  if(leaders.error) throw leaders.error;
  return {leaders: leaders.data || [], total: total.count || 0};
}
async function estAdmin(){
  if(etat.mode !== "supabase" || !etat.utilisateur) return false;
  const {data, error} = await sb.rpc("est_admin");
  return !error && !!data;
}

return {init, etat, chargerProfil, enregistrerProfil, enregistrerPartie, profilLocal, connexion, deconnexion, surChangementCompte, connexionRequise, chargerConfiguration, enregistrerConfiguration, envoyerImage, envoyerFichier, supprimerImage, statistiques, estAdmin,
  get supabase(){ return sb; }};
})();

</script>
<script>
/* ============================================================
   PROFIL — progression du joueur entre les parties
   L’enregistrement passe par STOCKAGE (Supabase, claude.ai ou ce navigateur).
   ============================================================ */
const PROFIL = (function(){
const M = MOTEUR;
// Règles de progression (réglables dans l’Administration)
const REGLES = {xpVictoire:100, xpDefaite:40, fragVictoire:60, fragDefaite:25, seuilBase:120, seuilPente:20, rangMax:27,
  tailleDeck:30, plafondClasse:150, departParRang:10, prixCompendium:60, raretePente:0.6};
const XP = {get victoire(){ return REGLES.xpVictoire; }, get defaite(){ return REGLES.xpDefaite; }};
const FRAGMENTS = {get victoire(){ return REGLES.fragVictoire; }, get defaite(){ return REGLES.fragDefaite; }};
const seuil = r => REGLES.seuilBase + REGLES.seuilPente * r; // XP pour passer du rang r au rang r + 1
// Un palier de cartes tous les 3 rangs de Voleur fantôme. La collection de départ va jusqu’au rang 3 :
// cartes de rang 3 au rang de Voleur 1, puis rang n au rang de Voleur 3(n − 3) + 1 (rang 9 au rang de Voleur 19)
const PALIERS = [3,4,5,6,7,8,9].map(n => [3 * (n - 3) + 1, n]);
const rangCartesMax = r => Math.min(9, Math.floor((Math.max(1, r) - 1) / 3) + 3);
const prochainPalier = r => PALIERS.find(([rj]) => rj > r) || null;

/* ---------- Niveau des Personas ---------- */
// Chaque Persona de la collection a un niveau (commun à ses exemplaires), qui part de son niveau dans P5R.
// Les niveaux gagnés en combat s’y ajoutent (jusqu’à 99) et servent à la fusion ; en combat, une Persona repart de son niveau de P5R.
const niveauBase = id => (M.C[id] && M.C[id].niveau) || 1;
const niveauPersona = id => (p && p.niveaux[id] && p.niveaux[id].niv) || niveauBase(id);
function gagnerNiveaux(id, n){
  if(!M.C[id] || M.C[id].kind !== "persona" || !(n > 0)) return 0;
  const x = p.niveaux[id] = p.niveaux[id] || {niv: niveauBase(id)};
  const avant = x.niv; x.niv = Math.min(99, x.niv + Math.round(n));
  return x.niv - avant;
}
// Niveaux gagnés (au-delà du niveau de départ) par les Personas possédées d’une Arcane ou d’un élément
function niveauxGagnes(filtre){
  let t = 0;
  for(const id of Object.keys(p.collection)){ const c = M.C[id]; if(c && c.kind === "persona" && filtre(c)) t += Math.max(0, niveauPersona(id) - niveauBase(id)); }
  return t;
}

const etat = {mode:"local", pret:false, erreur:null, admin:false};
let p = null, surChange = () => {};

// Personas qu’on peut posséder (ni carte de départ, ni Persona d’un Leader, ni carte de visite)
const personasObtenables = () => Object.keys(M.C).filter(id => { const c = M.C[id]; return c.kind === "persona" && !c.depart && !c.visite && !c.reservee && c.rang >= 1; });
const melange = l => { for(let i = l.length - 1; i > 0; i--){ const k = Math.floor(Math.random() * (i + 1)); [l[i], l[k]] = [l[k], l[i]]; } return l; };
// Collection de départ : 10 Personas différentes de rang 1, 10 de rang 2 et 10 de rang 3, tirées au hasard
function collectionInitiale(){ return completerDepart({}); }
function completerDepart(col){
  for(const rang of [1, 2, 3]){
    const deja = Object.keys(col).filter(id => M.C[id] && M.C[id].kind === "persona" && M.C[id].rang === rang).length;
    const ids = melange(personasObtenables().filter(id => M.C[id].rang === rang && !col[id]));
    for(const id of ids.slice(0, Math.max(0, REGLES.departParRang - deja))) col[id] = 1;
  }
  return col;
}
function nouveau(){
  return {version:1, nomCode:"", rang:1, xp:0, fragments:0, collection:collectionInitiale(), leaderFavori:"joker",
    leaders:Object.keys(M.LEADERS), stats:{parties:0, victoires:0, defaites:0}, historique:[], creeLe:Date.now(),
    decks:[], deckActif:null, statsLeaders:{}, offres:[], compendium:{}, niveaux:{}, compteurs:{fusions:0, chaise:0, rachats:0}};
}

/* ---------- Règles de deck ---------- */
const tailleDeck = () => REGLES.tailleDeck;
// Une Persona identique par deck (la collection peut en avoir plusieurs exemplaires)
const maxCopies = () => 1;
const nbCartes = cartes => Object.values(cartes).reduce((n, v) => n + v, 0);
function validerDeck(d){
  const erreurs = [], n = nbCartes(d.cartes);
  if(n !== tailleDeck()) erreurs.push(n < tailleDeck() ? `Il manque ${tailleDeck() - n} carte${tailleDeck() - n > 1 ? "s" : ""} (${n}/${tailleDeck()}).` : `Il y a ${n - tailleDeck()} carte${n - tailleDeck() > 1 ? "s" : ""} de trop (${n}/${tailleDeck()}).`);
  for(const [id, k] of Object.entries(d.cartes)){
    if(!M.C[id]){ erreurs.push(`Carte inconnue : ${id}.`); continue; }
    if(M.C[id].reservee){ erreurs.push(`${M.C[id].nom} est réservée au deck de départ de son Leader.`); continue; }
    if(M.C[id].kind !== "persona"){ erreurs.push(`${M.C[id].nom} : seules les Personas vont dans un deck.`); continue; }
    if(k > (p.collection[id] || 0)) erreurs.push(`${M.C[id].nom} : vous n’en possédez que ${p.collection[id] || 0}.`);
    if(k > maxCopies(id)) erreurs.push(`${M.C[id].nom} : une seule fois par deck.`);
  }
  const rangs = Object.entries(d.cartes).reduce((t, [id, k]) => t + (M.C[id] ? M.C[id].rang * k : 0), 0);
  if(rangs > REGLES.plafondClasse) erreurs.push(`Somme des rangs : ${rangs}, au-dessus du plafond de ${REGLES.plafondClasse}.`);
  // Le deck doit pouvoir jouer dès le premier tour
  if(!Object.keys(d.cartes).some(id => M.C[id] && M.C[id].rang === 1)) erreurs.push("Il faut au moins une Persona de rang 1 pour le premier tour.");
  return {ok: !erreurs.length, erreurs, total: n, rangs};
}
// Complète un deck jusqu’à 30 cartes : d’abord l’élément du Leader, puis les cartes les plus chères
function completerDeck(cartes, leader){
  const el = M.LEADERS[leader].el, res = Object.assign({}, cartes);
  const arcane = M.LEADERS[leader].arcane;
  const score = id => { const c = M.C[id]; return (c.el === el ? 4 : 0) + (c.arcane && c.arcane === arcane ? 3 : 0) + c.rang; };
  const dispo = Object.keys(p.collection).filter(id => M.C[id] && M.C[id].kind === "persona" && !M.C[id].depart && !M.C[id].reservee && !res[id]).sort((a, b) => score(b) - score(a));
  const somme = () => Object.entries(res).reduce((t, [id, k]) => t + M.C[id].rang * k, 0);
  // Au moins 5 Personas de rang 1 et 2 pour les premiers tours, puis les meilleures dans le plafond
  for(const id of dispo.filter(id => M.C[id].rang <= 2).slice(0, 6)) if(nbCartes(res) < tailleDeck()) res[id] = 1;
  for(const id of dispo){
    if(nbCartes(res) >= tailleDeck()) break;
    if(res[id]) continue;
    const reste = tailleDeck() - nbCartes(res) - 1;
    if(somme() + M.C[id].rang + reste <= REGLES.plafondClasse) res[id] = 1;
  }
  return res;
}
function creerDeck(leader, nom){
  const d = {id: "d" + Date.now().toString(36) + Math.floor(Math.random()*1000), nom: nom || `Deck ${M.LEADERS[leader].nom}`, leader, cartes: {}};
  d.cartes = completerDeck({}, leader);
  p.decks.push(d); if(!p.deckActif) p.deckActif = d.id;
  enregistrer(); return d;
}
function majDeck(id, champs){ const d = p.decks.find(x => x.id === id); if(!d) return null; Object.assign(d, champs); enregistrer(); return d; }
function supprimerDeck(id){ p.decks = p.decks.filter(x => x.id !== id); if(p.deckActif === id) p.deckActif = p.decks[0] ? p.decks[0].id : null; enregistrer(); }
function choisirDeckActif(id){ p.deckActif = id; enregistrer(); }
const deckActif = () => p.decks.find(x => x.id === p.deckActif) || null;

function quetes(leader){
  const L = M.LEADERS[leader], el = L.el ? M.ELEMENTS[L.el].nom : "", arc = arcaneNom(L.arcane);
  const txt = t => t.replace("{L}", L.nom).replace("{arc}", arc).replace("{el}", el);
  const propres = (QUETES_LEADERS[leader] || QUETES_LEADERS.joker).map(([t, cle, but]) => ({texte: txt(t), cle, but}));
  return [
    {texte:`Jouer une partie avec ${L.nom}`, cle:"parties", but:1},
    ...propres,
    {texte:`Gagner 10 parties avec ${L.nom}`, cle:"victoires", but:10, recompense:`${L.persona} devient ${L.evos[0]}`},
    {texte:`Faire gagner 40 niveaux à vos Personas ${arc}, et gagner 15 parties avec ${L.nom}`, cle:"final", but:1, recompense:`${L.evos[0]} devient ${L.evos[1]}`}
  ];
}
const ARCANES_NOMS = {fou:"du Fou", magicien:"du Magicien", pretresse:"de la Prêtresse", imperatrice:"de l’Impératrice", empereur:"de l’Empereur", hierophante:"du Hiérophante",
  amants:"des Amants", chariot:"du Chariot", justice:"de la Justice", ermite:"de l’Ermite", fortune:"de la Fortune", force:"de la Force", pendu:"du Pendu", mort:"de la Mort",
  temperance:"de la Tempérance", diable:"du Diable", tour:"de la Tour", etoile:"de l’Étoile", lune:"de la Lune", soleil:"du Soleil", jugement:"du Jugement", foi:"de la Foi", conseiller:"du Conseiller", monde:"du Monde"};
const arcaneNom = a => ARCANES_NOMS[a] || "";
function confident(leader){
  const st = Object.assign({}, (p.statsLeaders || {})[leader] || {}), L = M.LEADERS[leader];
  st.niveauxArcane = niveauxGagnes(c => c.arcane === L.arcane);
  st.niveauxElement = niveauxGagnes(c => !L.el || c.el === L.el);
  st.final = st.niveauxArcane >= 40 && (st.victoires || 0) >= 15 ? 1 : 0;
  Object.assign(st, {fusions:0, chaise:0, rachats:0}, p.compteurs || {});
  const l = quetes(leader).map(q => Object.assign({}, q, {progres: Math.min(q.but, st[q.cle] || 0)}));
  let rang = 0; for(const q of l){ if(q.progres >= q.but) rang++; else break; }
  l.forEach((q, i) => { q.faite = i < rang; q.active = i === rang; });
  return {rang, quetes:l, evo: rang >= 11 ? 2 : rang >= 10 ? 1 : 0};
}

/* ---------- Récompenses : choisir 1 carte parmi 3 ---------- */
/* ---------- Récompense du gagnant : 1 Persona parmi 3 ---------- */
// Rang au plus celui de la Persona la plus haute de son deck, et le palier de son rang de Voleur fantôme.
// Plus le rang est haut, plus la Persona est rare (poids × 0,6 par rang).
function genererOffre(rangDeck){
  const max = Math.min(rangCartesMax(p.rang), Math.max(1, rangDeck || 1));
  const pool = personasObtenables().filter(id => M.C[id].rang <= max);
  const poids = id => Math.pow(REGLES.raretePente, M.C[id].rang - 1);
  const offre = [];
  for(let g = 0; offre.length < 3 && g < 200; g++){
    const reste = pool.filter(id => !offre.includes(id)); if(!reste.length) break;
    let x = Math.random() * reste.reduce((t, id) => t + poids(id), 0);
    for(const id of reste){ x -= poids(id); if(x <= 0){ offre.push(id); break; } }
  }
  return offre;
}
function choisirRecompense(index, id){
  const o = p.offres[index]; if(!o || !o.cartes.includes(id)) return false;
  p.collection[id] = (p.collection[id] || 0) + 1;
  if(M.C[id].kind === "persona") p.compendium[id] = true;
  p.offres.splice(index, 1); enregistrer(); return true;
}
// Complète un profil enregistré avec les champs ajoutés depuis
function completer(x){
  const n = nouveau();
  if(!x || typeof x !== "object") return n;
  const r = Object.assign(n, x);
  r.stats = Object.assign(nouveau().stats, x.stats || {});
  r.decks = Array.isArray(x.decks) ? x.decks : []; r.offres = Array.isArray(x.offres) ? x.offres : []; r.statsLeaders = x.statsLeaders || {};
  r.compendium = x.compendium || {}; r.niveaux = x.niveaux || {}; r.compteurs = Object.assign({fusions:0, chaise:0, rachats:0}, x.compteurs || {});
  if(!x.collection || !Object.keys(x.collection).length) r.collection = n.collection;
  // Anciens niveaux (avec expérience) : on garde le niveau
  for(const [id, v] of Object.entries(r.niveaux)) if(!v || typeof v.niv !== "number") delete r.niveaux[id];
  for(const id of Object.keys(r.collection)) if(!M.C[id]) delete r.collection[id];
  return r;
}
// Les Personas des Leaders ne peuvent être ni dans la collection ni dans un deck : on les retire, puis on complète les decks
function retirerReservees(){
  let change = false;
  // Nouveau combat : une fois, la collection est complétée jusqu’à 10 Personas différentes de chacun des rangs 1, 2 et 3
  if(!p.departBataille){ completerDepart(p.collection); p.departBataille = true; change = true; }
  for(const id of Object.keys(p.collection)) if(M.C[id] && M.C[id].reservee){ delete p.collection[id]; change = true; }
  for(const d of p.decks){
    let retire = false;
    // Les skills ne vont plus dans les decks de marché
    for(const id of Object.keys(d.cartes)) if(!M.C[id] || M.C[id].reservee || M.C[id].kind !== "persona"){ delete d.cartes[id]; retire = true; }
    // Une seule fois chaque Persona
    for(const [id, k] of Object.entries(d.cartes)) if(k > 1){ d.cartes[id] = 1; retire = true; }
    if(!validerDeck(d).ok) retire = true;
  }
  return change;
}
// Chaque profil a au moins un deck valide
function premierDeck(){ if(p && !p.decks.length){ const d = {id:"d0", nom:"Deck de départ", leader:p.leaderFavori || "joker", cartes:{}}; p.decks.push(d); d.cartes = completerDeck({}, d.leader); p.deckActif = d.id; } }
// Chargement : avec Supabase, le profil du compte connecté (aucun profil sans connexion)
async function init(cb){
  surChange = cb || surChange;
  await STOCKAGE.init();
  // Réglages de l’Administration, avant le profil (ils peuvent retirer des cartes)
  if(typeof CONFIGJEU !== "undefined") await CONFIGJEU.charger();
  STOCKAGE.surChangementCompte(() => charger());
  await charger();
}
async function charger(){
  etat.mode = STOCKAGE.etat.mode;
  etat.erreur = STOCKAGE.etat.erreur;
  etat.admin = false;
  p = null;
  if(STOCKAGE.connexionRequise()){ etat.pret = true; surChange(); return; }
  try {
    const enregistre = await STOCKAGE.chargerProfil();
    p = completer(enregistre);
    premierDeck();
    const nettoye = retirerReservees();
    for(const id of Object.keys(p.collection)) if(M.C[id] && M.C[id].kind === "persona") p.compendium[id] = true;
    if(!enregistre || nettoye) enregistrer(); // nouveau profil, ou cartes réservées retirées
    // Droits d’administration : seulement les comptes inscrits dans la table admins
    etat.admin = await STOCKAGE.estAdmin().catch(() => false);
  } catch(e){ etat.erreur = "Votre profil n’a pas pu être chargé. Vérifiez votre connexion, puis rechargez la page."; }
  etat.pret = true; surChange();
}
function enregistrer(){
  STOCKAGE.enregistrerProfil(p).then(() => { if(STOCKAGE.etat.erreur !== etat.erreur){ etat.erreur = STOCKAGE.etat.erreur; surChange(); } });
}

// Fin d’une partie : expérience, Fragments, rang de Voleur, niveaux des Personas, récompense du gagnant, quêtes des Confidents.
// r : {victoire, leader, adversaire, tours, pvRestants, rangDeck, stats (voir BATAILLE), niveaux:{id: niveaux gagnés}}
function finPartie(r){
  const gagne = !!r.victoire, xp = gagne ? XP.victoire : XP.defaite, fragments = gagne ? FRAGMENTS.victoire : FRAGMENTS.defaite;
  const avant = {rang:p.rang, cartes:rangCartesMax(p.rang)};
  p.xp += xp;
  while(p.rang < REGLES.rangMax && p.xp >= seuil(p.rang)){ p.xp -= seuil(p.rang); p.rang++; }
  if(p.rang >= REGLES.rangMax) p.xp = 0;
  p.fragments += fragments;
  p.stats.parties++; p.stats[gagne ? "victoires" : "defaites"]++;
  p.leaderFavori = r.leader;
  const sl = p.statsLeaders[r.leader] = p.statsLeaders[r.leader] || {parties:0, victoires:0};
  const avantConf = confident(r.leader).rang;
  sl.parties++; if(gagne) sl.victoires++;
  const s = r.stats || {}, plus = (k, v) => { sl[k] = (sl[k] || 0) + (v || 0); };
  for(const k of ["degats", "soins", "alterations", "ko", "onemore", "aoa", "liens"]) plus(k, s[k]);
  plus("multiCombos", s.multiOM);
  for(const [k, v] of Object.entries(s.etats || {})) plus(k, v);
  sl.maxTour = Math.max(sl.maxTour || 0, s.maxTour || 0);
  if(gagne && (r.tours || 99) <= 15) plus("victoiresRapides", 1);
  if(gagne && r.pvRestants != null && r.pvRestants <= 50) plus("victoiresSerrees", 1);
  if(gagne && r.pvRestants != null && r.pvRestants >= 200) plus("victoiresParfaites", 1);
  // Niveaux gagnés en combat, reportés sur les Personas de la collection (jusqu’à 99)
  const montees = [];
  for(const [id, n] of Object.entries(r.niveaux || {})){
    if(!p.collection[id]) continue;
    const a = niveauPersona(id); if(gagnerNiveaux(id, n)) montees.push({id, avant:a, apres:niveauPersona(id)});
  }
  const apresConf = confident(r.leader).rang;
  // Seul le gagnant choisit une nouvelle Persona
  let offre = null;
  if(gagne){ p.offres.push({date:Date.now(), victoire:true, cartes:genererOffre(r.rangDeck)}); p.offres = p.offres.slice(-5); offre = p.offres.length - 1; }
  p.historique.unshift({date:Date.now(), leader:r.leader, adversaire:r.adversaire, victoire:gagne, tours:r.tours, xp, fragments});
  p.historique = p.historique.slice(0, 20);
  enregistrer();
  STOCKAGE.enregistrerPartie({victoire:gagne, leader:r.leader, adversaire:r.adversaire, tours:r.tours, aoa:s.aoa || 0, combosElement:s.onemore || 0, degats:s.degats || 0});
  return {xp, fragments, rangAvant:avant.rang, rangApres:p.rang, nouvellesCartes: rangCartesMax(p.rang) > avant.cartes ? rangCartesMax(p.rang) : null,
    confident: apresConf > avantConf ? {leader:r.leader, rang:apresConf} : null, offre, montees};
}
function renommer(nom){ p.nomCode = String(nom || "").trim().slice(0, 24); enregistrer(); }
const tailleCollection = () => Object.values(p.collection).reduce((n, v) => n + v, 0);

return {init, etat, get profil(){ return p; }, seuil, get RANG_MAX(){ return REGLES.rangMax; }, REGLES, XP, FRAGMENTS, PALIERS, rangCartesMax, prochainPalier, finPartie, renommer, tailleCollection,
  get TAILLE_DECK(){ return REGLES.tailleDeck; }, get PLAFOND_CLASSE(){ return REGLES.plafondClasse; }, maxCopies, nbCartes, validerDeck, completerDeck, creerDeck, majDeck, supprimerDeck, choisirDeckActif, deckActif,
  quetes, confident, choisirRecompense, enregistrer, niveauPersona, niveauBase, gagnerNiveaux, niveauxGagnes, personasObtenables, genererOffre};
})();
