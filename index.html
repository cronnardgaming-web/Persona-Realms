<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persona 5 Royal – le jeu de cartes</title>
<meta name="description" content="Jeu de cartes de deckbuilding inspiré de Persona 5 Royal (projet de fan).">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#e6e6e9; --fond-2:#d5d5da; --surface:#ffffff; --encre:#000; --encre-2:#4d4d52; --ligne:#000;
  --rouge:#d7141a; --rouge-encre:#fff; --rouge-doux:#fde3e3; --ok:#0f7a3d; --halo:#ffd400; --voile:rgba(0,0,0,.6);
  --affiche:"Anton","Impact","Arial Narrow Bold",sans-serif; --texte:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --fond:#000; --fond-2:#1c1c1f; --surface:#141416; --encre:#fff; --encre-2:#b4b4ba; --ligne:#fff;
    --rouge:#e8202a; --rouge-doux:#3a0d10; --ok:#3fcf7d; --voile:rgba(0,0,0,.75); color-scheme:dark; }
}
:root[data-theme="dark"]{ --fond:#000; --fond-2:#1c1c1f; --surface:#141416; --encre:#fff; --encre-2:#b4b4ba; --ligne:#fff;
  --rouge:#e8202a; --rouge-doux:#3a0d10; --ok:#3fcf7d; --voile:rgba(0,0,0,.75); color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--fond);color:var(--encre);font-family:var(--texte);font-size:16px;line-height:1.3}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--halo);outline-offset:2px}
h1,h2,h3{font-family:var(--affiche);font-weight:400;margin:0}
[hidden]{display:none!important}

/* ---------- Décors par élément (derrière les images détourées) ---------- */
.el-feu{background:radial-gradient(circle at 25% 115%,#ffd166 0 16%,transparent 17%),radial-gradient(circle at 70% 120%,#ff8a00 0 28%,transparent 29%),radial-gradient(circle at 45% 130%,#ff3d00 0 38%,transparent 39%),linear-gradient(180deg,#3d0703,#c4210b);color:#fff}
.el-gla{background:linear-gradient(135deg,rgba(255,255,255,.35) 0 8%,transparent 8% 46%,rgba(255,255,255,.22) 46% 54%,transparent 54%) 0 0/26px 26px,linear-gradient(180deg,#08324f,#57c3ee);color:#fff}
.el-ele{background:linear-gradient(112deg,transparent 42%,#ffe14d 42% 47%,transparent 47% 58%,#fff3a8 58% 60%,transparent 60%),radial-gradient(circle at 70% 30%,rgba(255,225,77,.35),transparent 55%),#16161f;color:#ffe14d}
.el-ven{background:repeating-radial-gradient(circle at 15% 85%,rgba(255,255,255,.2) 0 3px,transparent 3px 13px),linear-gradient(180deg,#0c4a2d,#3cc47a);color:#fff}
.el-psy{background:repeating-radial-gradient(circle at 50% 55%,rgba(255,255,255,.22) 0 2px,transparent 2px 11px),linear-gradient(180deg,#4d0f4d,#e25ec3);color:#fff}
.el-nuc{background:repeating-radial-gradient(circle at 50% 60%,rgba(120,255,255,.35) 0 2px,transparent 2px 15px),radial-gradient(circle at 50% 60%,#5ff 0 6%,transparent 7%),linear-gradient(180deg,#032f30,#17a6a6);color:#fff}
.el-sac{background:repeating-conic-gradient(from 0deg at 50% 105%,rgba(255,255,255,.4) 0 5deg,transparent 5deg 16deg),linear-gradient(180deg,#7c5d0f,#f7de80);color:#2a1d00}
.el-mau{background:radial-gradient(circle at 28% 32%,rgba(170,90,255,.45),transparent 45%),radial-gradient(circle at 72% 72%,rgba(110,0,150,.7),transparent 50%),radial-gradient(circle at 60% 20%,rgba(255,60,120,.25),transparent 35%),#14041f;color:#e9c8ff}
.el-phy{background:repeating-linear-gradient(125deg,transparent 0 17px,rgba(255,255,255,.4) 17px 19px,transparent 19px 34px),linear-gradient(180deg,#2e2e33,#9a9aa3);color:#fff}
.el-gun{background:radial-gradient(circle at 50% 50%,transparent 0 15px,#e3141b 15px 17px,transparent 17px 27px,#e3141b 27px 28px,transparent 28px),linear-gradient(90deg,transparent calc(50% - 1px),rgba(227,20,27,.8) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(0deg,transparent calc(50% - 1px),rgba(227,20,27,.8) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(#000,#2b2b2b);color:#fff}
.el-pur{background:linear-gradient(135deg,#f7f7f7,#c7d4ff 30%,#fff0f8 55%,#d2fff4 80%,#f0f0f0);color:#222}
.el-aucun{background:repeating-linear-gradient(0deg,rgba(0,255,140,.15) 0 1px,transparent 1px 6px),linear-gradient(180deg,#0b1d14,#1f5b3e);color:#9dffcf}
.el-objet{background:linear-gradient(135deg,#f6d365,#c9a227);color:#3b2c00}

/* ---------- Préparation ---------- */
.prep{max-width:1100px;margin:0 auto;padding:20px 20px 48px}
.titre{position:relative;margin:4px 0 24px;padding:18px 22px 20px;background:var(--rouge);color:var(--rouge-encre);clip-path:polygon(0 8%,100% 0,98% 100%,1.5% 92%)}
.titre h1{font-size:clamp(32px,5.5vw,58px);line-height:.95;transform:rotate(-1.5deg)}
.titre p{margin:18px 0 0;font-size:18px;max-width:62ch}
.colonnes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bloc{background:var(--surface);border:3px solid var(--ligne);padding:16px 18px}
.bloc h2{font-size:26px;margin-bottom:12px}
.leaders{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.leader-btn{border:2px solid var(--ligne);background:var(--surface);padding:0 0 6px;text-align:center;line-height:1.1;overflow:hidden}
.leader-btn .portrait-art{height:46px;display:grid;place-items:center;font-family:var(--affiche);font-size:24px}
.leader-btn b{display:block;font-family:var(--affiche);font-weight:400;font-size:17px;margin-top:4px}
.leader-btn small{color:var(--encre-2);font-size:12px}
.leader-btn[aria-pressed="true"]{outline:4px solid var(--rouge);outline-offset:-4px}
.fiche-leader{font-size:15px;margin:0}
.champ{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;margin:12px 0}
.champ label{font-weight:600}
.champ .aide{grid-column:1/3;color:var(--encre-2);font-size:14px;margin-top:-4px}
.champ input[type=range]{grid-column:1/3;width:100%;accent-color:var(--rouge)}
.champ output{font-weight:700;min-width:64px;text-align:right;border:2px solid var(--ligne);padding:2px 6px}
.reglages{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.btn{border:3px solid var(--ligne);background:var(--surface);padding:10px 18px;font-weight:700;font-size:17px}
.btn.fort{background:var(--rouge);color:var(--rouge-encre);border-color:var(--rouge);font-family:var(--affiche);font-weight:400;font-size:22px;padding:10px 26px;clip-path:polygon(0 0,100% 6%,97% 100%,3% 94%)}
.btn.petit{padding:5px 10px;font-size:14px;border-width:2px}
.barre{height:10px;border:2px solid var(--ligne);background:var(--surface);margin:8px 0}
.barre i{display:block;height:100%;background:var(--rouge)}
.res-simu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.res-simu div{border:2px solid var(--ligne);padding:8px 10px}
.res-simu b{display:block;font-family:var(--affiche);font-weight:400;font-size:28px}

/* ---------- Plateau ---------- */
.entete{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1440px;margin:0 auto;padding:10px 14px 0}
.entete h1{font-size:24px}
.entete .tour{color:var(--encre-2);font-weight:600}
.entete .droite{margin-left:auto;display:flex;gap:8px}
.lien-btn{background:none;border:2px solid var(--ligne);padding:4px 10px;font-weight:600}
.jeu{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;max-width:1440px;margin:0 auto;padding:10px 14px 18px}
.plateau{display:flex;flex-direction:column;gap:10px;min-width:0}
.bandeau{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:3px solid var(--ligne);padding:8px 12px;position:relative}
.bandeau.adv{border-color:var(--encre-2)}
.portrait{display:flex;align-items:center;gap:10px;min-width:190px}
.portrait-art{width:44px;height:56px;display:grid;place-items:center;font-family:var(--affiche);font-size:26px;border:2px solid #000;flex:none}
.portrait .qui{font-family:var(--affiche);font-size:22px;line-height:1}
.portrait .sous{font-size:13px;color:var(--encre-2)}
.pv-joueur{flex:1;min-width:160px}
.pv-joueur .chiffre{font-family:var(--affiche);font-size:26px;line-height:1}
.pv-joueur .chiffre small{font-family:var(--texte);font-size:14px;color:var(--encre-2);margin-left:4px}
.jauge{height:10px;background:var(--fond-2);border:2px solid var(--ligne);margin-top:4px}
.jauge i{display:block;height:100%;background:var(--rouge)}
.compteurs{display:flex;gap:6px;flex-wrap:wrap}
.res{border:2px solid var(--ligne);padding:2px 9px;font-weight:600;background:var(--surface);font-size:14px}
.res b{font-family:var(--affiche);font-weight:400;font-size:20px;margin-right:3px}
.chip{display:inline-block;padding:1px 6px;font-weight:700;font-size:12px;line-height:1.35;border:1px solid rgba(0,0,0,.35)}
.capa{font-size:13px;color:var(--encre-2);max-width:340px}
.zone{background:var(--fond-2);padding:10px;min-height:120px}
.zone h2{font-size:18px;margin-bottom:6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.zone h2 small{font-family:var(--texte);font-size:14px;color:var(--encre-2)}
.rangee{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;min-height:60px}
.totaux{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.totaux .res{font-size:15px}
.totaux .res.aoa{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.commandes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fin-tour{margin-left:auto;background:var(--encre);color:var(--fond);border:none;padding:12px 22px;font-family:var(--affiche);font-size:21px;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.fin-tour:disabled,.btn:disabled{opacity:.4}
.consigne{background:var(--rouge);color:var(--rouge-encre);padding:8px 14px;font-weight:700}

/* ---------- Cartes ---------- */
.carte{flex:none;width:150px;min-height:200px;background:#fff;color:#000;border:3px solid #000;padding:0;text-align:left;display:flex;flex-direction:column;position:relative;overflow:hidden}
.carte .art{height:58px;display:flex;align-items:flex-end;justify-content:space-between;padding:4px 7px;font-family:var(--affiche);font-size:26px;line-height:1;position:relative}
.carte .art .cout{position:absolute;top:5px;right:6px;background:#000;color:#fff;font-size:17px;padding:0 6px;font-family:var(--affiche)}
.carte .art .rang{font-family:var(--texte);font-size:12px;font-weight:700;letter-spacing:1px}
.carte .corps{padding:5px 7px 7px;display:flex;flex-direction:column;gap:3px;flex:1}
.carte .type{font-size:11px;font-weight:700;color:#5b5b60;text-transform:uppercase;letter-spacing:.3px}
.carte .nom{font-family:var(--affiche);font-size:17px;line-height:1.02}
.carte .ligne{font-size:12.5px;line-height:1.2}
.carte .ligne b{font-weight:700}
.carte .om{border-top:1px dashed #999;padding-top:3px}
.carte.k-persona{border-color:var(--rouge)}
.carte.k-visite{border-color:#000;box-shadow:inset 0 0 0 3px var(--halo)}
.carte.r5::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);pointer-events:none;mix-blend-mode:overlay}
.carte.combo{box-shadow:inset 0 0 0 4px var(--halo)}
.carte .badge{position:absolute;top:62px;right:4px;background:var(--rouge);color:#fff;font-family:var(--affiche);font-size:13px;padding:0 5px;transform:skew(-8deg)}
.carte .badge.lien{top:82px;background:#5a2ea6}
.carte:disabled{opacity:.45}
button.carte:not(:disabled):hover{transform:translateY(-3px)}
.carte.trop-cher .cout{background:#999}
.carte.choisie{outline:4px solid var(--rouge);outline-offset:-4px}
.mini{width:120px;min-height:0}
.mini .art{height:30px;font-size:18px}
.mini .corps{display:none}
.sous-carte{display:flex;justify-content:center;margin-top:-4px}

.cote{display:flex;flex-direction:column;gap:12px;min-width:0}
.panneau{background:var(--surface);border:3px solid var(--ligne);padding:10px 12px}
.panneau h2{font-size:20px;margin-bottom:8px}
.journal{max-height:520px;overflow-y:auto;font-size:14px;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.journal li{color:var(--encre-2);border-left:3px solid transparent;padding-left:6px}
.journal li.recent{color:var(--encre);border-left-color:var(--rouge)}

/* ---------- Effets visuels ---------- */
.flot{position:absolute;left:50%;top:20%;transform:translate(-50%,0);font-family:var(--affiche);font-size:30px;color:var(--rouge);-webkit-text-stroke:1.5px #000;pointer-events:none;animation:flot 1.2s ease-out forwards;z-index:5;white-space:nowrap}
.flot.soin{color:var(--ok)}
.flot.info{font-size:18px;color:#000;-webkit-text-stroke:0;background:var(--halo);padding:0 6px}
@keyframes flot{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-42px)}}
.cutin{position:fixed;left:-10vw;right:-10vw;top:38%;height:120px;background:var(--rouge);display:grid;place-items:center;z-index:50;pointer-events:none;transform:skewY(-6deg);animation:cutin 1s cubic-bezier(.2,.8,.2,1) forwards;border-top:6px solid #000;border-bottom:6px solid #000}
.cutin span{font-family:var(--affiche);font-size:clamp(46px,9vw,108px);color:#fff;-webkit-text-stroke:3px #000;transform:skewY(6deg) rotate(-4deg)}
.cutin.petit{height:76px;top:42%}
.cutin.petit span{font-size:clamp(32px,6vw,64px)}
@keyframes cutin{0%{transform:skewY(-6deg) translateX(110%)}22%{transform:skewY(-6deg) translateX(0)}78%{transform:skewY(-6deg) translateX(0);opacity:1}100%{transform:skewY(-6deg) translateX(-110%);opacity:.9}}

/* ---------- Fenêtres ---------- */
.voile{position:fixed;inset:0;background:var(--voile);display:grid;place-items:center;z-index:40;padding:16px}
.fenetre{background:var(--surface);color:var(--encre);border:4px solid var(--ligne);max-width:820px;width:100%;padding:20px 22px;max-height:90vh;overflow:auto}
.fenetre h2{font-size:32px;margin-bottom:8px}
.fenetre .rangee{flex-wrap:wrap}
.regles p,.regles li{max-width:66ch}
.regles ol,.regles ul{padding-left:22px}

@media (max-width: 1000px){ .jeu{grid-template-columns:1fr} .colonnes{grid-template-columns:1fr} }
@media (max-width: 620px){ .leaders{grid-template-columns:repeat(3,1fr)} .carte{width:132px} }
@media (prefers-reduced-motion: reduce){ .cutin,.flot{animation:fade 1s forwards} @keyframes fade{from{opacity:1}to{opacity:0}} button.carte:hover{transform:none} }

/* ============================================================
   Ergonomie du combat : dock, panneau « Ce tour », loupe, indices
   ============================================================ */
.jeu{grid-template-columns:minmax(0,1fr) 340px;align-items:start;padding-bottom:8px}
.centre{display:flex;flex-direction:column;gap:10px;min-width:0}
.statut{font-weight:700;padding:3px 10px;border:2px solid var(--ligne)}
.statut.moi{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.action-ia{font-weight:600;background:var(--surface);border:2px solid var(--encre-2);padding:3px 10px;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.discret{color:var(--encre-2);font-size:14px}

/* Bandeaux des joueurs */
.bandeau{gap:10px 16px;transition:border-color .2s}
.bandeau.actif{border-color:var(--rouge);box-shadow:inset 6px 0 0 var(--rouge)}
.son-tour{display:inline-block;margin-left:8px;background:var(--rouge);color:#fff;font-size:12px;font-weight:700;padding:1px 6px;vertical-align:middle;transform:skew(-8deg)}
.pv-joueur .jauge i{transition:width .6s ease}
.infos-leader{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:200px;flex:1}
.infos-leader .capa{max-width:none}
.res.bouton{cursor:pointer;background:var(--fond-2)}
.res.alerte{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.res.discret{border-style:dashed;font-weight:400}

/* Résumé du tour adverse */
.recu{background:var(--surface);border:3px solid var(--ligne);border-left:10px solid var(--rouge);padding:8px 12px}
.recu-tete{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.recu-deg{font-family:var(--affiche);font-size:22px;color:var(--rouge)}
.recu-corps{margin-top:8px}
.mini-rangee{min-height:0}

/* Zones centrales */
.zone.jouees.moi{box-shadow:inset 0 0 0 3px var(--rouge)}
.zone.jouees.adv{box-shadow:inset 0 0 0 3px var(--encre-2)}
.emplacement{display:flex;flex-direction:column;align-items:center;gap:4px}

/* Cartes : pastilles d’effet, états des combos, indices */
.carte{width:142px;min-height:196px}
.carte .art{height:52px}
.carte .art .initiale{font-size:28px}
.pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:1px 6px;border-radius:9px;line-height:1.35;white-space:nowrap}
.pill.deg{background:#ffe1e1;color:#9c0d12}
.pill.yen{background:#fff1c2;color:#6b4d00}
.pill.pv{background:#d9f5e3;color:#0b5a2c}
.pill.autre{background:#e6e6ec;color:#333}
.carte .om{font-size:11.5px;border-top:1px dashed #999;padding-top:3px;margin-top:2px;line-height:1.25}
.carte .om b{font-weight:700}
.carte .om.fait{background:#fff7c2;border-top:2px solid #e0b400;margin:2px -7px 0;padding:3px 7px}
.carte .om.attente{color:#666;font-style:italic}
.carte .om.attente .pill{opacity:.6}
.indices{position:absolute;top:4px;left:4px;right:44px;display:flex;flex-wrap:wrap;gap:3px;z-index:2}
.indice{font-family:var(--affiche);font-size:12px;padding:0 5px;transform:skew(-8deg);color:#fff;background:#000;line-height:1.5;display:inline-block}
.indice.om{background:var(--rouge)}
.indice.lien{background:#5a2ea6}
.indice.faib{background:#000;color:var(--halo)}
.indice.aoa{background:var(--halo);color:#000}
.carte.abordable{box-shadow:0 0 0 3px var(--halo);}
.carte.abordable .cout{background:var(--ok)}
.carte.trop-cher{opacity:.55}
.carte:disabled{opacity:.6}
.carte.trop-cher:disabled{opacity:.45}
.carte.choisie.repoussee{opacity:.5;transform:translateY(8px)}
.carte.nouvelle{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.7) rotate(-6deg);box-shadow:0 0 0 8px var(--rouge)}100%{transform:none;box-shadow:none}}
.pile{position:relative}
.pile .nb{position:absolute;bottom:6px;right:6px;background:#000;color:#fff;font-family:var(--affiche);font-size:18px;padding:0 7px}

/* Panneau « Ce tour » */
.ce-tour.moi{border-color:var(--rouge)}
.ce-tour h2 small{font-family:var(--texte);font-size:14px;color:var(--encre-2);margin-left:6px}
.gros-compteurs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.gc{border:2px solid var(--ligne);padding:4px 6px;text-align:center}
.gc b{display:block;font-family:var(--affiche);font-weight:400;font-size:32px;line-height:1.05}
.gc span{font-size:12px;line-height:1.15;display:block}
.gc.deg b{color:var(--rouge)}
.gc.yen b{color:#b08400}
.gc.pv b{color:var(--ok)}
.suivi-el{font-size:14px;margin-bottom:6px}
.suivi-el .lbl{font-weight:700;margin-right:4px}
.suivi-el .prog{margin-top:4px}
.suivi-el .prog small{color:var(--encre-2)}
.aoa-ok{background:var(--halo);color:#000;font-weight:700;padding:1px 6px}
.detail{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;font-size:14px;border-top:2px solid var(--fond-2)}
.detail li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--fond-2)}
.detail li small{color:var(--encre-2)}
.detail li b{white-space:nowrap}
.detail li.k-deg b{color:var(--rouge)}
.detail li.k-yen b{color:#b08400}
.detail li.k-pv b{color:var(--ok)}
.detail li.vide{color:var(--encre-2);justify-content:flex-start}
.achats{font-size:14px;margin:6px 0 0}

/* Loupe */
.loupe-vide{color:var(--encre-2);font-size:14px;margin:0}
.loupe-carte{display:flex;flex-direction:column;gap:6px}
.loupe-art{height:84px;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 10px;font-family:var(--affiche);font-size:46px;line-height:1;border:3px solid #000}
.loupe-art .rang{font-family:var(--texte);font-size:15px;font-weight:700;letter-spacing:2px}
.loupe-txt .type{font-size:12px;font-weight:700;color:var(--encre-2);text-transform:uppercase}
.loupe-txt h3{font-size:24px;margin:2px 0 4px}
.loupe-txt p{margin:0 0 5px;font-size:15px}
.glossaire{margin:6px 0 0;font-size:13px;border-top:2px solid var(--fond-2);padding-top:4px}
.glossaire dt{font-weight:700;margin-top:3px}
.glossaire dd{margin:0;color:var(--encre-2)}
.historique summary{font-family:var(--affiche);font-size:20px;cursor:pointer}
.historique .journal{margin-top:8px;max-height:300px}
.historique .journal li.sep{color:var(--encre);font-weight:700;border-left-color:var(--rouge);margin-top:4px}

/* Dock : ma main et mes commandes, toujours visibles */
.dock{position:sticky;bottom:0;z-index:20;max-width:1440px;margin:0 auto;background:var(--fond);border-top:4px solid var(--rouge);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
.dock .bandeau{padding:5px 10px}
.dock .portrait-art{width:36px;height:46px;font-size:22px}
.consigne-ligne{font-size:15px;background:var(--surface);border:2px solid var(--ligne);padding:5px 10px}
.consigne-ligne:empty{display:none}
.dock-bas{display:flex;gap:12px;align-items:stretch}
.main-cartes{flex:1;min-width:0;padding-top:6px}
.commandes{flex-direction:column;justify-content:center;align-items:stretch;min-width:190px}
.fin-tour{margin-left:0;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.fin-tour small{font-family:var(--texte);font-size:14px;font-weight:700;opacity:.85}

@media (max-width: 1000px){
  .jeu{grid-template-columns:1fr}
  .dock-bas{flex-direction:column}
  .commandes{flex-direction:row;min-width:0}
  .infos-leader{display:none}
}
/* Ajustements de place */
.carte.mini{width:104px;min-height:0}
.carte.mini .art{height:32px}
.carte.mini .art .initiale{font-size:20px}
.carte.mini .corps{padding:3px 6px 5px}
.carte.mini .corps .type,.carte.mini .corps .pills,.carte.mini .corps .om{display:none}
.carte.mini .corps .nom{font-size:14px}
.bandeau{flex-wrap:nowrap}
.compteurs{flex:none}
.main-cartes .carte{min-height:168px}
@media (max-width: 1250px){ .bandeau{flex-wrap:wrap} }

/* ============================================================
   Accueil : menu façon Persona 5 et carte du Voleur fantôme
   ============================================================ */
.accueil{position:relative;max-width:1280px;margin:0 auto;padding:28px 24px 40px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:28px;align-items:start;overflow:hidden}
.accueil::before{content:"";position:absolute;inset:-10% 35% 20% -20%;background:var(--rouge);transform:rotate(-14deg);z-index:-1;
  clip-path:polygon(0 12%,100% 0,88% 100%,6% 86%)}
.accueil::after{content:"";position:absolute;inset:0 0 auto 40%;height:70%;z-index:-1;opacity:.18;
  background:radial-gradient(circle,var(--encre) 1.6px,transparent 2px) 0 0/14px 14px;transform:rotate(-14deg)}
.logo{display:flex;flex-direction:column;align-items:flex-start;margin:6px 0 26px;transform:rotate(-6deg);transform-origin:left}
.logo span{font-family:var(--affiche);line-height:.9;display:inline-block}
.logo-1{font-size:clamp(46px,7vw,86px);background:#000;color:#fff;padding:2px 14px 6px;clip-path:polygon(0 6%,100% 0,97% 100%,2% 94%)}
.logo-2{font-size:clamp(40px,6vw,74px);background:#fff;color:var(--rouge);padding:2px 12px 6px;margin:-6px 0 0 40px;border:4px solid #000;transform:rotate(3deg)}
.logo-3{font-size:clamp(20px,2.6vw,30px);color:#fff;background:#000;padding:2px 10px;margin:4px 0 0 90px;transform:rotate(-2deg)}
.menu-p5{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.menu-p5 li{margin-left:calc(var(--i) * 14px)}
.item-menu{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#000;color:#fff;border:3px solid #000;padding:6px 26px 8px 18px;
  transform:skew(-10deg);transition:transform .15s ease,background .15s ease;min-width:min(420px,100%)}
.item-menu > span{transform:skew(10deg)}
.item-nom{font-family:var(--affiche);font-size:clamp(28px,3.6vw,42px);line-height:1}
.item-sous{font-size:15px;font-weight:600;opacity:.85}
.item-menu:hover,.item-menu:focus-visible{background:var(--rouge);transform:skew(-10deg) translateX(14px)}
.item-menu.bientot{background:#fff;color:#000}
.item-menu.bientot:hover,.item-menu.bientot:focus-visible{background:#fff;box-shadow:6px 6px 0 #000}
.item-menu.aide{background:transparent;color:#000;border-style:dashed;border-color:#000}
:root[data-theme="dark"] .item-menu.aide{color:#fff;border-color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .item-menu.aide{color:#fff;border-color:#fff} }

.carte-voleur{background:var(--surface);border:4px solid var(--ligne);padding:16px 18px;box-shadow:10px 10px 0 #000;position:relative}
.carte-voleur h3{font-size:20px;margin:14px 0 6px}
.cv-tete{display:flex;gap:12px;align-items:center}
.portrait-art.grand{width:66px;height:84px;font-size:40px}
.cv-lbl{display:block;font-size:12px;font-weight:700;color:var(--encre-2);text-transform:uppercase}
.cv-nom{font-family:var(--affiche);font-size:26px;border:none;border-bottom:3px solid var(--rouge);background:transparent;color:var(--encre);width:100%;padding:2px 0}
.cv-nom::placeholder{color:var(--encre-2);opacity:.7}
.cv-fav{font-size:14px;color:var(--encre-2)}
.cv-rang{display:flex;gap:12px;align-items:center;margin-top:14px;background:var(--fond-2);padding:8px 10px}
.cv-rang-n{font-family:var(--affiche);font-size:56px;line-height:1;color:var(--rouge);min-width:56px;text-align:center}
.cv-rang-txt{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px}
.cv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.cv-stats div{border:2px solid var(--ligne);padding:6px 8px}
.cv-stats dt{font-size:12px;font-weight:700;color:var(--encre-2)}
.cv-stats dd{margin:0;font-family:var(--affiche);font-size:28px;line-height:1.1}
.cv-stats dd small{font-family:var(--texte);font-size:14px;color:var(--encre-2)}
.cv-palier,.cv-gain{font-size:14px;margin:10px 0 0}
.cv-gain{color:var(--encre-2)}
.cv-histo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.cv-histo li{display:grid;grid-template-columns:auto 1fr;gap:0 8px;border-left:5px solid var(--encre-2);padding:3px 8px;background:var(--fond-2)}
.cv-histo li.v{border-left-color:var(--ok)}
.cv-histo li.d{border-left-color:var(--rouge)}
.cv-histo small{grid-column:1/3;color:var(--encre-2)}
.cv-sauvegarde{font-size:12px;color:var(--encre-2);margin:12px 0 0}
.alerte-txt{color:var(--rouge);font-weight:700}
.mention{grid-column:1/3;font-size:12px;color:var(--encre-2);margin:0}
.barre-nav{margin-bottom:8px}
.gains{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.gains span{border:2px solid var(--ligne);padding:4px 10px;font-weight:700}
.gains span.fort{background:var(--rouge);color:#fff;border-color:var(--rouge)}
@media (max-width: 900px){
  .accueil{grid-template-columns:1fr}
  .mention{grid-column:1}
  .menu-p5 li{margin-left:calc(var(--i) * 6px)}
}
@media (prefers-reduced-motion: reduce){ .item-menu{transition:none} }

/* ============================================================
   Café Leblanc : collection, decks, Confidents, récompenses
   ============================================================ */
.cafe{max-width:1440px;margin:0 auto;padding:16px 18px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0 18px;align-items:start}
.cafe > .barre-nav,.cafe > .titre,.cafe > .onglets{grid-column:1/3}
.cafe .titre{margin-bottom:14px}
.onglets{display:flex;gap:4px;border-bottom:3px solid var(--ligne);margin-bottom:14px;overflow-x:auto}
.onglets button{background:none;border:0;padding:8px 16px;font-family:var(--affiche);font-size:22px;white-space:nowrap}
.onglets button[aria-current="page"]{background:var(--rouge);color:#fff}
.cafe-corps{min-width:0}
.cafe-corps > p{max-width:80ch}
.loupe-flottante{position:sticky;top:12px}
.filtres{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 12px}
.filtres label{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.filtres select,.filtres input{font:inherit;font-size:14px;border:2px solid var(--ligne);background:var(--surface);color:var(--encre);padding:3px 6px}
.filtres .recherche input{width:180px}
.filtre-els{display:flex;flex-wrap:wrap;gap:4px}
.chip-btn{border:2px solid #000;font-weight:700;font-size:13px;padding:2px 8px;background:var(--surface);color:var(--encre)}
.chip-btn[aria-pressed="true"]{outline:3px solid var(--rouge);outline-offset:1px}
.grille-cartes{display:flex;flex-wrap:wrap;gap:10px}
.resume-col{font-size:15px}
.carte.dans-deck{box-shadow:0 0 0 3px var(--ok)}
.pile .nb{z-index:3}

.liste-decks{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.deck-ligne{display:flex;gap:12px;align-items:center;background:var(--surface);border:3px solid var(--ligne);padding:8px 12px;flex-wrap:wrap}
.deck-ligne.actif{border-color:var(--rouge);box-shadow:inset 6px 0 0 var(--rouge)}
.deck-infos{flex:1;min-width:240px;font-size:14px}
.deck-infos b{font-family:var(--affiche);font-weight:400;font-size:21px}
.deck-actions{display:flex;gap:6px;flex-wrap:wrap}
.nouveau-deck{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.nouveau-deck select,.ed-leader select,.champ select{font:inherit;border:2px solid var(--ligne);background:var(--surface);color:var(--encre);padding:4px 6px}
.editeur-deck{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.ed-deck{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
.ed-leader{display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:14px;margin:10px 0}
.gc.ok b{color:var(--ok)}
.deck-liste{list-style:none;margin:8px 0;padding:0;font-size:14px;border-top:2px solid var(--fond-2)}
.deck-liste li{display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--fond-2)}
.deck-liste .dl-nom{font-weight:700}
.deck-liste .dl-info{grid-column:2/3;font-size:12px;color:var(--encre-2)}
.deck-liste li b{grid-row:1/3;grid-column:3}
.deck-liste li .mini-btn{grid-row:1/3;grid-column:4}
.mini-btn{width:28px;height:28px;border:2px solid var(--ligne);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.erreurs{margin:6px 0;padding-left:18px;color:var(--rouge);font-size:14px;font-weight:600}
.ok-txt{color:var(--ok);font-weight:700}
.ed-collection h3{font-size:22px;margin-bottom:4px}
.ed-collection h3 small{font-family:var(--texte);font-size:14px;color:var(--encre-2)}

.grille-conf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.conf{background:var(--surface);border:3px solid var(--ligne);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.conf header{display:flex;gap:10px;align-items:center}
.conf header b{font-family:var(--affiche);font-weight:400;font-size:22px}
.conf-rang{margin-left:auto;font-family:var(--affiche);font-size:34px;color:var(--rouge)}
.conf-rang small{font-size:16px;color:var(--encre-2)}
.conf p{margin:0;font-size:14px}
.conf-quete .lbl{display:block;font-size:12px;font-weight:700;color:var(--encre-2);text-transform:uppercase}
.conf-rec{color:var(--rouge);font-weight:700}
.jauge.fine{height:6px}
.offre{background:var(--surface);border:3px solid var(--ligne);padding:8px 12px;margin-bottom:10px}
.offre p{margin:0 0 6px}
.fenetre .offre{border-width:2px}
@media (max-width: 1100px){ .cafe{grid-template-columns:1fr} .cafe > *{grid-column:1} .loupe-flottante{display:none} .editeur-deck{grid-template-columns:1fr} .ed-deck{position:static;max-height:none} }

/* Compte */
.compte{margin-top:12px;border-top:2px solid var(--fond-2);padding-top:8px;font-size:14px}
.compte p{margin:0 0 6px}
.compte-ligne{display:flex;gap:6px;flex-wrap:wrap}
.compte-ligne input{flex:1;min-width:180px;font:inherit;border:2px solid var(--ligne);background:var(--surface);color:var(--encre);padding:4px 8px}

/* Écran de connexion */
.ecran-connexion{position:relative;max-width:1100px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:1fr minmax(320px,440px);gap:32px;align-items:center;min-height:80vh;overflow:hidden}
.ecran-connexion::before{content:"";position:absolute;inset:-10% 40% 28% -20%;background:var(--rouge);transform:rotate(-14deg);z-index:-1;clip-path:polygon(0 12%,100% 0,88% 100%,6% 86%)}
.carte-voleur.connexion h2{font-size:34px;margin-bottom:8px}
.carte-voleur.connexion p{font-size:15px}
.ecran-connexion .mention{grid-column:1/3}
.chargement{display:grid;place-items:center;min-height:60vh;font-family:var(--affiche);font-size:28px}
@media (max-width: 800px){ .ecran-connexion{grid-template-columns:1fr} .ecran-connexion .mention{grid-column:1} }

/* ---------- Images détourées sur les cartes et les portraits ---------- */
.carte .art,.loupe-art{position:relative;overflow:hidden}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none}
.carte .art .rang,.carte .art .cout,.loupe-art .rang{position:relative;z-index:1}
.carte .art .cout{position:absolute}
.carte .art:has(.art-img){height:72px}
.loupe-art:has(.art-img){height:160px}
.portrait-art{position:relative;overflow:hidden}
.portrait-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}
.portrait-art.mini-portrait{width:30px;height:38px;font-size:16px}

/* ============================================================
   Administration
   ============================================================ */
.admin{max-width:1440px;margin:0 auto;padding:16px 18px 100px}
.a-entete{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.a-entete h1{font-size:40px}
.a-msg{background:var(--surface);border:3px solid var(--ok);padding:8px 12px;font-weight:600;margin-bottom:10px}
.admin .erreur{margin-bottom:10px}
.a-deux{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.a-liste{position:sticky;top:10px;max-height:calc(100vh - 140px);display:flex;flex-direction:column;padding:8px}
.a-outils{display:flex;gap:6px;margin-bottom:6px}
.a-outils input,.a-outils select{flex:1;min-width:0;font:inherit;font-size:14px;border:2px solid var(--ligne);background:var(--surface);color:var(--encre);padding:4px 6px}
.a-items{list-style:none;margin:0;padding:0;overflow-y:auto}
.a-items li button{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--fond-2);padding:5px 6px}
.a-items li button small{grid-column:2/3;color:var(--encre-2);font-size:12px}
.a-items li button .a-tag{grid-row:1/3;grid-column:3}
.a-items li button .chip,.a-items li button .portrait-art{grid-row:1/3}
.a-items li button.actif{background:var(--rouge);color:#fff}
.a-items li button.actif small{color:#fff}
.a-li-nom{font-weight:700}
.a-tag{font-size:11px;font-weight:700;padding:1px 6px;border:1px solid currentColor}
.a-tag.mod{color:#b07a00}
.a-tag.nou{color:var(--ok)}
.a-tag.sup{color:var(--rouge)}
.a-vide{padding:10px;color:var(--encre-2)}
.a-editeur{background:var(--surface);border:3px solid var(--ligne);padding:14px 16px}
.a-tete-ed{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.a-tete-ed h2{font-size:30px}
.a-tete-ed h2 small{font-family:var(--texte);font-size:13px;color:var(--encre-2);margin-left:6px}
.a-boutons{display:flex;gap:6px;flex-wrap:wrap}
.a-grille{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.a-apercu{position:sticky;top:10px;display:flex;flex-direction:column;gap:8px}
.a-ligne{display:flex;flex-wrap:wrap;gap:10px 14px;margin-bottom:10px}
.a-champ{display:flex;flex-direction:column;gap:3px;min-width:140px;flex:1}
.a-lbl{font-weight:700;font-size:14px}
.a-aide{font-size:12.5px;color:var(--encre-2);margin:0}
.admin input[type=text],.admin input[type=number],.admin input[type=search],.admin select{font:inherit;font-size:15px;background:var(--surface);color:var(--encre);border:2px solid var(--ligne);padding:5px 7px;width:100%}
.a-cases{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 10px}
.a-case{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.a-case input{width:18px;height:18px;accent-color:var(--rouge)}
.a-bloc{border:2px solid var(--fond-2);margin:10px 0 0;padding:8px 12px 10px}
.a-bloc legend{font-family:var(--affiche);font-size:19px;padding:0 6px}
.a-effets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px 10px;margin:6px 0}
.a-effets .a-champ{min-width:0}
.a-regles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 16px;margin-top:6px}
.a-image{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;padding:6px;border:2px dashed transparent}
.a-image.survol{border-color:var(--rouge);background:var(--rouge-doux)}
.a-image-apercu{width:140px;height:170px;flex:none;border:3px solid #000;position:relative;display:grid;place-items:center;font-size:13px;overflow:hidden}
.a-image-apercu img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}
.a-image-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.btn.danger{background:var(--rouge);color:#fff;border-color:var(--rouge)}
label.btn{display:inline-block;cursor:pointer}
.a-table{border-collapse:collapse;margin-top:10px;min-width:min(640px,100%);background:var(--surface)}
.a-table th,.a-table td{border:2px solid var(--fond-2);padding:6px 10px;text-align:left}
.a-barre-pct{display:inline-block;width:120px;height:10px;border:2px solid var(--ligne);vertical-align:middle;margin-right:6px}
.a-barre-pct i{display:block;height:100%;background:var(--rouge)}
.a-barre{position:fixed;left:0;right:0;bottom:0;background:var(--encre);color:var(--fond);display:flex;gap:12px;justify-content:flex-end;align-items:center;flex-wrap:wrap;
  padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:30;font-weight:700}
.a-barre span{margin-right:auto}
.a-barre .btn:not(.fort){background:transparent;color:var(--fond);border-color:var(--fond)}
@media (max-width: 1100px){ .a-deux,.a-grille{grid-template-columns:1fr} .a-liste{position:static;max-height:360px} .a-apercu{position:static} }

/* ============================================================
   Velvet Room
   ============================================================ */
.velvet{--velvet:#1b2c8f;--velvet-clair:#3c55d6}
.velvet-titre{background:linear-gradient(120deg,#0b1240,var(--velvet) 60%,#4b2a8f)}
.velvet .onglets button[aria-current="page"]{background:var(--velvet)}
.velvet .onglets{border-bottom-color:var(--velvet)}
.vr-fusion{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0;padding:14px;background:linear-gradient(120deg,rgba(27,44,143,.12),rgba(75,42,143,.12));border:3px solid var(--velvet)}
.vr-slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.vr-vide{width:142px;min-height:196px;border:3px dashed var(--velvet);display:grid;place-items:center;text-align:center;padding:10px;font-weight:700;color:var(--encre-2);font-size:14px}
.vr-vide small{font-weight:400}
.vr-vide.erreur-txt{color:var(--rouge);border-color:var(--rouge);font-size:13px}
.vr-op{font-family:var(--affiche);font-size:44px;color:var(--velvet)}
.vr-slot.resultat .carte{box-shadow:0 0 0 4px var(--velvet-clair)}
.vr-regle{font-size:14px;margin:0;text-align:center;max-width:180px}
.vr-chaise{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.vr-chaise > div:first-child{display:flex;flex-direction:column;align-items:center;gap:6px}
.velvet-fenetre{border-color:var(--velvet,#1b2c8f)}
.velvet-fenetre h2{color:#1b2c8f}
:root[data-theme="dark"] .velvet-fenetre h2{color:#8fa0ff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .velvet-fenetre h2{color:#8fa0ff} }
.a-fusion td,.a-fusion th{padding:4px 10px}
.a-fusion tr.corrige td{background:rgba(255,212,0,.15)}
.a-fusion select{width:auto}

/* ============================================================
   DESIGN DES CARTES ET DU PLATEAU (illustrations mises en avant)
   ============================================================ */
.ico-el{width:1em;height:1em;flex:none;vertical-align:-.15em}
.chip{display:inline-flex;align-items:center;gap:3px}
.chip .ico-el{width:12px;height:12px}
.chip.neutre{background:var(--fond-2);color:var(--encre)}

/* ---------- La carte ---------- */
.carte{--w:138px;width:var(--w);height:calc(var(--w) * 1.42);min-height:0;flex:none;display:flex;flex-direction:column;padding:0;
  background:#fbfaf6;color:#111;border:3px solid #111;border-radius:9px;overflow:hidden;text-align:left;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s ease,box-shadow .15s ease}
.carte.k-persona{border-color:#c4121a}
.carte.k-objet{border-color:#9a7612}
.carte.k-visite{border-color:#000;box-shadow:0 0 0 3px var(--halo),0 3px 0 rgba(0,0,0,.35)}
button.carte:not(:disabled):hover{transform:translateY(-4px);box-shadow:0 8px 14px rgba(0,0,0,.35)}
.c-art{position:relative;flex:0 0 56%;overflow:hidden;display:block}
.c-img{position:absolute;left:0;right:0;bottom:0;top:6%;width:100%;height:94%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));pointer-events:none}
.c-filigrane{position:absolute;inset:0 0 18% 0;display:grid;place-items:center;opacity:.5;font-family:var(--affiche);font-size:calc(var(--w) * .35)}
.c-filigrane .ico-el{width:48%;height:48%}
.c-prix{position:absolute;top:5px;left:5px;z-index:2;background:var(--halo);color:#000;border:2px solid #000;font-family:var(--affiche);font-size:calc(var(--w) * .13);line-height:1.1;padding:0 6px;transform:skew(-10deg)}
.c-prix small{font-size:.6em;margin-left:1px}
.c-prix.discret{background:rgba(255,255,255,.88);font-size:calc(var(--w) * .1)}
.c-rang{position:absolute;top:6px;right:6px;z-index:2;color:var(--halo);font-size:calc(var(--w) * .08);letter-spacing:1px;text-shadow:0 1px 2px #000,0 0 3px #000}
.c-nom{position:absolute;left:0;right:0;bottom:0;z-index:2;background:#0c0c0c;color:#fff;font-family:var(--affiche);font-size:calc(var(--w) * .118);line-height:1.15;
  padding:calc(var(--w) * .045) 8px 3px;clip-path:polygon(0 30%,100% 0,100% 100%,0 100%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-nom.long{font-size:calc(var(--w) * .095)}
.c-corps{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding:4px 6px 5px;overflow:hidden}
.c-type{display:flex;align-items:center;gap:3px;font-size:calc(var(--w) * .074);font-weight:700;text-transform:uppercase;color:#5a5a60;white-space:nowrap;overflow:hidden}
.c-ligne{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.c-lbl{display:inline-flex;align-items:center;gap:2px;font-size:calc(var(--w) * .074);font-weight:700;margin-right:1px}
.c-om,.c-lien,.c-sac{border-top:1px dashed #bdbdbd;padding-top:2px}
.c-ligne.fait{background:#fff0a0;margin:0 -6px;padding:2px 6px;border-top-color:#e0b400}
.c-ligne.attente{opacity:.55}
.carte .pill{font-size:calc(var(--w) * .082);padding:0 5px}
.carte.r5 .c-art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%);mix-blend-mode:overlay;pointer-events:none}
.carte .indices{position:absolute;top:calc(var(--w) * .22);left:4px;right:auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;z-index:3}
.carte.combo{box-shadow:0 0 0 3px var(--halo)}
.carte.abordable{box-shadow:0 0 0 3px var(--halo),0 0 14px rgba(255,212,0,.6)}
.carte.choisie{outline:4px solid var(--rouge);outline-offset:-2px}
.carte.nouvelle{animation:pop .6s ease-out}

/* Tailles */
.main-cartes .carte{--w:150px;min-height:0}
.zone .carte{--w:134px}
.carte.mini{--w:92px;min-height:0}
.carte.mini .c-art{flex:1}
.carte.mini .c-corps,.carte.mini .c-prix,.carte.mini .indices{display:none}
.carte.grande{--w:250px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.loupe-grande{display:flex;justify-content:center;margin-bottom:6px}
.loupe-flottante .carte.grande,.loupe .carte.grande{--w:min(250px,100%)}
.vr-vide{width:138px;min-height:196px}

/* ---------- La carte de Leader ---------- */
.leader-carte{--lw:104px;position:relative;display:block;width:var(--lw);height:calc(var(--lw) * 1.36);flex:none;border:3px solid #000;border-radius:9px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.lc-img{position:absolute;left:0;right:0;bottom:0;top:4%;width:100%;height:96%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.lc-filigrane{position:absolute;inset:0 0 22% 0;display:grid;place-items:center;opacity:.55;font-family:var(--affiche);font-size:calc(var(--lw) * .4)}
.lc-filigrane .ico-el{width:50%;height:50%}
.lc-bas{position:absolute;left:0;right:0;bottom:0;background:#0c0c0c;color:#fff;padding:calc(var(--lw) * .07) 7px 4px;clip-path:polygon(0 28%,100% 0,100% 100%,0 100%);display:flex;flex-direction:column;line-height:1.05}
.lc-nom{font-family:var(--affiche);font-size:calc(var(--lw) * .17)}
.lc-arc{font-size:calc(var(--lw) * .095);font-weight:700;color:var(--halo);text-transform:uppercase}
.lc-badge{position:absolute;top:5px;left:5px;background:var(--rouge);color:#fff;font-family:var(--affiche);font-size:13px;padding:0 6px;transform:skew(-10deg);z-index:2}
.leader-carte.plateau{--lw:96px}
.leader-carte.profil{--lw:86px}
.leaders{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.leader-btn{border:0;background:none;padding:0}
.leader-btn .leader-carte{width:100%;height:auto;aspect-ratio:3/4;--lw:110px}
.leader-btn[aria-pressed="true"] .leader-carte{outline:4px solid var(--rouge);outline-offset:2px}
.leader-btn:hover .leader-carte{transform:translateY(-3px)}

/* ---------- Bandeaux des joueurs ---------- */
.bandeau{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:8px 12px}
.b-infos{display:flex;flex-direction:column;gap:4px;min-width:0}
.b-ligne{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.b-joueur{font-weight:700;color:var(--encre-2)}
.b-pv{margin-left:auto}
.b-pv b{font-family:var(--affiche);font-weight:400;font-size:36px;line-height:1}
.b-pv small{font-size:14px;color:var(--encre-2);margin-left:4px}
.bandeau .jauge{height:14px}
.bandeau .jauge.basse i{background:#ff2a2a}
.b-tags{align-items:center;gap:6px}
.b-faib{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.bandeau .capa{font-size:13px}
.b-piles{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.pile-dos{width:46px;height:64px;border:2px solid #000;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1;
  background:repeating-linear-gradient(45deg,#c4121a 0 6px,#8e0b11 6px 12px);box-shadow:2px 2px 0 #000}
.pile-dos b{font-family:var(--affiche);font-weight:400;font-size:20px}
.pile-dos small{font-size:10px;font-weight:700;background:#000;padding:0 3px;margin-top:3px}
.pile-dos.defausse{background:repeating-linear-gradient(45deg,#55555b 0 6px,#3b3b40 6px 12px)}
.pile-dos.main{background:#111}
.dock .leader-carte.plateau{--lw:76px}
.dock .bandeau{padding:5px 10px}
.dock .bandeau .capa{display:none}
.dock .pile-dos{width:38px;height:52px}
.dock .b-pv b{font-size:30px}

/* ---------- Plateau sombre ---------- */
body:has(.plateau-jeu){background:radial-gradient(circle at 15% -10%,#6b0b10 0,transparent 45%),radial-gradient(circle at 100% 110%,#3a0609 0,transparent 45%),
  repeating-linear-gradient(-35deg,rgba(255,255,255,.035) 0 2px,transparent 2px 20px),#130607;background-attachment:fixed}
body:has(.plateau-jeu) .entete{color:#fff}
body:has(.plateau-jeu) .entete .tour{color:rgba(255,255,255,.75)}
body:has(.plateau-jeu) .entete .lien-btn{border-color:#fff;color:#fff}
body:has(.plateau-jeu) .entete .statut:not(.moi){border-color:#fff;color:#fff}
.plateau-jeu .zone{background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.12);color:#fff}
.plateau-jeu .zone h2{color:#fff}
.plateau-jeu .zone h2 small,.plateau-jeu .zone .discret{color:rgba(255,255,255,.7)}
.plateau-jeu .zone.jouees.moi{box-shadow:inset 0 0 0 3px var(--rouge)}
.plateau-jeu .zone.jouees.adv{box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
body:has(.plateau-jeu) .dock{background:rgba(12,4,5,.94);border-top-color:var(--rouge)}
body:has(.plateau-jeu) .dock .main-cartes .discret{color:rgba(255,255,255,.7)}
body:has(.plateau-jeu) .dock .btn{background:var(--surface)}
.emplacement .btn.petit{background:var(--surface)}

@media (max-width: 1000px){
  .bandeau{grid-template-columns:auto minmax(0,1fr)}
  .b-piles{grid-column:1/3;justify-content:flex-start;max-width:none}
  .leaders{grid-template-columns:repeat(3,minmax(0,1fr))}
  .main-cartes .carte{--w:132px}
}
@media (prefers-reduced-motion: reduce){ .carte,.leader-btn .leader-carte{transition:none} }
/* Ajustements : loupe et zone du joueur plus compacte */
.loupe-flottante .carte.grande,.loupe .carte.grande{--w:230px}
.dock{gap:4px;padding-top:6px}
.dock .leader-carte.plateau{--lw:56px;border-width:2px}
.dock .leader-carte.plateau .lc-arc{display:none}
.dock .leader-carte.plateau .lc-nom{font-size:13px}
.dock .leader-carte.plateau .lc-badge{font-size:10px;top:2px;left:2px}
.dock .bandeau{gap:4px 12px;padding:4px 10px}
.dock .b-infos{gap:2px}
.dock .bandeau .jauge{height:10px}
.dock .b-pv b{font-size:26px}
.dock .pile-dos{width:34px;height:46px}
.dock .pile-dos b{font-size:16px}
.dock .consigne-ligne{padding:3px 10px;font-size:14px}
.dock .main-cartes{padding-top:4px}
.main-cartes .carte{--w:132px}
.leader-btn[aria-pressed="true"] .leader-carte{outline:none;box-shadow:0 0 0 4px var(--rouge),0 6px 14px rgba(0,0,0,.35)}
.pile .nb{top:-8px;right:-8px;bottom:auto;border-radius:12px;border:2px solid #fff;font-size:15px;padding:0 8px;z-index:4}
.grille-cartes{gap:14px 12px;padding-top:8px}

/* Icônes d’éléments déposées dans l’Administration */
img.ico-el{object-fit:contain}
.c-filigrane img.ico-el,.lc-filigrane img.ico-el{opacity:1}
.a-elements{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0}
.a-element h3{font-size:20px;margin-bottom:6px}
.a-image.petite .a-image-apercu{width:90px;height:90px}
.a-image.petite .a-image-apercu img{object-position:center;padding:10px}
.a-ico-defaut .ico-el{width:52px;height:52px;opacity:.85}
.a-image.cible{border-color:var(--halo)}

/* Catalogue de l’Administration */
.a-cat-haut{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-bottom:14px}
.a-cat-haut h3{font-size:20px;margin-bottom:4px}
.a-croise td,.a-croise th{text-align:center;padding:4px 10px}
.a-croise th[scope=row]{text-align:left;white-space:nowrap}
.a-croise tr.total td,.a-croise tr.total th{border-top:3px solid var(--ligne)}
.a-groupe{background:var(--surface);border:2px solid var(--ligne);margin-bottom:8px;padding:6px 12px}
.a-groupe summary{cursor:pointer;font-family:var(--affiche);font-size:21px}
.a-groupe summary small{font-family:var(--texte);font-size:14px;color:var(--encre-2)}
.a-groupe .grille-cartes{margin:8px 0 6px}

/* Nouveaux effets : couleurs des pastilles, états, niveau des Personas */
.pill.etat{background:#3a0d4a;color:#f2d6ff}
.pill.prot{background:#d8ecff;color:#0b3a6b}
.pill.bonus{background:#fff0b3;color:#6b4d00}
.pill.cond{background:#fff;color:#444;border:1px dashed #888}
.b-etats{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.b-etats-lbl{font-weight:700;color:var(--encre-2)}
.effets-tour{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.c-niv{position:absolute;right:5px;top:calc(var(--w) * .2);z-index:2;background:#000;color:#fff;font-family:var(--affiche);font-size:calc(var(--w) * .085);padding:0 5px;transform:skew(-10deg)}
.carte.verrou{filter:grayscale(.8);opacity:.6}
.montees{font-size:14px}

/* Administration : effets avancés et jauge de budget */
.a-avance{margin:4px 0;border-top:1px dashed var(--fond-2);padding-top:4px}
.a-avance summary{cursor:pointer;font-weight:700;font-size:13.5px}
.a-jauge{display:flex;flex-direction:column;gap:4px;margin:6px 0 10px;font-size:14px}
.a-jauge-barre{position:relative;height:12px;border:2px solid var(--ligne);background:var(--fond-2)}
.a-jauge-barre i{display:block;height:100%;background:var(--ok)}
.a-jauge.limite .a-jauge-barre i{background:#e0a400}
.a-jauge.trop .a-jauge-barre i{background:var(--rouge)}
.a-jauge.faible .a-jauge-barre i{background:#7a8aa0}
.a-jauge-repere{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--encre)}

/* Réglage de la musique */
.musique-ctrl{position:fixed;top:8px;right:8px;z-index:60;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--ligne);padding:3px 8px;box-shadow:3px 3px 0 #000}
.musique-ctrl[hidden]{display:none}
.musique-bouton{background:none;border:0;font-weight:700;font-size:15px;padding:2px 4px}
.musique-ctrl input{width:90px;accent-color:var(--rouge)}
body:has(.musique-ctrl:not([hidden])) .entete .droite,body:has(.musique-ctrl:not([hidden])) .barre-nav{padding-right:190px}

/* Administration : musiques */
.a-musiques{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:10px}
.a-musique h3{font-size:20px}
.a-pistes{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.a-pistes li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-bottom:1px solid var(--fond-2);padding-bottom:6px}
.a-piste-nom{font-weight:700;flex:1 1 100%}
.a-pistes audio{height:32px;flex:1;min-width:180px}

.conf-toutes{font-size:13px;margin-top:2px}
.conf-toutes summary{cursor:pointer;font-weight:700;color:var(--encre-2)}
.conf-toutes ol{margin:4px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.conf-toutes li{padding-left:18px;position:relative}
.conf-toutes li::before{content:"○";position:absolute;left:2px;color:var(--encre-2)}
.conf-toutes li.faite::before{content:"✓";color:var(--ok);font-weight:700}
.conf-toutes li.active{font-weight:700}
.conf-toutes li.active::before{content:"▶";color:var(--rouge)}
.conf-toutes em{color:var(--rouge);font-style:normal}

</style>
</head>

/* ============================================================
   VALEURS — ce que vaut chaque effet, et le budget de chaque rang
   Partagé par le générateur de cartes, le moteur et l’Administration.
   ============================================================ */
const VALEURS = (function(){
// Valeur d’une unité de chaque effet, en points
const POIDS = {
  deg:1, yen:1.3, pv:0.6, pioche:2.5, defausse:2, purge:1.5, vision:0.7, bouclier:0.8,
  brulure:0.9, gel:2.5, choc:2, confusion:2.5, oubli:1.5, vertige:1.5, affaiblir:0.8, vulnerable:0.9,
  attaque:1.5, double:3, dissiper:1.5, purifier:1.5, renvoi:0.7, prep:1.5, remplacer:1.5, technique:0.6,
  parCombo:2, copie:3, skillsPlus:1.5, hasard:1, parDefausse:1.5, perdrePV:-0.6, defausseSoi:-1.5, parLien:1.5, remise:1.5
};
// Maximum d’unités par effet (au-delà, l’effet devient illisible ou injouable)
const MAX = {renvoi:6, bouclier:8, attaque:3, brulure:4, affaiblir:4, vulnerable:4, technique:4, skillsPlus:2, parDefausse:2, parLien:2, pioche:2, defausse:2, purge:2, gel:1, choc:1, confusion:1, oubli:1, vertige:2, double:1, dissiper:1, purifier:1, prep:1, remplacer:1, copie:1, remise:2, defausseSoi:1};
// Un effet conditionnel (One More, Lien) ne se déclenche pas toujours : il compte pour 60 %
const CONDITIONNEL = 0.6, CONDITION_EN_PLUS = 0.6, SACRIFICE = 0.5;
// Budget d’une carte selon son rang : 4 points au rang 1, puis 1,5 point par rang
const budget = rang => 4 + 1.5 * (Math.max(1, rang || 1) - 1);
const coutRang = rang => Math.max(1, rang || 1);
function valeurEffet(e){
  if(!e) return 0;
  let v = 0;
  for(const [k, n] of Object.entries(e)) if(typeof n === "number" && POIDS[k] !== undefined) v += POIDS[k] * n;
  return v;
}
function valeurCarte(d){
  if(!d) return 0;
  let v = valeurEffet(d.effet);
  if(d.combo) v += CONDITIONNEL * valeurEffet(d.combo);
  if(d.lien) v += CONDITIONNEL * (d.lien.cond ? CONDITION_EN_PLUS : 1) * valeurEffet(d.lien);
  if(d.sacrifice) v += SACRIFICE * valeurEffet(d.sacrifice);
  if(d.parPhysique) v += 1;
  if(d.finition) v += 1;
  if(d.perce) v += 1;
  return Math.round(v * 10) / 10;
}
return {POIDS, MAX, CONDITIONNEL, CONDITION_EN_PLUS, SACRIFICE, budget, coutRang, valeurEffet, valeurCarte};
})();
if(typeof module !== "undefined") module.exports = VALEURS;

</script>

const MOTEUR = (function(){

// Cartes dérivées des Leaders : carte de départ évoluée (Confidents) et carte de visite.

function genererDerivees(){
  for(const id of Object.keys(C)) if(/^depart_.+_evo\d$|^visite_/.test(id)) delete C[id];
  // Persona du Leader dans son deck de départ : forme de base (evo0), puis évolutions des Confidents (evo1, evo2).
  // Si la carte existe (Arsène, Raoul, Loki…), c’est elle qui est utilisée, avec son image et ses effets ; sinon une version générée.
  const normal = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  const parNom = {};
  for(const [cid, c] of Object.entries(C)) if(!c.depart && !c.visite && c.kind === "persona") parNom[normal(c.nom)] = cid;
  for(const [id, L] of Object.entries(LEADERS)){
    const base = C["depart_" + (L.el || "aucun")];
    [L.persona, ...(L.evos || [])].slice(0, 3).forEach((nom, n) => {
      const existante = parNom[normal(nom)];
      if(existante){
        C[`depart_${id}_evo${n}`] = Object.assign(JSON.parse(JSON.stringify(C[existante])), {cout:0, depart:true, leader:id, carteSource:existante});
        delete C[`depart_${id}_evo${n}`].reservee;
        return;
      }
      // Version générée : rang 5, 7 ou 9, effets de la base multipliés selon le budget du rang
      const rang = [5, 7, 9][n], k = VAL.budget(rang) / VAL.budget(5);
      const effet = Object.fromEntries(Object.entries(base.effet).map(([c, v]) => [c, VAL.MAX[c] ? Math.min(VAL.MAX[c], Math.round(v * k)) : Math.round(v * k)]));
      C[`depart_${id}_evo${n}`] = {nom: nom || L.nom, kind:"persona", el:L.el, arcane:L.arcane || null, rang, cout:0, depart:true, leader:id,
        effet, lien: {yen: n + 1}, parPhysique: base.parPhysique, finition: base.finition, perce: base.perce};
    });
  }

  for(const [id, c] of Object.entries(C)) if(!c.depart){ if(reservees.has(normal(c.nom))) c.reservee = true; else delete c.reservee; }
  // Carte de visite de chaque Leader : générée d’après son archétype
  for(const [id, L] of Object.entries(LEADERS)){
    const combo = L.el ? ({feu:{brulure:2, deg:2}, gla:{gel:1, deg:2}, ele:{pioche:1, deg:2}, ven:{yen:2, deg:2}, psy:{confusion:1, deg:3}, nuc:{technique:3, deg:2},
      sac:{bouclier:4, pv:3}, mau:{defausse:1, deg:2}, phy:{deg:4}, gun:{deg:4}, pur:{deg:3, pv:2}})[L.el] : null;
    C["visite_" + id] = {nom:`Carte de visite de ${L.nom}`, kind:"visite", el:L.el, rang:5, cout:0, effet: L.el ? {deg:8} : {deg:6, pioche:2}, combo, visite:true};
  }

}
genererDerivees();

/* ---------- Hasard reproductible ---------- */
function alea(S){ let t = (S.rng = (S.rng + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function melanger(S, a){ for(let i = a.length-1; i > 0; i--){ const k = Math.floor(alea(S)*(i+1)); [a[i], a[k]] = [a[k], a[i]]; } return a; }
const def = c => C[c.id];
const joueur = S => S.joueurs[S.courant];
const adversaire = (S, j) => S.joueurs.find(x => x !== (j || joueur(S)));
function nouvelleCarte(S, id){ S.uid = (S.uid||0) + 1; return {uid:"c" + S.uid, id}; }
function log(S, t){ S.journal.push({tour:S.tour, t}); }
function fx(S, o){ S.fxN = (S.fxN||0) + 1; S.fx.push(Object.assign({n:S.fxN}, o)); if(S.fx.length > 80) S.fx.splice(0, S.fx.length - 80); }
const nomCarte = c => def(c).nom;
const valeur = e => VAL.valeurEffet(e || {});

/* ---------- Deck de marché (30 cartes) généré pour les tests ---------- */
function deckMarche(S, leader, rangMax, part){
  const el = LEADERS[leader].el;
  const ok = Object.keys(C).filter(id => { const c = C[id]; return !c.depart && !c.unique && !c.visite && !c.reservee && c.kind !== "objet" && c.rang >= 1 && c.rang <= rangMax; });
  const mien = ok.filter(id => C[id].el === el), autres = ok.filter(id => C[id].el !== el);
  const pick = (l, n) => { const out = []; for(let i = 0; i < n && l.length; i++) out.push(l[Math.floor(alea(S)*l.length)]); return out; };
  const n = Math.round(30 * part);
  return [...pick(mien.length ? mien : ok, n), ...pick(autres, 30 - n)];
}

/* ---------- Mise en place ---------- */
function nouvellePartie(cfg){
  const S = {rng:(cfg.seed >>> 0) || 1, tour:1, journal:[], fx:[], vainqueur:null, marche:[], pioche:[], attente:[], cfg};
  S.joueurs = cfg.joueurs.map((jc, i) => {
    const L = LEADERS[jc.leader];
    const depart = [...Array(7)].map(() => nouvelleCarte(S, "yen"));
    depart.push(nouvelleCarte(S, "liasse"), nouvelleCarte(S, "attaque"), nouvelleCarte(S, `depart_${jc.leader}_evo${jc.evo || 0}`));
    const marche = jc.marche || deckMarche(S, jc.leader, jc.rangMax || 9, jc.part ?? 0.5);
    return {nom: jc.nom || `Joueur ${i+1}`, ia: !!jc.ia, leader: jc.leader, L, pv: R.pv, deck: melanger(S, depart), main: [], defausse: [], aDefausser: 0, visite: false,
      marche, etats:{}, protections:{}, stats:{combos:0, combosElement:0, combosPossibles:0, aoa:0, faiblesse:0, degats:0, tours:0, purges:0, cartes:0, joues:{},
        liens:0, etats:{}, pvSoignes:0, yenGagnes:0, achats:0, pioches:0, visions:0, bouclier:0, peur:0, multiCombos:0, maxTour:0}};
  });
  S.pioche = melanger(S, S.joueurs.flatMap(j => j.marche.map(id => nouvelleCarte(S, id))));
  remplir(S);
  S.courant = alea(S) < 0.5 ? 0 : 1; S.premier = S.courant;
  S.joueurs.forEach((j, i) => piocher(S, j, i === S.courant ? R.mainPremier : R.mainDepart));
  log(S, `Début du duel. ${S.joueurs[S.courant].nom} commence.`);
  debutTour(S);
  return S;
}
function remplir(S){ while(S.marche.length < R.tailleMarche && S.pioche.length) S.marche.push(S.pioche.pop()); }
function piocher(S, j, n){
  for(let i = 0; i < n; i++){
    if(!j.deck.length){ if(!j.defausse.length) return; j.deck = melanger(S, j.defausse); j.defausse = []; log(S, `${j.nom} remélange sa défausse.`); }
    j.main.push(j.deck.pop());
  }
}

/* ---------- Tour ---------- */
// États : ceux posés par l’adversaire (etats) se consomment pendant votre prochain tour ;
// vos protections (Bouclier, Renvoi) durent jusqu’au début de votre prochain tour.
const ETATS_SUBIS = ["brulure", "gel", "choc", "confusion", "oubli", "vertige", "affaiblir"];
function debutTour(S){
  const j = joueur(S), opp = adversaire(S, j);
  j.stats.tours++;
  const e = j.etats || {};
  S.ctx = {yen:0, yenTotal:0, deg:0, pvGagnes:0, combos:0, liens:0, joues:[], combosFaits:{}, liensFaits:{}, capaFaite:false, aoa:false, journal:[], achats:[], recu:j.recu || null,
    gel:e.gel || 0, choc:e.choc || 0, oubli:!!e.oubli, surcout:e.vertige || 0, affaibli:e.affaiblir || 0,
    attaque:0, double:0, vulnerable:0, remise:0, prep:0, bonusSkill:0, perce:false};
  j.recu = null; j.protections = {};
  log(S, `Tour ${S.tour} : ${j.nom}.`);
  if(e.brulure){ j.pv -= e.brulure; S.ctx.journal.push({lib:"Brûlure subie", k:"pv", v:-e.brulure}); log(S, `${j.nom} subit ${e.brulure} dégâts de Brûlure.`); fx(S, {t:"degats", j:S.joueurs.indexOf(j), v:e.brulure}); }
  if(e.confusion) for(let n = 0; n < e.confusion && j.main.length; n++){ const c = j.main.splice(Math.floor(alea(S) * j.main.length), 1)[0]; j.defausse.push(c); log(S, `Confusion : ${j.nom} défausse ${nomCarte(c)}.`); }
  for(const [k, txt] of [["gel", "Gel : une carte de moins à piocher en fin de tour"], ["choc", "Choc : le premier One More ne se déclenche pas"], ["oubli", "Oubli : pas de Lien d’Arcane ce tour"], ["vertige", "Vertige : le marché coûte plus cher"], ["affaiblir", "Affaibli : moins de dégâts ce tour"]])
    if(e[k]) log(S, `${j.nom} subit ${txt}.`);
  j.etats = {};
  if(j.pv <= 0){ S.vainqueur = S.joueurs.indexOf(opp); log(S, `${opp.nom} gagne le duel !`); fx(S, {t:"fin"}); return; }
  if(j.aDefausser > 0 && j.main.length){
    const n = Math.min(j.aDefausser, j.main.length); j.aDefausser = 0;
    S.attente.push({type:"defausse", n});
  } else j.aDefausser = 0;
}
// Choix en attente du joueur : défausse imposée, purge, vision
const choixEnCours = S => S.attente[0] || null;
const aUnEtat = j => Object.values(j.etats || {}).some(v => v) || j.aDefausser > 0;
const MAXETAT = {gel:1, choc:1, confusion:1, oubli:1, vertige:2, brulure:6, affaiblir:6};

// Applique un effet et note sa provenance dans le détail du tour (ctx.journal)
function appliquer(S, j, e, ctx, origine, libelle){
  if(!e) return;
  const opp = adversaire(S, j), note = (k, v, extra) => ctx.journal.push({lib: libelle || "", k, v, extra});
  const st = j.stats;
  if(e.yen){ ctx.yen += e.yen; ctx.yenTotal += e.yen; st.yenGagnes += e.yen; note("yen", e.yen); }
  if(e.pv){ const avant = j.pv; j.pv = Math.min(R.pv, j.pv + e.pv); ctx.pvGagnes += j.pv - avant; st.pvSoignes += j.pv - avant; note("pv", j.pv - avant, j.pv - avant < e.pv ? "PV au maximum" : ""); if(j.pv > avant) fx(S, {t:"soin", j:S.joueurs.indexOf(j), v:j.pv - avant}); }
  if(e.deg){ let d = e.deg, extra = ""; if(origine && origine.finition && opp.pv < 20){ d *= 2; extra = "doublés : Finition"; } ctx.deg += d; note("deg", d, extra); }
  if(e.parCombo && ctx.combos){ ctx.deg += ctx.combos; note("deg", ctx.combos, `${ctx.combos} combo${ctx.combos > 1 ? "s" : ""} ce tour`); }
  if(e.pioche){ piocher(S, j, e.pioche); st.pioches += e.pioche; note("pioche", e.pioche); }
  if(e.defausse){ opp.aDefausser = Math.min(R.defausseMax, opp.aDefausser + e.defausse); st.peur += e.defausse; note("defausse", e.defausse); log(S, `Peur : ${opp.nom} devra défausser une carte.`); }
  if(e.purge){ for(let k = 0; k < e.purge; k++) S.attente.push({type:"purge"}); note("purge", e.purge); }
  if(e.vision){ S.attente.push({type:"vision", n:e.vision}); st.visions++; note("vision", e.vision); }
  // Altérations posées sur l’adversaire
  opp.etats = opp.etats || {};
  for(const k of ETATS_SUBIS) if(e[k]){ opp.etats[k] = Math.min(MAXETAT[k] || 9, (opp.etats[k] || 0) + e[k]); st.etats[k] = (st.etats[k] || 0) + e[k]; note(k, e[k]); }
  // Protections et bonus du tour
  j.protections = j.protections || {};
  if(e.bouclier){ j.protections.bouclier = (j.protections.bouclier || 0) + e.bouclier; st.bouclier += e.bouclier; note("bouclier", e.bouclier); }
  if(e.renvoi){ j.protections.renvoi = (j.protections.renvoi || 0) + e.renvoi; note("renvoi", e.renvoi); }
  if(e.vulnerable){ ctx.vulnerable += e.vulnerable; note("vulnerable", e.vulnerable); }
  if(e.attaque){ ctx.attaque += e.attaque; note("attaque", e.attaque); }
  if(e.double){ ctx.double += e.double; note("double", e.double); }
  if(e.prep){ ctx.prep += e.prep; note("prep", e.prep); }
  if(e.remise){ ctx.remise += e.remise; note("remise", e.remise); }
  if(e.dissiper){ opp.protections = {}; note("dissiper", 1); }
  if(e.purifier){ Object.assign(ctx, {gel:0, choc:0, oubli:false, surcout:0, affaibli:0}); j.etats = {}; note("purifier", 1); }
  if(e.technique && aUnEtat(opp)){ ctx.deg += e.technique; note("deg", e.technique, "Technique : l’adversaire subit une altération"); }
  if(e.remplacer && S.marche.length){
    const k = S.marche.reduce((b, c, i) => def(c).cout > def(S.marche[b]).cout ? i : b, 0);
    const c = S.marche.splice(k, 1)[0]; S.pioche.unshift(c); remplir(S); note("remplacer", 1); log(S, `${nomCarte(c)} quitte le marché.`);
  }
  // Effets d’Arcane
  if(e.copie){
    const autres = ctx.joues.filter(x => def(x).kind === "persona" && (!origine || def(x) !== origine));
    const cible = autres.sort((a, b) => valeur(def(b).effet) - valeur(def(a).effet))[0];
    if(cible){ log(S, `Le Fou copie ${nomCarte(cible)}.`); appliquer(S, j, def(cible).effet, ctx, def(cible), `${libelle} (copie de ${nomCarte(cible)})`); }
  }
  if(e.skillsPlus){ ctx.bonusSkill += e.skillsPlus; const n = ctx.joues.filter(x => def(x).kind === "skill").length * e.skillsPlus; if(n){ ctx.deg += n; note("deg", n, "skills déjà joués"); } }
  if(e.hasard){
    const v = e.hasard * 4, options = [{deg: Math.round(v)}, {yen: Math.max(1, Math.round(v / 1.3))}, {pv: Math.round(v / 0.6)}, {pioche: 1}];
    const o = options[Math.floor(alea(S) * options.length)]; log(S, "La Fortune tourne…"); appliquer(S, j, o, ctx, null, `${libelle} (hasard)`);
  }
  if(e.parDefausse){ const n = Math.floor(j.defausse.length / 4) * e.parDefausse; if(n){ ctx.deg += n; note("deg", n, `${j.defausse.length} cartes en défausse`); } }
  if(e.parLien){ const n = ctx.liens * e.parLien; if(n){ ctx.deg += n; note("deg", n, `${ctx.liens} Lien${ctx.liens > 1 ? "s" : ""} ce tour`); } }
  if(e.perdrePV){ j.pv = Math.max(1, j.pv - e.perdrePV); note("pv", -e.perdrePV, "prix du Diable"); }
  if(e.defausseSoi && j.main.length){ const c = j.main.splice(Math.floor(alea(S) * j.main.length), 1)[0]; j.defausse.push(c); note("defausseSoi", 1); log(S, `La Tour : ${j.nom} défausse ${nomCarte(c)}.`); }
}
const compatibles = (a, b) => a && b && (a === b || a === "pur" || b === "pur");
const declencheParCarte = d => d.kind === "skill" || d.kind === "visite";

function jouerCarte(S, uid){
  if(S.vainqueur !== null || choixEnCours(S)) return false;
  const j = joueur(S), k = j.main.findIndex(c => c.uid === uid);
  if(k < 0) return false;
  const c = j.main.splice(k, 1)[0], d = def(c), ctx = S.ctx, opp = adversaire(S, j);
  j.stats.cartes++;
  j.stats.joues = j.stats.joues || {}; j.stats.joues[c.id] = (j.stats.joues[c.id] || 0) + 1;
  if(d.el && d.combo) j.stats.combosPossibles++;
  log(S, `${j.nom} joue ${d.nom}.`); fx(S, {t:"joue", uid:c.uid});
  if(d.perce) ctx.perce = true;
  appliquer(S, j, d.effet, ctx, d, d.nom);
  // Charge / Concentrate : le prochain skill fait double effet
  if(d.kind === "skill" && ctx.double > 0 && !(d.effet && d.effet.double)){ ctx.double--; appliquer(S, j, d.effet, ctx, d, `${d.nom} (double effet)`); }
  if(d.effet && d.effet.deg && ctx.attaque && !d.effet.attaque){ ctx.deg += ctx.attaque; ctx.journal.push({lib:`${d.nom} (attaque renforcée)`, k:"deg", v:ctx.attaque}); }
  if(d.kind === "skill" && ctx.bonusSkill){ ctx.deg += ctx.bonusSkill; ctx.journal.push({lib:`${d.nom} (Magicien)`, k:"deg", v:ctx.bonusSkill}); }
  if(d.parPhysique){ const n = ctx.joues.filter(x => def(x).el === "phy").length; if(n){ ctx.deg += n; ctx.journal.push({lib:`${d.nom} (bonus Physique)`, k:"deg", v:n, extra:`${n} autre${n > 1 ? "s" : ""} carte${n > 1 ? "s" : ""} Physique`}); } }
  ctx.joues.push(c);
  // Faiblesse du Leader adverse
  if(d.el && d.el === opp.L.faiblesse && R.faiblesse){ ctx.deg += R.faiblesse; j.stats.faiblesse += R.faiblesse; ctx.journal.push({lib:`Faiblesse de ${opp.L.nom} (${ELEMENTS[d.el].nom})`, k:"deg", v:R.faiblesse}); log(S, `Faiblesse de ${opp.L.nom} : +${R.faiblesse} dégât.`); fx(S, {t:"faiblesse", uid:c.uid}); }
  verifierCombos(S, j);

  if(!ctx.aoa){
    const els = ctx.joues.map(x => def(x).el).filter(Boolean), pur = els.filter(e => e === "pur").length, compte = {};
    for(const e of els) if(e !== "pur") compte[e] = (compte[e]||0) + 1;
    if(Math.max(pur, ...Object.values(compte).map(n => n + pur)) >= R.aoaCartes){
      ctx.aoa = true; ctx.deg += R.aoaDegats; j.stats.aoa++; ctx.journal.push({lib:"All-Out Attack", k:"deg", v:R.aoaDegats}); log(S, `All-Out Attack ! +${R.aoaDegats} dégâts.`); fx(S, {t:"aoa"});
    }
  }
  return true;
}
// Un skill déclenche son One More si une Persona de son élément a été jouée ce tour (les Pur comptent pour tous),
// ou si le skill est de l’élément du Leader
function oneMorePossible(S, j, dx){
  if(!dx.el || !dx.combo) return false;
  if(j.L.el && dx.el === j.L.el) return true;
  return S.ctx.joues.some(y => def(y).kind === "persona" && compatibles(def(y).el, dx.el));
}
// Une Persona déclenche son Lien si une autre Persona de son Arcane a été jouée ce tour, ou si le Leader est de son Arcane
function lienPossible(S, j, x){
  const dx = def(x), ctx = S.ctx, opp = adversaire(S, j);
  if(dx.kind !== "persona" || !dx.lien || ctx.oubli) return false;
  if(!(dx.arcane && (dx.arcane === j.L.arcane || ctx.joues.some(y => y !== x && def(y).kind === "persona" && def(y).arcane === dx.arcane)))) return false;
  const personas = ctx.joues.filter(y => def(y).kind === "persona").length;
  switch(dx.lien.cond){
    case "deuxPersonas": return personas === 2;
    case "premiere": return ctx.joues[0] === x;
    case "moinsPV": return j.pv < opp.pv;
    case "seulePersona": return personas === 1;
    case "pvBas": return j.pv <= 20;
    default: return true;
  }
}
function verifierCombos(S, j){
  const ctx = S.ctx;
  for(const x of ctx.joues){
    const dx = def(x);
    if(!declencheParCarte(dx) || ctx.combosFaits[x.uid] || !oneMorePossible(S, j, dx)) continue;
    ctx.combosFaits[x.uid] = true;
    if(ctx.choc > 0){ ctx.choc--; log(S, `Choc : le One More de ${dx.nom} ne se déclenche pas.`); continue; }
    ctx.combos++; j.stats.combos++;
    if(dx.el === j.L.el) j.stats.combosElement++;
    log(S, `One More (${ELEMENTS[dx.el].nom}) : ${dx.nom}.`); fx(S, {t:"onemore", uid:x.uid});
    appliquer(S, j, dx.combo, ctx, dx, `One More ${ELEMENTS[dx.el].nom} · ${dx.nom}`);
    if(!ctx.capaFaite && (dx.el === j.L.el || j.L.toutCombo)){
      ctx.capaFaite = true;
      log(S, `Capacité de ${j.L.nom}.`); fx(S, {t:"capa", j:S.joueurs.indexOf(j)});
      appliquer(S, j, j.L.capa, ctx, null, `Capacité de ${j.L.nom}`);
    }
  }
  for(const x of ctx.joues){
    if(ctx.liensFaits[x.uid] || !lienPossible(S, j, x)) continue;
    const dx = def(x);
    ctx.liensFaits[x.uid] = true; ctx.liens++; j.stats.liens++;
    log(S, `Lien d’Arcane : ${dx.nom}.`); fx(S, {t:"lien", uid:x.uid});
    appliquer(S, j, dx.lien, ctx, dx, `Lien d’Arcane · ${dx.nom}`);
  }
}

/* ---------- Aperçu d’une carte de la main (indices pour le joueur) ---------- */
function apercu(S, uid){
  const j = joueur(S), c = j.main.find(x => x.uid === uid), ctx = S.ctx;
  if(!c || !ctx) return null;
  const d = def(c), opp = adversaire(S, j), r = {propre:false, declenche:[], faiblesse:false, aoa:false, lien:false};
  if(declencheParCarte(d) && d.combo && d.el) r.propre = (j.L.el && d.el === j.L.el) || ctx.joues.some(y => def(y).kind === "persona" && compatibles(def(y).el, d.el));
  if(d.kind === "persona" && d.el) for(const x of ctx.joues){ const dx = def(x); if(declencheParCarte(dx) && dx.combo && !ctx.combosFaits[x.uid] && compatibles(d.el, dx.el)) r.declenche.push(dx.nom); }
  r.faiblesse = !!(d.el && d.el === opp.L.faiblesse && R.faiblesse);
  if(d.el && !ctx.aoa){
    const els = [...ctx.joues.map(x => def(x).el), d.el].filter(Boolean), pur = els.filter(e => e === "pur").length, compte = {};
    for(const e of els) if(e !== "pur") compte[e] = (compte[e]||0) + 1;
    r.aoa = Math.max(pur, ...Object.values(compte).map(n => n + pur)) >= R.aoaCartes;
  }
  if(d.kind === "persona" && d.lien && !ctx.oubli) r.lien = (d.arcane && d.arcane === j.L.arcane) || ctx.joues.some(y => def(y).kind === "persona" && def(y).arcane === d.arcane);
  return r;
}
// Éléments joués ce tour (pour le suivi des combos et de l’All-Out Attack)
function elementsJoues(S){
  const compte = {}; let pur = 0;
  for(const x of (S.ctx ? S.ctx.joues : [])){ const e = def(x).el; if(!e) continue; if(e === "pur") pur++; else compte[e] = (compte[e]||0) + 1; }
  return {compte, pur};
}

/* ---------- Choix du joueur ---------- */
// Défausse imposée : uids de cartes de la main
function choisirDefausse(S, uids){
  const ch = choixEnCours(S), j = joueur(S);
  if(!ch || ch.type !== "defausse") return false;
  for(const u of uids.slice(0, ch.n)){ const k = j.main.findIndex(c => c.uid === u); if(k >= 0){ const c = j.main.splice(k, 1)[0]; j.defausse.push(c); log(S, `${j.nom} défausse ${nomCarte(c)}.`); } }
  S.attente.shift(); return true;
}
// Purge : une carte de la main ou de la défausse est retirée du deck (uid null = renoncer)
function choisirPurge(S, uid){
  const ch = choixEnCours(S), j = joueur(S);
  if(!ch || ch.type !== "purge") return false;
  if(uid){
    for(const pile of [j.main, j.defausse]){ const k = pile.findIndex(c => c.uid === uid); if(k >= 0){ const c = pile.splice(k, 1)[0]; j.stats.purges++; log(S, `${j.nom} retire ${nomCarte(c)} de son deck.`); break; } }
  }
  S.attente.shift(); return true;
}
// Vision : cartes du dessus de la pioche ; « dessous » = uids à placer sous la pioche

  ctx.achats.push({nom:def(c).nom, prix:p, id:c.id}); fx(S, {t:"achat", ou:"marche", i, nom:def(c).nom});

/* ---------- Fin du tour ---------- */
function finTour(S){

  if(ctx.affaibli){ const r = Math.min(deg, ctx.affaibli); deg -= r; if(r) ctx.journal.push({lib:"Affaibli", k:"deg", v:-r}); }
  const prot = opp.protections || {};
  if(deg > 0 && prot.bouclier){
    if(ctx.perce || ctx.vulnerable) log(S, "Le Bouclier est traversé.");
    else { const r = Math.min(deg, prot.bouclier); deg -= r; prot.bouclier -= r; ctx.journal.push({lib:`Bouclier de ${opp.L.nom}`, k:"deg", v:-r}); log(S, `Le Bouclier de ${opp.nom} absorbe ${r} dégât${r > 1 ? "s" : ""}.`); }
  }
  ctx.degInfliges = deg;
  if(ctx.combos >= 2) j.stats.multiCombos++;
  j.stats.maxTour = Math.max(j.stats.maxTour, deg);
  if(deg > 0){ opp.pv -= deg; j.stats.degats += deg; log(S, `${opp.nom} perd ${deg} PV.`); fx(S, {t:"degats", j:S.joueurs.indexOf(opp), v:deg}); }
  if(deg > 0 && prot.renvoi){ const r = Math.min(deg, prot.renvoi); prot.renvoi = 0; j.pv -= r; log(S, `Renvoi : ${j.nom} subit ${r} dégât${r > 1 ? "s" : ""}.`); fx(S, {t:"degats", j:S.courant, v:r}); }
  // Résumé de ce tour, montré à l’adversaire au début du sien

  if(opp.pv <= 0){ S.vainqueur = S.courant; log(S, `${j.nom} gagne le duel !`); fx(S, {t:"fin"}); return true; }

/* IA — joue un tour étape par étape (générateur), et répond aux choix */
const IA = (function(){

    if(ch.type === "defausse") M.choisirDefausse(S, j.main.slice().sort((a, b) => val(a) - val(b)).slice(0, ch.n).map(c => c.uid));
    else if(ch.type === "purge"){
      const cible = [...j.defausse, ...j.main].find(c => c.id === "yen") || [...j.defausse, ...j.main].find(c => c.id === "attaque");
      M.choisirPurge(S, cible ? cible.uid : null);

  let g = 0;
  while(j.main.length && g++ < 60 && S.courant === moi){
    j.main.sort((a, b) => ((M.def(b).effet.pioche||0) + (M.def(b).effet.vision ? 0.5 : 0)) - ((M.def(a).effet.pioche||0) + (M.def(a).effet.vision ? 0.5 : 0)));

  g = 0;

    const score = d => d.cout + (d.el && d.el === j.L.el ? 1.5 : 0) + (d.el === "pur" ? 0.5 : 0) + (d.kind === "persona" && d.arcane && d.arcane === j.L.arcane ? 1 : 0);
    const opts = S.marche.map((c, i) => ({i, d:M.def(c), p:M.prix(S, c)})).filter(o => o.p <= S.ctx.yen).sort((a, b) => score(b.d) - score(a.d));

    if(S.ctx.yen >= M.R.prixTresor && j.deck.length + j.defausse.length < 30){ M.acheter(S, "tresor"); yield "achat"; continue; }

return {tour, jouerTour, jouerPartie, resoudreChoix};
})();
