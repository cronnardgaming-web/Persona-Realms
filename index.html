<script>
/* ============================================================
   STOCKAGE — où sont gardées les données du joueur
   1. Supabase, si le jeu est configuré (window.P5_CONFIG) : la connexion est alors obligatoire ;
   2. l’espace personnel du compte, si le jeu tourne dans claude.ai ;
   3. ce navigateur (localStorage), seulement pour le développement, sans Supabase.
   Le reste du jeu ne connaît que ce module.
   ============================================================ */
const STOCKAGE = (function(){
const CFG = (typeof window !== "undefined" && window.P5_CONFIG) || {};
const CLE_LOCALE = "p5-deckbuilding-profil";
const etat = {mode:"local", supabaseDispo:false, utilisateur:null, erreur:null, pret:false};
let sb = null, claudeDb = null, claudeChemin = null, ecouteurs = [];

const lireLocal = () => { try { const t = localStorage.getItem(CLE_LOCALE); return t ? JSON.parse(t) : null; } catch(e){ return null; } };
const ecrireLocal = p => { try { localStorage.setItem(CLE_LOCALE, JSON.stringify(p)); } catch(e){ /* stockage plein ou indisponible */ } };
const avecDelai = (promesse, ms) => Promise.race([promesse, new Promise((_, rej) => setTimeout(() => rej(new Error("délai dépassé")), ms))]);

async function init(){
  // 1. Supabase
  if(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient){
    try {
      sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, detectSessionInUrl:true}});
      etat.supabaseDispo = true;
      const {data} = await avecDelai(sb.auth.getSession(), 10000);
      majSession(data && data.session);
      sb.auth.onAuthStateChange((evenement, session) => { const avant = etat.utilisateur && etat.utilisateur.id; majSession(session); if((etat.utilisateur && etat.utilisateur.id) !== avant) ecouteurs.forEach(f => f(evenement)); });
      return;
    } catch(e){ etat.erreur = "Le serveur ne répond pas. Vérifiez votre connexion, puis rechargez la page."; }
    return;
  }
  // 2. claude.ai
  if(window.claude && typeof window.claude.use === "function"){
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = user ? await user.id() : null;
      if(db && id){ claudeDb = db; claudeChemin = `data/users/${id}/profil`; etat.mode = "claude"; }
    } catch(e){ /* on reste en local */ }

}
function majSession(session){
  etat.utilisateur = session && session.user ? {id: session.user.id, email: session.user.email} : null;

}
// Avec Supabase, rien n’est accessible sans être connecté
const connexionRequise = () => etat.supabaseDispo && !etat.utilisateur;
// Appelé quand le joueur se connecte ou se déconnecte
const surChangementCompte = f => { ecouteurs.push(f); };

/* ---------- Profil ---------- */
async function chargerProfil(){
  if(etat.mode === "supabase"){
    if(!etat.utilisateur) return null;
    const {data, error} = await avecDelai(sb.from("profils").select("donnees").eq("user_id", etat.utilisateur.id).maybeSingle(), 10000);
    if(error) throw error;
    return data ? data.donnees : null;
  }
  if(etat.mode === "claude"){
    const snap = await avecDelai(claudeDb.doc(claudeChemin).get(), 10000);
    return snap.exists ? snap.data().profil : null;
  }
  return lireLocal();
}
let file = Promise.resolve();
function enregistrerProfil(p){
  const copie = JSON.parse(JSON.stringify(p));
  if(etat.mode === "local") ecrireLocal(p);
  if(etat.mode === "supabase"){
    if(!etat.utilisateur) return Promise.resolve();
    file = file.then(async () => {
      const {error} = await sb.from("profils").upsert({user_id: etat.utilisateur.id, donnees: copie, maj: new Date().toISOString()});
      if(error) throw error;
    });
  } else if(etat.mode === "claude"){
    file = file.then(() => claudeDb.doc(claudeChemin).set({profil: copie, maj: Date.now()}));
  } else return Promise.resolve();
  file = file.then(() => { etat.erreur = null; }).catch(() => { etat.erreur = "La dernière sauvegarde a échoué. Vérifiez votre connexion : votre progression sera enregistrée à la prochaine action."; });

}
const profilLocal = lireLocal;

// Chaque partie jouée par un joueur connecté est gardée (statistiques, équilibrage)
function enregistrerPartie(r){
  if(etat.mode !== "supabase") return;
  sb.from("parties").insert({user_id: etat.utilisateur.id, leader: r.leader, adversaire: r.adversaire, victoire: !!r.victoire, tours: r.tours || 0,
    details: {combos: r.combosElement || 0, degats: r.degats || 0, aoa: r.aoa || 0}}).then(() => {}, () => {});
}

/* ---------- Compte (Supabase) ---------- */
async function connexion(email){
  if(!sb) throw new Error("La connexion n’est pas disponible.");
  const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname}});
  if(error) throw error;
}
async function deconnexion(){ if(sb) await sb.auth.signOut(); }

/* ---------- Configuration de l’Admin (partagée) ---------- */
async function chargerConfiguration(cle){
  if(!sb) return null;
  const {data, error} = await sb.from("configuration").select("valeur").eq("cle", cle).maybeSingle();
  if(error) return null;
  return data ? data.valeur : null;
}
// Enregistre la configuration (réservé aux admins par les règles de la base)
async function enregistrerConfiguration(cle, valeur){
  if(etat.mode !== "supabase" || !etat.utilisateur) throw new Error("Connexion requise.");
  const {error} = await sb.from("configuration").upsert({cle, valeur, maj: new Date().toISOString(), maj_par: etat.utilisateur.id});
  if(error) throw error;
}
// Images : envoyées dans l’espace « images », lisibles par tous
async function envoyerImage(blob, dossier){
  if(etat.mode !== "supabase") throw new Error("Connexion requise.");
  const ext = blob.type === "image/webp" ? "webp" : "png";
  const chemin = `${dossier}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  // Chaque image a un nom unique : les navigateurs peuvent la garder en cache un an
  const {error} = await sb.storage.from("images").upload(chemin, blob, {contentType: blob.type, upsert: false, cacheControl: "31536000"});
  if(error) throw error;
  return sb.storage.from("images").getPublicUrl(chemin).data.publicUrl;
}
// Fichier quelconque (musiques) : on garde le fichier d’origine, avec son extension
async function envoyerFichier(fichier, dossier){
  if(etat.mode !== "supabase") throw new Error("Connexion requise.");
  const ext = (String(fichier.name || "").match(/\.([a-z0-9]{2,5})$/i) || [, "bin"])[1].toLowerCase();
  const chemin = `${dossier}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const {error} = await sb.storage.from("images").upload(chemin, fichier, {contentType: fichier.type || "application/octet-stream", upsert: false, cacheControl: "31536000"});
  if(error) throw error;
  return sb.storage.from("images").getPublicUrl(chemin).data.publicUrl;
}
async function supprimerImage(url){
  if(!sb || !url) return;
  const m = String(url).match(/\/object\/public\/images\/(.+)$/);
  if(m) await sb.storage.from("images").remove([decodeURIComponent(m[1])]).catch(() => {});
}
// Statistiques des parties réelles (admins)
async function statistiques(){
  if(etat.mode !== "supabase") return null;
  const [leaders, total] = await Promise.all([
    sb.from("stats_leaders").select("*"),
    sb.from("parties").select("id", {count:"exact", head:true})
  ]);
  if(leaders.error) throw leaders.error;
  return {leaders: leaders.data || [], total: total.count || 0};
}
async function estAdmin(){
  if(etat.mode !== "supabase" || !etat.utilisateur) return false;
  const {data, error} = await sb.rpc("est_admin");
  return !error && !!data;
}

return {init, etat, chargerProfil, enregistrerProfil, enregistrerPartie, profilLocal, connexion, deconnexion, surChangementCompte, connexionRequise, chargerConfiguration, enregistrerConfiguration, envoyerImage, envoyerFichier, supprimerImage, statistiques, estAdmin,
  get supabase(){ return sb; }};
})();

<script>

const PROFIL = (function(){

const FRAGMENTS = {get victoire(){ return REGLES.fragVictoire; }, get defaite(){ return REGLES.fragDefaite; }};
const seuil = r => REGLES.seuilBase + REGLES.seuilPente * r; // XP pour passer du rang r au rang r + 1
// Un palier de cartes tous les 3 rangs de Voleur fantôme : cartes de rang n au rang 3(n − 1) + 1
const PALIERS = [1,2,3,4,5,6,7,8,9].map(n => [3 * (n - 1) + 1, n]);

// Chaque Persona de la collection a un niveau (commun à ses exemplaires), qui part de son niveau dans P5R
const xpNiveau = niv => 30 + 3 * niv;                       // expérience pour passer au niveau suivant

    leaders:Object.keys(M.LEADERS), stats:{parties:0, victoires:0, defaites:0}, historique:[], creeLe:Date.now(),
    decks:[], deckActif:null, statsLeaders:{}, offres:[], compendium:{}, niveaux:{}, compteurs:{fusions:0, chaise:0, rachats:0}};

/* ---------- Règles de deck ---------- */

    if(k > maxCopies(id)) erreurs.push(`${M.C[id].nom} : ${maxCopies(id)} exemplaire${maxCopies(id) > 1 ? "s" : ""} au maximum${M.C[id].legendaire ? " (Légendaire)" : ""}.`);
  }

// Complète un deck jusqu’à 30 cartes : d’abord l’élément du Leader, puis les cartes les plus chères
function completerDeck(cartes, leader){

  panther:[["Gagner un duel avec {L}", "victoires", 1], ["Infliger 10 points de Brûlure", "brulure", 10], ["Gagner un duel en gardant 40 PV ou plus", "victoiresParfaites", 1], ["Déclencher 15 One More Feu", "combos", 15],

function quetes(leader){
  const L = M.LEADERS[leader], el = L.el ? M.ELEMENTS[L.el].nom : "", arc = arcaneNom(L.arcane);
  const txt = t => t.replace("{L}", L.nom).replace("{arc}", arc).replace("{el}", el);

const ARCANES_NOMS = {fou:"du Fou", magicien:"du Magicien", pretresse:"de la Prêtresse", imperatrice:"de l’Impératrice", empereur:"de l’Empereur", hierophante:"du Hiérophante",
  amants:"des Amants", chariot:"du Chariot", justice:"de la Justice", ermite:"de l’Ermite", fortune:"de la Fortune", force:"de la Force", pendu:"du Pendu", mort:"de la Mort",
  temperance:"de la Tempérance", diable:"du Diable", tour:"de la Tour", etoile:"de l’Étoile", lune:"de la Lune", soleil:"du Soleil", jugement:"du Jugement", foi:"de la Foi", conseiller:"du Conseiller", monde:"du Monde"};
const arcaneNom = a => ARCANES_NOMS[a] || "";
function confident(leader){
  const st = Object.assign({}, (p.statsLeaders || {})[leader] || {}), L = M.LEADERS[leader];
  st.niveauxArcane = niveauxGagnes(c => c.arcane === L.arcane);
  st.niveauxElement = niveauxGagnes(c => !L.el || c.el === L.el);

  Object.assign(st, {fusions:0, chaise:0, rachats:0}, p.compteurs || {});
  const l = quetes(leader).map(q => Object.assign({}, q, {progres: Math.min(q.but, st[q.cle] || 0)}));

  l.forEach((q, i) => { q.faite = i < rang; q.active = i === rang; });

}

/* ---------- Récompenses : choisir 1 carte parmi 3 ---------- */
function genererOffre(victoire){
  const max = rangCartesMax(p.rang), pool = cartesJouables().filter(id => !M.C[id].unique && M.C[id].rang <= max);
  const tirer = l => l[Math.floor(Math.random() * l.length)];

  while(offre.length < 3 && pool.length){
    const haut = victoire && offre.length === 0 ? pool.filter(id => M.C[id].rang === max) : pool;

}
function choisirRecompense(index, id){

  p.collection[id] = (p.collection[id] || 0) + 1;

}
// Complète un profil enregistré avec les champs ajoutés depuis
function completer(x){
  const n = nouveau();
  if(!x || typeof x !== "object") return n;
  const r = Object.assign(n, x);
  r.stats = Object.assign(nouveau().stats, x.stats || {});
  r.decks = Array.isArray(x.decks) ? x.decks : []; r.offres = Array.isArray(x.offres) ? x.offres : []; r.statsLeaders = x.statsLeaders || {};

function retirerReservees(){

  for(const id of Object.keys(p.collection)) if(M.C[id] && M.C[id].reservee){ delete p.collection[id]; change = true; }
  for(const d of p.decks){
    let retire = false;
    for(const id of Object.keys(d.cartes)) if(!M.C[id] || M.C[id].reservee){ delete d.cartes[id]; retire = true; }
    if(retire){ d.cartes = completerDeck(d.cartes, d.leader); change = true; }
  }
  return change;

function premierDeck(){ if(p && !p.decks.length){ const d = {id:"d0", nom:"Deck de départ", leader:p.leaderFavori || "joker", cartes:{}}; p.decks.push(d); d.cartes = completerDeck({}, d.leader); p.deckActif = d.id; } }
// Chargement : avec Supabase, le profil du compte connecté (aucun profil sans connexion)
async function init(cb){

async function charger(){

}
function enregistrer(){
  STOCKAGE.enregistrerProfil(p).then(() => { if(STOCKAGE.etat.erreur !== etat.erreur){ etat.erreur = STOCKAGE.etat.erreur; surChange(); } });
}

// Fin d’un duel : expérience, Fragments, montée de rang, historique
function finPartie(r){
  const gagne = !!r.victoire, xp = gagne ? XP.victoire : XP.defaite, fragments = gagne ? FRAGMENTS.victoire : FRAGMENTS.defaite;
  const avant = {rang:p.rang, cartes:rangCartesMax(p.rang)};
  p.xp += xp;
  while(p.rang < REGLES.rangMax && p.xp >= seuil(p.rang)){ p.xp -= seuil(p.rang); p.rang++; }
  if(p.rang >= REGLES.rangMax) p.xp = 0;
  p.fragments += fragments;

  const sl = p.statsLeaders[r.leader] = p.statsLeaders[r.leader] || {parties:0, victoires:0, combos:0, degats:0, aoa:0};
  const avantConf = confident(r.leader).rang;
  sl.parties++; if(gagne) sl.victoires++; sl.combos += r.combosElement || 0; sl.degats += r.degats || 0; sl.aoa += r.aoa || 0;
  const s = r.stats || {}, plus = (k, v) => { sl[k] = (sl[k] || 0) + (v || 0); };
  plus("liens", s.liens); plus("purges", s.purges); plus("pv", s.pvSoignes); plus("yen", s.yenGagnes); plus("achats", s.achats); plus("pioches", s.pioches);
  plus("visions", s.visions); plus("bouclier", s.bouclier); plus("defausse", s.peur); plus("multiCombos", s.multiCombos);
  for(const [k, v] of Object.entries(s.etats || {})) plus(k, v);
  sl.maxTour = Math.max(sl.maxTour || 0, s.maxTour || 0);
  if(gagne && (r.tours || 99) <= 8) plus("victoiresRapides", 1);
  if(gagne && r.pvRestants != null && r.pvRestants <= 10) plus("victoiresSerrees", 1);
  if(gagne && r.pvRestants != null && r.pvRestants >= 40) plus("victoiresParfaites", 1);
  const apresConf = confident(r.leader).rang;
  // Expérience des Personas : celles du deck de marché, et davantage pour celles achetées et jouées pendant la partie
  const montees = [];
  for(const id of new Set([...(r.personasDeck || []), ...(r.personasJouees || [])])){
    if(!p.collection[id] || !M.C[id] || M.C[id].kind !== "persona") continue;
    const xp = (r.personasDeck || []).includes(id) ? REGLES.xpPersonaDeck : 0;
    const bonus = (r.personasJouees || []).includes(id) ? REGLES.xpPersonaJouee : 0;
    const avant = niveauPersona(id), n = gagnerXP(id, xp + bonus);
    if(n) montees.push({id, avant, apres: niveauPersona(id)});

  const offre = {date:Date.now(), victoire:gagne, cartes:genererOffre(gagne)};
  p.offres.push(offre); p.offres = p.offres.slice(-5);
  p.historique.unshift({date:Date.now(), leader:r.leader, adversaire:r.adversaire, victoire:gagne, tours:r.tours, xp, fragments});
  p.historique = p.historique.slice(0, 20);
  enregistrer();
  STOCKAGE.enregistrerPartie(r);
  return {xp, fragments, rangAvant:avant.rang, rangApres:p.rang, nouvellesCartes: rangCartesMax(p.rang) > avant.cartes ? rangCartesMax(p.rang) : null,
    confident: apresConf > avantConf ? {leader:r.leader, rang:apresConf} : null, offre: p.offres.length - 1, montees};
}
function renommer(nom){ p.nomCode = String(nom || "").trim().slice(0, 24); enregistrer(); }
const tailleCollection = () => Object.values(p.collection).reduce((n, v) => n + v, 0);

return {init, etat, get profil(){ return p; }, seuil, get RANG_MAX(){ return REGLES.rangMax; }, REGLES, XP, FRAGMENTS, PALIERS, rangCartesMax, prochainPalier, finPartie, renommer, tailleCollection,
  get TAILLE_DECK(){ return REGLES.tailleDeck; }, get PLAFOND_CLASSE(){ return REGLES.plafondClasse; }, maxCopies, nbCartes, validerDeck, completerDeck, creerDeck, majDeck, supprimerDeck, choisirDeckActif, deckActif,
  quetes, confident, choisirRecompense, enregistrer, niveauPersona, niveauBase, gagnerXP, xpNiveau, niveauxGagnes};
})();

<script>
/* ============================================================
   CONFIGURATION DU JEU — réglages de l’Administration
   Une seule entrée « jeu » dans la table configuration de Supabase :
   {cartes:{modifiees, supprimees}, leaders, regles, progression}.
   Elle est appliquée au moteur au démarrage, pour tous les joueurs.
   ============================================================ */
const CONFIGJEU = (function(){
const M = MOTEUR;
const clone = o => JSON.parse(JSON.stringify(o));
const derivee = id => /^depart_.+_evo\d$|^visite_/.test(id);
const numeriques = o => Object.fromEntries(Object.entries(o).filter(([, v]) => typeof v === "number" || typeof v === "boolean"));
// L’état d’origine, tel que généré à partir des données de P5R
const ORIGINE = {
  cartes: clone(Object.fromEntries(Object.entries(M.C).filter(([id]) => !derivee(id)))),
  leaders: clone(M.LEADERS),
  regles: clone(numeriques(M.R)),
  progression: clone(PROFIL.REGLES)
};
const vide = () => ({cartes:{modifiees:{}, supprimees:[]}, leaders:{}, regles:{}, progression:{}, fusion:{}, elements:{}, musiques:{}});
function normaliser(cfg){
  const n = vide();
  if(!cfg || typeof cfg !== "object") return n;
  if(cfg.cartes){ n.cartes.modifiees = cfg.cartes.modifiees || {}; n.cartes.supprimees = cfg.cartes.supprimees || []; }
  n.leaders = cfg.leaders || {}; n.regles = cfg.regles || {}; n.progression = cfg.progression || {}; n.fusion = cfg.fusion || {}; n.elements = cfg.elements || {}; n.musiques = cfg.musiques || {};
  return n;
}
let actuelle = vide(), majLe = null, fusion = {}, elements = {}, musiques = {};
function appliquer(cfg){
  const c = normaliser(cfg);
  for(const id of Object.keys(M.C)) delete M.C[id];
  Object.assign(M.C, clone(ORIGINE.cartes));
  for(const [id, carte] of Object.entries(c.cartes.modifiees)) M.C[id] = clone(carte);
  for(const id of c.cartes.supprimees) delete M.C[id];
  for(const id of Object.keys(M.LEADERS)) delete M.LEADERS[id];
  Object.assign(M.LEADERS, clone(ORIGINE.leaders));
  for(const [id, L] of Object.entries(c.leaders)) M.LEADERS[id] = Object.assign(M.LEADERS[id] || {}, clone(L));
  M.genererDerivees();
  Object.assign(M.R, clone(ORIGINE.regles), numeriques(c.regles));
  Object.assign(PROFIL.REGLES, clone(ORIGINE.progression), numeriques(c.progression));
  fusion = clone(c.fusion);
  elements = clone(c.elements);
  musiques = clone(c.musiques);
  actuelle = c;
}
async function charger(){
  try { const v = await STOCKAGE.chargerConfiguration("jeu"); if(v){ appliquer(v); majLe = v.maj || null; } }
  catch(e){ /* on garde l’origine */ }
}
async function enregistrer(cfg){
  const c = normaliser(cfg); c.maj = new Date().toISOString();
  await STOCKAGE.enregistrerConfiguration("jeu", c);
  appliquer(c); majLe = c.maj;
}
return {get fusion(){ return fusion; }, get elements(){ return elements; }, get musiques(){ return musiques; }, ORIGINE, appliquer, charger, enregistrer, normaliser, vide, derivee, get actuelle(){ return clone(actuelle); }, get majLe(){ return majLe; }};
})();

<script>
/* ============================================================
   VELVET ROOM — fusion, compendium, chaise électrique
   La table de fusion par défaut est PROVISOIRE (ce n’est pas celle de P5R) :

const VELVET = (function(){
const M = MOTEUR;
const ARCANES = ["fou","magicien","pretresse","imperatrice","empereur","hierophante","amants","chariot","justice","ermite","fortune","force",
  "pendu","mort","temperance","diable","tour","etoile","lune","soleil","jugement","foi","conseiller","monde"];
const cle = (a, b) => [a, b].sort().join("|");
// Table par défaut : même Arcane → même Arcane ; sinon une règle arithmétique simple (provisoire)
function arcaneParDefaut(a, b){
  if(a === b) return a;
  const n = ARCANES.length - 1, ia = ARCANES.indexOf(a), ib = ARCANES.indexOf(b);
  if(ia < 0 || ib < 0) return null;
  return ARCANES[(ia + ib) % n];
}
const surcharges = () => (typeof CONFIGJEU !== "undefined" && CONFIGJEU.fusion) || {};
const arcaneFusion = (a, b) => surcharges()[cle(a, b)] || arcaneParDefaut(a, b);
const estPersona = id => { const c = M.C[id]; return c && c.kind === "persona" && !c.depart && !c.reservee && !c.visite; };
const niveauDe = c => c.niveau || (c.rang || 1) * 20 - 10;
// Les démons trésors de P5R ne naissent jamais d’une fusion
const TRESORS = new Set(["regent","queens_necklace","stone_of_scone","koh_i_noor","orlov","emperors_amulet","hope_diamond","crystal_skull"]);
const normal = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/'/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
const estTresor = id => TRESORS.has(id) || TRESORS.has(normal(M.C[id] && M.C[id].nom));

/* ---------- Fusion ---------- */
// Résultat : l’Arcane donnée par la table ; une Persona d’un niveau au moins égal à la moyenne des deux + 1,
// d’un rang au moins égal au plus fort des deux, sans dépasser le rang de cartes accessible au joueur
function resultatFusion(idA, idB){
  const P = PROFIL.profil, a = M.C[idA], b = M.C[idB];
  if(!estPersona(idA) || !estPersona(idB)) return {ok:false, raison:"Choisissez deux Personas."};
  if(idA === idB && (P.collection[idA] || 0) < 2) return {ok:false, raison:`Il faut deux exemplaires de ${a.nom} pour la fusionner avec elle-même.`};
  const arcane = arcaneFusion(a.arcane, b.arcane);
  if(!arcane) return {ok:false, raison:"Ces deux Arcanes ne peuvent pas être fusionnées."};
  const rangMax = PROFIL.rangCartesMax(P.rang), rangMin = Math.max(a.rang || 1, b.rang || 1);
  const cible = Math.floor((niveauDe(a) + niveauDe(b)) / 2) + 1;
  const candidates = Object.keys(M.C).filter(id => estPersona(id) && M.C[id].arcane === arcane && id !== idA && id !== idB && !M.C[id].unique && !estTresor(id))
    .sort((x, y) => niveauDe(M.C[x]) - niveauDe(M.C[y]));
  if(!candidates.length) return {ok:false, arcane, raison:`Aucune Persona de l’Arcane ${nomArcane(arcane)} ne peut naître de cette fusion.`};
  const permises = candidates.filter(id => M.C[id].rang <= rangMax && M.C[id].rang >= Math.min(rangMin, rangMax));
  if(!permises.length){
    const rangMini = Math.min(...candidates.map(id => M.C[id].rang));
    return {ok:false, arcane, raison:`Cette fusion donnerait une Persona ${nomArcane(arcane)} de rang ${rangMini} au moins : votre rang de Voleur fantôme ne le permet pas encore.`};
  }
  const id = permises.find(x => niveauDe(M.C[x]) >= cible) || permises[permises.length - 1];
  return {ok:true, id, arcane, cible};
}
const nomArcane = a => (typeof window !== "undefined" && window.UI && window.UI.ARCANES[a]) || a;

/* ---------- Garde-fous communs ---------- */
function verifierRetrait(ids){
  const P = PROFIL.profil, apres = PROFIL.tailleCollection() - ids.length;
  if(apres < PROFIL.TAILLE_DECK) return `Votre collection doit garder au moins ${PROFIL.TAILLE_DECK} cartes, pour pouvoir composer un deck.`;
  const besoin = {}; for(const id of ids) besoin[id] = (besoin[id] || 0) + 1;
  for(const [id, k] of Object.entries(besoin)) if((P.collection[id] || 0) < k) return `Vous ne possédez pas assez d’exemplaires de ${M.C[id].nom}.`;
  return null;
}
function retirer(ids){ const P = PROFIL.profil; for(const id of ids){ P.collection[id]--; if(P.collection[id] <= 0) delete P.collection[id]; } }
function ajouter(id){ const P = PROFIL.profil; P.collection[id] = (P.collection[id] || 0) + 1; inscrire(id); }
function inscrire(id){ const P = PROFIL.profil; if(estPersona(id)) P.compendium[id] = true; }
// Après un retrait, les decks qui utilisaient ces cartes sont réajustés puis complétés
function reconcilierDecks(){
  const P = PROFIL.profil, touches = [];
  for(const d of P.decks){
    let change = false;
    for(const [id, k] of Object.entries(d.cartes)){ const max = Math.min(P.collection[id] || 0, PROFIL.maxCopies(id)); if(k > max){ if(max) d.cartes[id] = max; else delete d.cartes[id]; change = true; } }
    if(change){ d.cartes = PROFIL.completerDeck(d.cartes, d.leader); touches.push(d.nom); }
  }
  return touches;
}
const compter = k => { const P = PROFIL.profil; P.compteurs = P.compteurs || {}; P.compteurs[k] = (P.compteurs[k] || 0) + 1; };
function fusionner(idA, idB){
  const r = resultatFusion(idA, idB); if(!r.ok) return r;
  const pb = verifierRetrait([idA, idB]); if(pb) return {ok:false, raison:pb};
  inscrire(idA); inscrire(idB);
  // La Persona obtenue reçoit de l’expérience selon les niveaux gagnés par ses deux parents
  const gagnes = Math.max(0, PROFIL.niveauPersona(idA) - PROFIL.niveauBase(idA)) + Math.max(0, PROFIL.niveauPersona(idB) - PROFIL.niveauBase(idB));
  retirer([idA, idB]); ajouter(r.id);
  if(gagnes) PROFIL.gagnerXP(r.id, gagnes * 10);
  compter("fusions");
  const decks = reconcilierDecks();
  PROFIL.enregistrer();
  return Object.assign(r, {decks});
}

/* ---------- Compendium ---------- */
const prixCompendium = id => (PROFIL.REGLES.prixCompendium || 100) * (M.C[id].rang || 1);
function acheter(id){
  const P = PROFIL.profil;
  if(!P.compendium[id] || !estPersona(id)) return {ok:false, raison:"Cette Persona n’est pas inscrite au compendium."};
  if(M.C[id].rang > PROFIL.rangCartesMax(P.rang)) return {ok:false, raison:"Votre rang de Voleur fantôme ne permet pas encore de la racheter."};
  const prix = prixCompendium(id);
  if(P.fragments < prix) return {ok:false, raison:`Il vous faut ${prix} Fragments de Velvet (vous en avez ${P.fragments}).`};
  P.fragments -= prix; ajouter(id); compter("rachats"); PROFIL.enregistrer();
  return {ok:true, prix};
}

/* ---------- Chaise électrique ---------- */
// Skills de la Persona : obtenables s’ils sont appris (niveau de la Persona) et d’un rang accessible au joueur.
// Les skills uniques (rang 9) ne s’obtiennent que de cette façon.
function skillsPersona(id){
  const P = PROFIL.profil, c = M.C[id]; if(!c) return [];
  const max = PROFIL.rangCartesMax(P.rang), niv = PROFIL.niveauPersona(id);
  return (c.skills || []).map(e => Array.isArray(e) ? e : [e, 1]).filter(([s]) => M.C[s] && M.C[s].kind === "skill" && !M.C[s].reservee)
    .map(([s, appris]) => ({id: s, appris, ok: appris <= niv && M.C[s].rang <= max, raison: appris > niv ? `appris au niveau ${appris}` : M.C[s].rang > max ? `cartes de rang ${M.C[s].rang} pas encore débloquées` : ""}));
}
const skillsChaise = id => skillsPersona(id).filter(s => s.ok).map(s => s.id);
function chaise(idPersona, idSkill){
  if(!estPersona(idPersona)) return {ok:false, raison:"Choisissez une Persona."};
  if(!skillsChaise(idPersona).includes(idSkill)) return {ok:false, raison:"Ce skill ne peut pas être obtenu de cette Persona."};
  const pb = verifierRetrait([idPersona]); if(pb) return {ok:false, raison:pb};
  inscrire(idPersona); retirer([idPersona]); ajouter(idSkill); compter("chaise");
  const decks = reconcilierDecks();
  PROFIL.enregistrer();
  return {ok:true, decks};
}

return {ARCANES, cle, arcaneFusion, arcaneParDefaut, resultatFusion, fusionner, prixCompendium, acheter, skillsChaise, skillsPersona, chaise, estPersona, inscrire};
})();

</script>
<script>
/* ============================================================
   MUSIQUE — un ou plusieurs morceaux par moment du jeu, choisis dans l’Administration
   Le navigateur n’autorise le son qu’après une première action du joueur (clic, touche).
   ============================================================ */
const MUSIQUE = (function(){
const CLE = "p5-musique";
const SLOTS = [
  ["accueil", "Accueil et menus", "Écrans de l’accueil, de la préparation du duel et des sections en construction."],
  ["duel", "Duel", "Pendant les duels."],
  ["tension", "Duel : moment décisif", "Quand un joueur passe sous 20 PV. Sans morceau, la musique du duel continue."],
  ["victoire", "Victoire", "Fin de duel gagné (jouée une fois)."],
  ["defaite", "Défaite", "Fin de duel perdu (jouée une fois)."],
  ["leblanc", "Café Leblanc", "Sans morceau, la musique de l’accueil est utilisée."],
  ["velvet", "Velvet Room", "Sans morceau, la musique de l’accueil est utilisée."]
];
const REPLI = {tension:"duel", duel:"accueil", leblanc:"accueil", velvet:"accueil"};
const UNE_FOIS = {victoire:true, defaite:true};
const reglages = {volume:0.5, muet:false};
try { Object.assign(reglages, JSON.parse(localStorage.getItem(CLE) || "{}")); } catch(e){}
const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(reglages)); } catch(e){} };
let audio = null, slotJoue = null, voulu = null, debloque = false, ctrl = null;

const pistes = slot => ((typeof CONFIGJEU !== "undefined" && CONFIGJEU.musiques && CONFIGJEU.musiques[slot]) || []).filter(p => p && p.url);
const aDesPistes = () => SLOTS.some(([s]) => pistes(s).length);
function resoudre(slot){ let s = slot; const vus = new Set(); while(s && !pistes(s).length && !vus.has(s)){ vus.add(s); s = REPLI[s]; } return s && pistes(s).length ? s : null; }
const cible = () => reglages.muet ? 0 : reglages.volume;
function fondu(a, vers, ms, fin){
  if(!a) return;
  const depart = a.volume, t0 = performance.now();
  const pas = t => { const k = Math.min(1, (t - t0) / ms); a.volume = Math.max(0, Math.min(1, depart + (vers - depart) * k)); if(k < 1) requestAnimationFrame(pas); else if(fin) fin(); };
  requestAnimationFrame(pas);
}
function lancer(s){
  const l = pistes(s), p = l[Math.floor(Math.random() * l.length)];
  const a = new Audio(p.url);
  a.loop = !UNE_FOIS[s] && l.length === 1;
  a.volume = 0;
  // Plusieurs morceaux : on enchaîne au hasard
  a.addEventListener("ended", () => { if(audio === a && !UNE_FOIS[s]) lancer(s); });
  a.play().then(() => fondu(a, cible(), 600)).catch(() => {});
  if(audio && audio !== a){ const ancien = audio; fondu(ancien, 0, 500, () => ancien.pause()); }
  audio = a;
}
// Demande la musique d’un moment du jeu (appelé à chaque affichage)
function jouer(slot){
  voulu = slot;
  majControle();
  if(!debloque) return;
  const s = resoudre(slot);
  if(s === slotJoue && (audio || !s)) return;
  slotJoue = s;
  if(!s){ if(audio){ const a = audio; audio = null; fondu(a, 0, 500, () => a.pause()); } return; }
  lancer(s);
}
function debloquer(){ if(debloque) return; debloque = true; if(voulu) jouer(voulu); }
["pointerdown", "keydown"].forEach(t => document.addEventListener(t, debloquer, {capture:true}));

/* ---------- Réglage du volume (en haut à droite, seulement s’il y a des morceaux) ---------- */
function majControle(){
  if(!ctrl){
    ctrl = document.createElement("div"); ctrl.className = "musique-ctrl";
    ctrl.innerHTML = `<button type="button" class="musique-bouton" aria-label="Couper ou remettre la musique"></button>
      <input type="range" min="0" max="100" step="5" aria-label="Volume de la musique">`;
    document.body.appendChild(ctrl);
    ctrl.querySelector("button").addEventListener("click", () => { reglages.muet = !reglages.muet; sauver(); if(audio) audio.volume = cible(); majControle(); });
    ctrl.querySelector("input").addEventListener("input", e => { reglages.volume = +e.target.value / 100; reglages.muet = false; sauver(); if(audio) audio.volume = cible(); majControle(); });
  }
  ctrl.hidden = !aDesPistes();
  ctrl.querySelector("button").textContent = reglages.muet || !reglages.volume ? "♪ Coupé" : "♪";
  ctrl.querySelector("button").setAttribute("aria-pressed", String(reglages.muet));
  ctrl.querySelector("input").value = Math.round(reglages.volume * 100);
}
return {SLOTS, jouer, aDesPistes, pistes, reglages};
})();

</script>
<script>
/* ============================================================
   ADMINISTRATION — réservée aux comptes de la table admins
   On travaille sur un brouillon ; « Publier » l’enregistre dans Supabase
   et l’applique à tous les joueurs.
   ============================================================ */
const ADMIN = (function(){
const M = MOTEUR, U = () => window.UI;
const esc = s => U().esc(s);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const ORI = CONFIGJEU.ORIGINE;
const EFFETS = [["deg","Dégâts"],["yen","Yen"],["pv","PV"],["pioche","Pioche"],["defausse","Peur (défausse adverse)"],["purge","Purge"],["vision","Vision"]];
// Effets avancés, regroupés (dépliés seulement si la carte en utilise)
const EFFETS_AVANCES = [
  ["Altérations (subies par l’adversaire à son prochain tour)", [["brulure","Brûlure (PV perdus)"],["gel","Gel"],["choc","Choc"],["confusion","Confusion"],["oubli","Oubli"],["vertige","Vertige (¥ en plus)"],["affaiblir","Affaibli (dégâts en moins)"],["vulnerable","Défense baissée"]]],
  ["Protections et bonus", [["bouclier","Bouclier"],["renvoi","Renvoi"],["attaque","Attaque +"],["double","Double effet"],["dissiper","Dissipe"],["purifier","Purifie"],["prep","Préparation"],["remplacer","Renouvelle le marché"],["technique","Technique (+ dégâts)"]]],
  ["Effets d’Arcane", [["copie","Copie (Fou)"],["skillsPlus","+ dégâts par skill"],["hasard","Hasard"],["parDefausse","+ dégâts / 4 cartes en défausse"],["perdrePV","PV perdus (vous)"],["defausseSoi","Défausse (vous)"],["parLien","+ dégâts par Lien"],["remise","Remise au marché"]]]
];
const CONDS = [["","Aucune"],["deuxPersonas","Exactement 2 Personas jouées"],["premiere","Première carte jouée du tour"],["moinsPV","Moins de PV que l’adversaire"],["seulePersona","Seule Persona du tour"],["pvBas","20 PV ou moins"]];
const BLOCS = [["effet","Effet"],["combo","One More (combo d’élément)"],["lien","Lien d’Arcane (Personas)"],["sacrifice","Sacrifice"]];
const TYPES = {persona:"Persona", skill:"Skill", objet:"Objet"};
const REGLES_COMBAT = [
  ["pv","PV de départ des joueurs"],["tailleMarche","Cartes visibles au marché"],["mainPremier","Cartes en main au départ (premier joueur)"],
  ["mainDepart","Cartes en main au départ (second joueur)"],["pioche","Cartes piochées en fin de tour"],["prixTresor","Prix du Trésor (¥)"],
  ["aoaCartes","All-Out Attack : cartes du même élément"],["aoaDegats","All-Out Attack : dégâts"],["faiblesse","Faiblesse du Leader : dégâts par carte"],
  ["seuilVisite","Carte de visite : PV adverses en dessous desquels elle arrive"],["defausseMax","Défausse imposée : maximum par tour"]];
const REGLES_PROG = [
  ["xpVictoire","Expérience pour une victoire"],["xpDefaite","Expérience pour une défaite"],["fragVictoire","Fragments pour une victoire"],["fragDefaite","Fragments pour une défaite"],
  ["seuilBase","Rang suivant : expérience de base"],["seuilPente","Rang suivant : expérience en plus par rang"],["rangMax","Rang maximum"],
  ["tailleDeck","Cartes dans un deck de marché"],["plafondClasse","Mode Classé : somme des rangs maximum"],["collectionInitiale","Cartes de la collection de départ"],
  ["prixCompendium","Compendium : Fragments par rang de la Persona"]];

const A = {catGroupe:"kind", catOuverts:{}, arcFusion:"fou", envoyees:[], onglet:"cartes", sel:null, selLeader:"joker", q:"", fType:"", fEl:"", fModif:"", b:null, sale:false, msg:null, erreur:null, enCours:false, stats:null, confirmer:null, envoiImage:false};

function ouvrir(){ A.b = CONFIGJEU.actuelle; A.sale = false; A.msg = null; A.erreur = null; A.confirmer = null; }
const peutQuitter = () => !A.sale;

/* ---------- Lecture du brouillon ---------- */
const supprimee = id => A.b.cartes.supprimees.includes(id);
function carte(id){ if(supprimee(id)) return null; return A.b.cartes.modifiees[id] || ORI.cartes[id] || null; }
const estModifiee = id => !!A.b.cartes.modifiees[id] && !!ORI.cartes[id];
const estNouvelle = id => !!A.b.cartes.modifiees[id] && !ORI.cartes[id];
function idsCartes(){
  const ids = new Set([...Object.keys(ORI.cartes), ...Object.keys(A.b.cartes.modifiees)]);
  // Les cartes de départ « objets » (Yen, Liasse, Attaque) sont modifiables ; les Personas de départ se règlent via leur carte
  return [...ids].filter(id => { const c = ORI.cartes[id] || A.b.cartes.modifiees[id]; return c && (!c.depart || c.kind === "objet"); });
}
// Avant de modifier une carte d’origine, on en fait une copie dans le brouillon
function carteEditable(id){ if(!A.b.cartes.modifiees[id]) A.b.cartes.modifiees[id] = clone(ORI.cartes[id]); A.sale = true; return A.b.cartes.modifiees[id]; }
const leader = id => Object.assign(clone(ORI.leaders[id]), A.b.leaders[id] || {});
function leaderEditable(id){ if(!A.b.leaders[id]) A.b.leaders[id] = {}; A.sale = true; return A.b.leaders[id]; }

/* ---------- Petits champs ---------- */
const opt = (v, l, cur) => `<option value="${esc(v)}" ${String(cur ?? "") === String(v) ? "selected" : ""}>${esc(l)}</option>`;
const champ = (label, html, aide) => `<label class="a-champ"><span class="a-lbl">${esc(label)}</span>${html}${aide ? `<span class="a-aide">${esc(aide)}</span>` : ""}</label>`;
const caseA = (chemin, label, val, aide) => `<label class="a-case"><input type="checkbox" data-a-f="${chemin}" data-t="b" ${val ? "checked" : ""}> <span>${esc(label)}</span>${aide ? ` <small class="a-aide">${esc(aide)}</small>` : ""}</label>`;
const elementsOpts = (cur, aucun) => (aucun ? opt("", aucun, cur) : "") + U().ORDRE_EL.map(e => opt(e, M.ELEMENTS[e].nom, cur)).join("");
function blocEffets(base, e, titre, aide, avecCondition){
  e = e || {};
  const nombre = ([k, l]) => champ(l, `<input type="number" min="0" max="99" step="1" data-a-f="${base}.${k}" data-t="n" value="${e[k] || 0}">`);
  return `<fieldset class="a-bloc"><legend>${esc(titre)}</legend>${aide ? `<p class="a-aide">${esc(aide)}</p>` : ""}
    <div class="a-effets">${EFFETS.map(nombre).join("")}</div>
    ${EFFETS_AVANCES.map(([g, l]) => `<details class="a-avance" ${l.some(([k]) => e[k]) ? "open" : ""}><summary>${esc(g)}</summary><div class="a-effets">${l.map(nombre).join("")}</div></details>`).join("")}
    ${avecCondition ? champ("Condition", `<select data-a-f="${base}.cond">${CONDS.map(([k, l]) => opt(k, l, e.cond || "")).join("")}</select>`, "Le Lien ne se déclenche que si cette condition est remplie.") : ""}
    ${caseA(`${base}.parCombo`, "+1 dégât par combo déclenché ce tour", e.parCombo)}</fieldset>`;
}
// Jauge : valeur de la carte comparée au budget de son rang
function jaugeBudget(c){
  const v = VALEURS.valeurCarte(c), b = VALEURS.budget(c.rang), r = v / b;
  const etat = r > 1.15 ? "trop" : r > 1.03 ? "limite" : r < 0.75 ? "faible" : "ok";
  const txt = {trop:"au-dessus du budget", limite:"légèrement au-dessus", faible:"bien en dessous", ok:"dans le budget"}[etat];
  return `<div class="a-jauge ${etat}"><div class="a-jauge-barre"><i style="width:${Math.min(100, Math.round(100 * r / 1.3))}%"></i><span class="a-jauge-repere" style="left:${Math.round(100 / 1.3)}%"></span></div>
    <span><b>Valeur ${String(v).replace(".", ",")}</b> pour un budget de ${String(b).replace(".", ",")} (rang ${c.rang}) : ${txt}.</span></div>`;
}

/* ---------- Onglet Cartes ---------- */
function listeCartes(){
  const q = A.q.trim().toLowerCase();
  const ids = idsCartes().filter(id => {
    const c = carte(id) || ORI.cartes[id];
    if(A.fType && c.kind !== A.fType) return false;
    if(A.fEl && (c.el || "") !== (A.fEl === "aucun" ? "" : A.fEl)) return false;
    if(A.fModif === "modifiees" && !estModifiee(id)) return false;
    if(A.fModif === "nouvelles" && !estNouvelle(id)) return false;
    if(A.fModif === "supprimees" && !supprimee(id)) return false;
    return !q || c.nom.toLowerCase().includes(q) || id.includes(q);
  }).sort((a, b) => (carte(a) || ORI.cartes[a]).nom.localeCompare((carte(b) || ORI.cartes[b]).nom));
  return ids.map(id => {
    const c = carte(id) || ORI.cartes[id];
    const tag = supprimee(id) ? `<span class="a-tag sup">supprimée</span>` : c.reservee ? `<span class="a-tag">Leader</span>` : estNouvelle(id) ? `<span class="a-tag nou">nouvelle</span>` : estModifiee(id) ? `<span class="a-tag mod">modifiée</span>` : "";
    return `<li><button type="button" class="${A.sel === id ? "actif" : ""}" data-act="a-sel" data-id="${esc(id)}">
      <span class="chip ${c.el ? "el-" + c.el : c.kind === "objet" ? "el-objet" : "el-aucun"}">${c.el ? esc(M.ELEMENTS[c.el].court) : c.kind === "objet" ? "Obj" : "—"}</span>
      <span class="a-li-nom">${esc(c.nom)}</span><small>${TYPES[c.kind] || c.kind} · ${c.rang ? "★".repeat(c.rang) : "départ"} · ${c.cout || 0} ¥</small>${tag}</button></li>`;
  }).join("") || `<li class="a-vide">Aucune carte.</li>`;
}
function editeurCarte(id){
  if(supprimee(id)) return `<div class="a-editeur"><h2>${esc((ORI.cartes[id] || {}).nom || id)}</h2><p>Cette carte est supprimée : elle n’apparaîtra plus dans le jeu après publication.</p>
    <button type="button" class="btn" data-act="a-restaurer" data-id="${esc(id)}">Restaurer la carte</button></div>`;
  const c = carte(id), base = `cartes.${id}`;
  // Carte de départ (Yen, Liasse, Attaque) : gratuite et présente dans tous les decks, on règle son nom, son image et son effet
  if(c.depart) return `<div class="a-editeur">
    <div class="a-tete-ed"><h2>${esc(c.nom)} <small>${esc(id)} · carte de départ</small></h2>
      ${estModifiee(id) ? `<button type="button" class="btn petit" data-act="a-origine" data-id="${esc(id)}">Revenir à l’origine</button>` : ""}</div>
    <p class="a-aide">Carte du deck de départ de tous les joueurs : elle est gratuite et n’a ni rang ni élément.</p>
    <div class="a-grille"><div class="a-col">
      ${zoneImage(`${base}.image`, c.image, null)}
      <div class="a-ligne">${champ("Nom", `<input type="text" data-a-f="${base}.nom" value="${esc(c.nom)}">`)}</div>
      ${blocEffets(`${base}.effet`, c.effet, "Effet", "Ce que la carte donne quand on la joue.")}
    </div>
    <aside class="a-apercu"><p class="a-aide">Aperçu</p><div class="a-apercu-carte">${U().carteJeu({id, uid:"apercu"}, {def:c})}</div>

      ${url ? `<button type="button" class="btn petit" data-act="a-retirer-image" data-id="${chemin}">Retirer</button>` : ""}

const imageDe = dt => { if(!dt) return null; for(const it of Array.from(dt.items || [])) if(it.kind === "file" && it.type.startsWith("image/")) return it.getAsFile(); for(const f of Array.from(dt.files || [])) if(f.type.startsWith("image/")) return f; return null; };
// Redimensionne (600 px au plus) en gardant la transparence, puis envoie dans Supabase
async function traiterImage(fichier, chemin){
  if(!fichier || !fichier.type.startsWith("image/")){ A.erreur = "Ce fichier n’est pas une image."; U().render(); return; }
  A.envoiImage = chemin; A.erreur = null; U().render();
  try {
    const url = URL.createObjectURL(fichier);
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const [table] = chemin.split(".");
    const k = Math.min(1, (table === "elements" ? 256 : 600) / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    let blob = await new Promise(r => cv.toBlob(r, "image/webp", 0.9));
    if(!blob || blob.type !== "image/webp") blob = await new Promise(r => cv.toBlob(r, "image/png"));
    const lien = await STOCKAGE.envoyerImage(blob, table === "leaders" ? "leaders" : table === "elements" ? "elements" : "cartes");
    ecrire(chemin, lien);
    A.envoyees.push(lien);
    A.msg = "Image envoyée. Pensez à publier.";
  } catch(e){ A.erreur = "L’envoi de l’image a échoué. Vérifiez votre connexion, puis réessayez."; }
  A.envoiImage = false; U().render();
}

const GROUPES = {kind:"Type", el:"Élément", rang:"Rang", arcane:"Arcane", cout:"Coût"};

  if(g === "kind") return TYPES[v] ? TYPES[v] + "s" : v;
  if(g === "el") return v ? M.ELEMENTS[v].nom : "Sans élément";
  if(g === "rang") return v ? "★".repeat(v) + ` (rang ${v})` : "Sans rang";
  if(g === "arcane") return U().ARCANES[v] || "Sans Arcane";
  if(g === "cout") return `${v} ¥`;

function ongletCatalogue(){

      <p>${nb} carte${nb > 1 ? "s" : ""} modifiée${nb > 1 ? "s" : ""} ou ajoutée${nb > 1 ? "s" : ""}, ${sup} supprimée${sup > 1 ? "s" : ""}, ${Object.keys(A.b.leaders).length} Leader(s) modifié(s), ${Object.keys(A.b.regles).length + Object.keys(A.b.progression).length} règle(s) modifiée(s), ${Object.keys(A.b.fusion || {}).length} paire(s) de fusion corrigée(s), ${Object.values(A.b.elements || {}).filter(x => x && x.icone).length} icône(s) d’élément, ${Object.values(A.b.musiques || {}).reduce((n, l) => n + (l || []).length, 0)} morceau(x) de musique.
      ${CONFIGJEU.majLe ? `Dernière publication : ${new Date(CONFIGJEU.majLe).toLocaleString("fr-FR", {dateStyle:"long", timeStyle:"short"})}.` : "Rien n’a encore été publié."}</p></fieldset>
    <fieldset class="a-bloc"><legend>Exporter</legend><p>Télécharge toute la configuration (le brouillon en cours) dans un fichier JSON, pour la garder ou la transférer.</p>
      <button type="button" class="btn" data-act="a-exporter">Exporter la configuration</button></fieldset>
    <fieldset class="a-bloc"><legend>Importer</legend><p>Remplace le brouillon par le contenu d’un fichier exporté. Rien n’est appliqué avant « Publier ».</p>
      <label class="btn">Choisir un fichier JSON<input type="file" accept="application/json,.json" data-a-import hidden></label></fieldset>
    <fieldset class="a-bloc"><legend>Revenir aux réglages d’origine</legend><p>Annule toutes les modifications : cartes, Leaders et règles reviennent à leur version générée à partir de P5R. Une fois publié, les images qui ne servent plus sont supprimées du stockage.</p>
      ${A.confirmer === "tout" ? `<button type="button" class="btn danger" data-act="a-reinit-ok">Oui, tout remettre à l’origine</button> <button type="button" class="btn" data-act="a-annuler-sup">Annuler</button>`
        : `<button type="button" class="btn" data-act="a-reinit">Revenir à l’origine</button>`}</fieldset>`;
}

/* ---------- Page ---------- */
const ONGLETS = [["catalogue","Catalogue"],["cartes","Cartes"],["leaders","Leaders"],["elements","Éléments"],["musiques","Musiques"],["regles","Règles"],["fusion","Table de fusion"],["stats","Statistiques"],["sauvegarde","Sauvegarde"]];
function html(){
  if(!A.b) ouvrir();
  const corps = A.onglet === "leaders" ? ongletLeaders() : A.onglet === "regles" ? ongletRegles() : A.onglet === "fusion" ? ongletFusion() : A.onglet === "elements" ? ongletElements() : A.onglet === "musiques" ? ongletMusiques() : A.onglet === "catalogue" ? ongletCatalogue() : A.onglet === "stats" ? ongletStats() : A.onglet === "sauvegarde" ? ongletSauvegarde() : ongletCartes();
  return `<div class="admin">
    <div class="barre-nav"><button type="button" class="lien-btn" data-act="a-accueil">← Accueil</button></div>
    <div class="a-entete"><h1>Administration</h1><span class="discret">Vos modifications s’appliquent à tous les joueurs une fois publiées.</span></div>
    <nav class="onglets" aria-label="Sections de l’Administration">${ONGLETS.map(([k, l]) => `<button type="button" data-act="a-onglet" data-id="${k}" aria-current="${A.onglet === k ? "page" : "false"}">${l}</button>`).join("")}</nav>
    ${A.erreur ? `<div class="erreur" role="alert">${esc(A.erreur)}</div>` : A.msg ? `<div class="a-msg" role="status">${esc(A.msg)}</div>` : ""}
    ${corps}
    <div class="a-barre" ${A.sale ? "" : "hidden"}><span>Modifications non publiées.</span>
      <button type="button" class="btn" data-act="a-annuler" ${A.enCours ? "disabled" : ""}>Annuler</button>
      <button type="button" class="btn fort" data-act="a-publier" ${A.enCours ? "disabled" : ""}>${A.enCours ? "Publication…" : "Publier"}</button></div>
  </div>`;
}

/* ---------- Ménage des images ---------- */
// Adresses des images utilisées par une configuration
const urlsDe = cfg => new Set((JSON.stringify(cfg || {}).match(/https?:\/\/[^"\s]+\/object\/public\/images\/[^"\s]+/g)) || []);
// Supprime du stockage les images qui ne sont plus utilisées par la configuration publiée
async function nettoyerImages(candidates){
  const utilisees = urlsDe(CONFIGJEU.actuelle);
  const aSupprimer = [...new Set(candidates)].filter(u => !utilisees.has(u));
  for(const u of aSupprimer) await STOCKAGE.supprimerImage(u);
  return aSupprimer.length;
}

/* ---------- Écriture dans le brouillon ---------- */
function ecrire(chemin, v){
  const ks = chemin.split("."), table = ks.shift();
  let o;
  if(table === "cartes") o = carteEditable(ks.shift());
  else if(table === "leaders"){ const id = ks.shift(); o = leaderEditable(id); if(ks[0] === "capa" && !o.capa) o.capa = clone(leader(id).capa || {}); if(ks[0] === "evos" && !o.evos) o.evos = clone(leader(id).evos || ["", ""]); }
  else { o = A.b[table]; A.sale = true; }
  const dernier = ks.pop();
  for(const k of ks){ if(o[k] == null || typeof o[k] !== "object") o[k] = {}; o = o[k]; }
  if(v === undefined || v === "" || (v === 0 && table !== "regles" && table !== "progression" && dernier !== "cout" && dernier !== "rang") || v === false) delete o[dernier]; else o[dernier] = v;
  // Un bloc d’effets vide disparaît (pas de combo, pas de sacrifice…)
  if(table === "cartes" && ks.length === 1 && ["combo","lien","sacrifice"].includes(ks[0])){
    const c = A.b.cartes.modifiees[chemin.split(".")[1]];
    if(c[ks[0]] && !Object.keys(c[ks[0]]).length) c[ks[0]] = ks[0] === "combo" ? null : undefined;
  }
  A.sale = true;
}
// Mise à jour de l’aperçu sans redessiner la page (on garde le focus)
function majApercu(){
  if(A.onglet !== "cartes" || !A.sel) return;
  const c = carte(A.sel); if(!c) return;
  const ap = document.querySelector(".a-apercu-carte"), lo = document.querySelector(".a-apercu-loupe");
  if(ap) ap.innerHTML = U().carteJeu({id:A.sel, uid:"apercu"}, {def:c});
  if(lo) lo.innerHTML = U().loupeHTML(A.sel, c);
  const jg = document.querySelector(".a-jauge-place"); if(jg) jg.innerHTML = jaugeBudget(c);
  const barre = document.querySelector(".a-barre"); if(barre) barre.hidden = false;
}
function saisie(t, evt){
  if(t.dataset.aFiltre === "catGroupe"){ if(evt === "change"){ A.catGroupe = t.value; U().render(); } return; }
  if(t.dataset.aFiltre === "arcFusion"){ if(evt === "change"){ A.arcFusion = t.value; U().render(); } return; }
  if(t.dataset.aFusion && evt === "change"){
    const [x, y] = t.dataset.aFusion.split("|"); A.b.fusion = A.b.fusion || {};
    if(t.value === VELVET.arcaneParDefaut(x, y)) delete A.b.fusion[t.dataset.aFusion]; else A.b.fusion[t.dataset.aFusion] = t.value;
    A.sale = true; U().render(); return;
  }
  if(t.dataset.aFiltre){ A[t.dataset.aFiltre] = t.value; if(evt === "input" || t.tagName === "SELECT") rafraichirListe(); return; }
  if(t.dataset.aImage && evt === "change"){ traiterImage(t.files[0], t.dataset.aImage); return; }
  if(t.dataset.aMusique && evt === "change"){ envoyerMusique(t.files[0], t.dataset.aMusique); return; }
  if(t.hasAttribute("data-a-import") && evt === "change"){ importer(t.files[0]); return; }
  const chemin = t.dataset.aF; if(!chemin) return;
  const type = t.dataset.t;
  if(evt === "input" && (t.tagName === "SELECT" || type === "b")) return;
  let v = type === "n" ? (t.value === "" ? 0 : Math.max(0, Math.round(+t.value))) : type === "b" ? t.checked : t.value;
  if(type === "el") v = t.value || null;
  ecrire(chemin, v);
  if(/^cartes\.[^.]+\.rang$/.test(chemin)) ecrire(chemin.replace(/rang$/, "cout"), v);
  if(evt === "input") majApercu();
  else if(t.tagName === "SELECT" || type === "b") U().render();
}
function rafraichirListe(){ const ul = document.querySelector(".a-items"); if(ul && A.onglet === "cartes") ul.innerHTML = listeCartes(); }

function nouvelId(base){ let id = base, n = 2; while(ORI.cartes[id] || A.b.cartes.modifiees[id]) id = `${base}_${n++}`; return id; }
function exporter(){
  const blob = new Blob([JSON.stringify(A.b, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "persona5-configuration.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importer(f){
  if(!f) return;
  try { const v = JSON.parse(await f.text()); if(!v || typeof v !== "object" || !v.cartes) throw 0; A.b = CONFIGJEU.normaliser(v); A.sale = true; A.msg = "Configuration importée. Vérifiez-la, puis publiez."; A.erreur = null; }
  catch(e){ A.erreur = "Ce fichier n’est pas une configuration valide."; }
  U().render();
}

async function clic(act, id){
  A.msg = null; A.erreur = null;
  switch(act){
    case "a-accueil":
      if(A.sale && !confirm("Vos modifications ne sont pas publiées. Quitter quand même ?")) return;
      nettoyerImages(A.envoyees); A.envoyees = [];
      A.b = null; U().aller("accueil"); return;
    case "a-onglet": A.onglet = id; A.confirmer = null; break;
    case "a-sel": A.sel = id; A.confirmer = null; break;
    case "a-sel-leader": A.selLeader = id; break;
    case "a-nouvelle": { const nid = nouvelId("carte_perso"); A.b.cartes.modifiees[nid] = {nom:"Nouvelle carte", kind:"skill", el:"feu", rang:1, cout:2, effet:{deg:3}, combo:{deg:2}}; A.sel = nid; A.sale = true; A.fModif = ""; A.q = ""; break; }
    case "a-dupliquer": { const c = clone(carte(id)); c.nom += " (copie)"; const nid = nouvelId(id + "_copie"); A.b.cartes.modifiees[nid] = c; A.sel = nid; A.sale = true; break; }
    case "a-origine": delete A.b.cartes.modifiees[id]; A.sale = true; break;
    case "a-demander-sup": A.confirmer = id; break;
    case "a-annuler-sup": A.confirmer = null; break;
    case "a-supprimer":
      if(ORI.cartes[id]){ if(!A.b.cartes.supprimees.includes(id)) A.b.cartes.supprimees.push(id); delete A.b.cartes.modifiees[id]; }
      else { delete A.b.cartes.modifiees[id]; A.sel = null; }
      A.confirmer = null; A.sale = true; break;
    case "a-restaurer": A.b.cartes.supprimees = A.b.cartes.supprimees.filter(x => x !== id); A.sale = true; break;
    case "a-retirer-image": ecrire(id, undefined); break;
    case "a-leader-origine": delete A.b.leaders[id]; A.sale = true; break;
    case "a-fusion-defaut": A.b.fusion = {}; A.sale = true; break;
    case "a-musique-retirer": { const [slot, i] = id.split("|"); (A.b.musiques[slot] || []).splice(+i, 1); A.sale = true; break; }
    case "a-cat-ouvrir": A.sel = id; A.onglet = "cartes"; A.q = ""; A.fType = ""; A.fEl = ""; A.fModif = ""; U().render(); window.scrollTo(0, 0); return;
    case "a-cat-tout": document.querySelectorAll(".a-groupe").forEach(x => { A.catOuverts[x.dataset.cat] = id === "1"; }); break;
    case "a-stats":
      A.enCours = true; U().render();
      try { A.stats = await STOCKAGE.statistiques(); } catch(e){ A.erreur = "Les statistiques n’ont pas pu être chargées."; }
      A.enCours = false; break;
    case "a-exporter": exporter(); return;
    case "a-reinit": A.confirmer = "tout"; break;
    case "a-reinit-ok": A.b = CONFIGJEU.vide(); A.confirmer = null; A.sale = true; A.msg = "Réglages d’origine chargés. Publiez pour les appliquer."; break;
    case "a-annuler": nettoyerImages(A.envoyees); A.envoyees = []; ouvrir(); A.msg = "Modifications annulées."; break;
    case "a-publier":
      A.enCours = true; U().render();
      try {
        const avant = [...urlsDe(CONFIGJEU.actuelle), ...A.envoyees];
        await CONFIGJEU.enregistrer(A.b); A.b = CONFIGJEU.actuelle; A.sale = false;
        const n = await nettoyerImages(avant); A.envoyees = [];
        A.msg = `Publié : tous les joueurs reçoivent ces réglages à leur prochaine visite.${n ? ` ${n} image${n > 1 ? "s" : ""} inutilisée${n > 1 ? "s" : ""} supprimée${n > 1 ? "s" : ""} du stockage.` : ""}`;
      }
      catch(e){ A.erreur = "La publication a échoué. Vérifiez que votre compte est bien administrateur, et votre connexion."; }
      A.enCours = false; break;
    default: return;
  }
  U().render();
}

// Images : coller (Ctrl+V) ou glisser-déposer sur une zone d’image
document.addEventListener("paste", e => {
  if(!window.UI || U().ecran !== "admin") return;
  const zone = document.querySelector("[data-depot].cible") || document.querySelector("[data-depot]"), f = imageDe(e.clipboardData);
  if(zone && f){ e.preventDefault(); traiterImage(f, zone.dataset.depot); }
});
["dragover","dragleave","drop"].forEach(t => document.addEventListener(t, e => {
  if(!window.UI || U().ecran !== "admin") return;
  const z = e.target.closest && e.target.closest("[data-depot]");
  if(t === "dragover"){ e.preventDefault(); if(z) z.classList.add("survol"); return; }
  if(t === "dragleave"){ if(z) z.classList.remove("survol"); return; }
  e.preventDefault(); if(!z) return;
  const f = imageDe(e.dataTransfer); if(f) traiterImage(f, z.dataset.depot);
}));
document.addEventListener("toggle", e => {
  const g = e.target; if(!g.classList || !g.classList.contains("a-groupe")) return;
  const avant = !!A.catOuverts[g.dataset.cat]; A.catOuverts[g.dataset.cat] = g.open;
  if(g.open && !avant) U().render();
}, true);
// La zone d’image cliquée devient la cible du collage (utile quand il y en a plusieurs, comme pour les éléments)
document.addEventListener("click", e => {
  if(!window.UI || U().ecran !== "admin") return;
  const z = e.target.closest && e.target.closest("[data-depot]"); if(!z) return;
  document.querySelectorAll("[data-depot].cible").forEach(x => x.classList.remove("cible")); z.classList.add("cible");
});
window.addEventListener("beforeunload", e => { if(window.UI && U().ecran === "admin" && A.sale){ e.preventDefault(); e.returnValue = ""; } });

return {ouvrir, html, clic, saisie, peutQuitter};
})();

</script>
<script>
/* ============================================================
   INTERFACE — préparation, duel contre l’ordinateur, simulation
   ============================================================ */
(function(){
const M = MOTEUR, {ELEMENTS, LEADERS, R} = M;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const nf = n => String(n).replace(".", ",");
const pl = (n, un, des) => `${n} ${n > 1 ? des : un}`;
const ARCANES = {fou:"Fou", magicien:"Magicien", pretresse:"Prêtresse", imperatrice:"Impératrice", empereur:"Empereur", hierophante:"Hiérophante",
  amants:"Amants", chariot:"Chariot", justice:"Justice", ermite:"Ermite", fortune:"Fortune", force:"Force", pendu:"Pendu", mort:"Mort",
  temperance:"Tempérance", diable:"Diable", tour:"Tour", etoile:"Étoile", lune:"Lune", soleil:"Soleil", jugement:"Jugement", foi:"Foi", conseiller:"Conseiller", monde:"Monde"};

let S = null;
const cfg = {joueurs:[{leader:"panther", rangMax:9, part:0.5}, {leader:"fox", rangMax:9, part:0.5}], seed: Math.floor(Math.random()*1e6), nbSimu:200,
  regles:{pv:R.pv, aoaCartes:R.aoaCartes, aoaDegats:R.aoaDegats, faiblesse:R.faiblesse}};
const ui = {ecran:"accueil", section:null, velvet:{onglet:"fusion", a:null, b:null, q:"", arc:"", chaise:null, confirm:null, resultat:null, msg:null, erreur:null}, compte:{email:"", envoye:false, enCours:false, erreur:null}, cafe:{onglet:"collection", el:"", type:"", rang:0, q:"", edit:null, brouillon:null, nouveauLeader:"joker"}, iaEnCours:false, fxVu:0, choix:[], regles:false, simu:null, loupe:null, confirmFin:false, voirDeck:false, recuOuvert:false, rapide:false, dernierCourant:-1};

/* ---------- Textes des cartes ---------- */
const nomEl = el => el && ELEMENTS[el] ? ELEMENTS[el].nom : "";
// Icônes des éléments (SVG, couleur du texte)
const ICONES = {
  feu:'<path d="M12 2c1 4 5.5 6 5.5 11.2A5.5 5.5 0 0 1 6.5 13.2c0-3 1.8-4.6 2.3-7 1 2 2.2 3 3.2 3.2C12.6 7 11.6 4.6 12 2z"/>',
  gla:'<g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M20.7 7L3.3 17"/><path d="M9 4l3 2 3-2M9 20l3-2 3 2"/></g>',

  ven:'<g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M3 8.5h11a3 3 0 1 0-3-3"/><path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 16.5h7"/></g>',
  psy:'<g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 12a1.5 1.5 0 1 1 1.5 1.5A3.5 3.5 0 1 1 15.5 10 6 6 0 1 1 9 6.6 8.4 8.4 0 1 1 3.8 13"/></g>',
  nuc:'<g stroke="currentColor" stroke-width="1.9" fill="none"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></g><circle cx="12" cy="12" r="2.3"/>',
  sac:'<circle cx="12" cy="12" r="4.2"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></g>',
  mau:'<path fill-rule="evenodd" d="M12 2.5a8 8 0 0 0-8 8v3.8l2 1.9V20h3v-2h2v2h2v-2h2v2h3v-3.8l2-1.9v-3.8a8 8 0 0 0-8-8zM8.6 9.2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6.8 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>',
  phy:'<path d="M20.5 2.5l-1 4.6L9.9 16.7l1.6 1.6-1.4 1.4-2.1-2.1-2.7 2.7-1.6-1.6 2.7-2.7-2.1-2.1 1.4-1.4 1.6 1.6 9.6-9.6z"/>',
  gun:'<g stroke="currentColor" stroke-width="2.1" fill="none"><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v6M12 16.5v6M1.5 12h6M16.5 12h6"/></g><circle cx="12" cy="12" r="1.7"/>',
  pur:'<path d="M12 1.5l2.6 7.9 7.9 2.6-7.9 2.6L12 22.5l-2.6-7.9L1.5 12l7.9-2.6z"/>'
};
// L’icône déposée dans l’Administration remplace l’icône dessinée
const iconeEl = (el, classe) => {
  if(!el) return "";
  const perso = typeof CONFIGJEU !== "undefined" && CONFIGJEU.elements[el] && CONFIGJEU.elements[el].icone;
  if(perso) return `<img class="ico-el img ${classe || ""}" src="${esc(perso)}" alt="">`;
  return ICONES[el] ? `<svg class="ico-el ${classe || ""}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONES[el]}</svg>` : "";
};
// Portrait d’un Leader : son image détourée sur le décor de son élément, sinon son initiale
const portrait = (L, classe) => `<span class="portrait-art ${classe || ""} ${L.el ? "el-" + L.el : "el-aucun"}">${L.image ? `<img src="${esc(L.image)}" alt="">` : esc(L.nom.charAt(0))}</span>`;
// Carte de Leader illustrée : grande image détourée sur le décor de son élément
function leaderHTML(L, o = {}){
  return `<span class="leader-carte ${L.el ? "el-" + L.el : "el-aucun"} ${o.classe || ""}">
    ${L.image ? `<img class="lc-img" src="${esc(L.image)}" alt="">` : `<span class="lc-filigrane">${esc(L.nom.charAt(0))}</span>`}
    ${o.badge ? `<span class="lc-badge">${o.badge}</span>` : ""}
    <span class="lc-bas"><span class="lc-nom">${esc(L.nom)}</span><span class="lc-arc">${esc(ARCANES[L.arcane] || "")}</span></span></span>`;
}
// Tous les effets du jeu : texte de la pastille, phrase complète, classe de couleur
const EFF = {
  deg:{p:n => `⚔ ${n}`, c:"deg", t:n => `infligez <b>${n}</b> dégât${n > 1 ? "s" : ""}`},
  yen:{p:n => `¥ ${n}`, c:"yen", t:n => `gagnez <b>${n} ¥</b>`},
  pv:{p:n => n < 0 ? `♥ ${n}` : `♥ ${n}`, c:"pv", t:n => `<b>+${n} PV</b>`},
  pioche:{p:n => `+${n} carte${n > 1 ? "s" : ""}`, c:"autre", t:n => `piochez <b>${pl(n, "carte", "cartes")}</b>`},
  defausse:{p:n => `Peur ${n}`, c:"etat", t:n => `<b>Peur</b> : l’adversaire défausse ${pl(n, "carte", "cartes")} au début de son tour`, g:"l’adversaire choisit une carte de sa main à défausser au début de son prochain tour."},
  purge:{p:n => `Purge ${n}`, c:"autre", t:n => `retirez <b>${pl(n, "carte", "cartes")}</b> de votre deck`, g:"retirez définitivement une carte de votre main ou de votre défausse (un Yen, par exemple)."},

const CONDITIONS = {deuxPersonas:["2 Personas", "si exactement 2 Personas ont été jouées ce tour"], premiere:["1re carte", "si c’est la première carte jouée ce tour"],
  moinsPV:["moins de PV", "si vous avez moins de PV que l’adversaire"], seulePersona:["seule Persona", "si c’est la seule Persona jouée ce tour"], pvBas:["≤ 20 PV", "si vous avez 20 PV ou moins"]};
function txtEffet(e, d){
  if(!e) return "";
  const l = [];
  for(const [k, x] of Object.entries(EFF)) if(e[k]) l.push(x.t(e[k]) + (k === "deg" && d && d.finition ? " (doublés si l’adversaire a moins de 20 PV)" : ""));
  let t = l.join(", ");
  if(e.cond && CONDITIONS[e.cond]) t += ` (${CONDITIONS[e.cond][1]})`;
  t += ".";
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const classeEl = d => d.kind === "objet" ? "el-objet" : d.el ? "el-" + d.el : "el-aucun";
function carteHTML(c, o = {}){
  const d = M.def(c);
  const type = d.kind === "persona" ? `Persona · ${nomEl(d.el)} · ${ARCANES[d.arcane] || ""}` : d.kind === "skill" ? `Skill · ${nomEl(d.el) || "sans élément"}` : d.kind === "visite" ? "Carte de visite" : "Objet";
  const lignes = [`<span class="ligne">${txtEffet(d.effet, d)}</span>`];
  if(d.parPhysique) lignes.push(`<span class="ligne">+1 dégât par autre carte Physique jouée.</span>`);
  if(d.combo) lignes.push(`<span class="ligne om"><b>One More (${esc(nomEl(d.el))})</b> : ${txtEffet(d.combo, d)}</span>`);
  if(d.lien) lignes.push(`<span class="ligne"><b>Lien d’Arcane</b> : ${txtEffet(d.lien)}</span>`);
  if(d.sacrifice) lignes.push(`<span class="ligne"><b>Sacrifice</b> : ${txtEffet(d.sacrifice)}</span>`);
  const tag = o.act ? "button" : "div";
  const attrs = o.act ? `type="button" data-act="${o.act}" data-id="${o.id ?? c.uid}" ${o.off ? "disabled" : ""}` : "";
  return `<${tag} class="carte k-${d.kind} ${d.rang === 5 ? "r5" : ""} ${o.classe || ""}" ${attrs} aria-label="${esc(d.nom)}">
    <span class="art ${classeEl(d)}"><span>${esc(d.nom.charAt(0))}</span>${d.rang ? `<span class="rang">${"★".repeat(d.rang)}</span>` : ""}${o.prix != null ? `<span class="cout">${o.prix} ¥</span>` : ""}</span>
    ${o.combo ? `<span class="badge">One More !</span>` : ""}${o.lien ? `<span class="badge lien">Lien</span>` : ""}
    <span class="corps"><span class="type">${esc(type)}</span><span class="nom">${esc(d.nom)}</span>${lignes.join("")}</span></${tag}>`;
}

function statsDeck(cartes, leader){

/* ---------- Velvet Room ---------- */
function personasCollection(){
  const V = ui.velvet, P = PROFIL.profil, q = V.q.trim().toLowerCase();
  return Object.keys(P.collection).filter(id => VELVET.estPersona(id) && (!V.arc || M.C[id].arcane === V.arc) && (!q || M.C[id].nom.toLowerCase().includes(q)))
    .sort((a, b) => (ARCANES[M.C[a].arcane] || "").localeCompare(ARCANES[M.C[b].arcane] || "") || M.C[a].rang - M.C[b].rang || M.C[a].nom.localeCompare(M.C[b].nom));
}
function filtresVelvet(){
  const V = ui.velvet, arcs = [...new Set(Object.keys(PROFIL.profil.collection).filter(VELVET.estPersona).map(id => M.C[id].arcane))].sort((a, b) => (ARCANES[a] || "").localeCompare(ARCANES[b] || ""));
  return `<div class="filtres"><label>Arcane <select data-velvet="arc"><option value="">Toutes</option>${arcs.map(a => `<option value="${a}" ${V.arc === a ? "selected" : ""}>${esc(ARCANES[a] || a)}</option>`).join("")}</select></label>
    <label class="recherche">Rechercher <input type="search" id="velvet-q" value="${esc(V.q)}" data-velvet="q" placeholder="Nom de la Persona"></label></div>`;
}
function emplacementFusion(id, lettre){
  return `<div class="vr-slot">${id ? `${carteJeu({id, uid:"vr-" + lettre}, {niveau: nivDe(id)})}<button type="button" class="btn petit" data-act="vr-vider" data-id="${lettre}">Retirer</button>`
    : `<div class="vr-vide">Persona ${lettre === "a" ? "1" : "2"}<br><small>Cliquez sur une Persona de votre collection</small></div>`}</div>`;
}
function ongletFusion(){
  const V = ui.velvet, P = PROFIL.profil, r = V.a && V.b ? VELVET.resultatFusion(V.a, V.b) : null;
  const ids = personasCollection();

    <div class="vr-fusion">
      ${emplacementFusion(V.a, "a")}<span class="vr-op">×</span>${emplacementFusion(V.b, "b")}<span class="vr-op">=</span>
      <div class="vr-slot resultat">${r ? (r.ok ? `${carteJeu({id:r.id, uid:"vr-r"})}<p class="vr-regle">${esc(ARCANES[M.C[V.a].arcane])} × ${esc(ARCANES[M.C[V.b].arcane])} → <b>${esc(ARCANES[r.arcane])}</b></p>`
          : `<div class="vr-vide erreur-txt">${esc(r.raison)}</div>`) : `<div class="vr-vide">Résultat</div>`}</div>
    </div>
    <div class="actions"><button type="button" class="btn fort" data-act="vr-fusion-demander" ${r && r.ok ? "" : "disabled"}>Fusionner</button></div>
    <h3>Vos Personas</h3>${filtresVelvet()}
    <div class="grille-cartes">${ids.map(id => `<div class="pile">${carteJeu({id, uid:"vrc-" + id}, {act:"vr-choisir", id, classe: V.a === id || V.b === id ? "choisie" : "", niveau: nivDe(id)})}<span class="nb">×${P.collection[id]}</span></div>`).join("") || `<p class="discret">Aucune Persona ne correspond.</p>`}</div>`;
}
function ongletCompendium(){
  const V = ui.velvet, P = PROFIL.profil, max = PROFIL.rangCartesMax(P.rang);
  const total = Object.keys(M.C).filter(VELVET.estPersona).length, ids = Object.keys(P.compendium).filter(id => VELVET.estPersona(id) && (!V.arc || M.C[id].arcane === V.arc))
    .sort((a, b) => (ARCANES[M.C[a].arcane] || "").localeCompare(ARCANES[M.C[b].arcane] || "") || M.C[a].rang - M.C[b].rang);
  return `<p>Toutes les Personas que vous avez obtenues un jour sont inscrites ici. Vous pouvez en racheter un exemplaire avec vos Fragments de Velvet : ${PROFIL.REGLES.prixCompendium} Fragments par rang. Vous avez <b>${P.fragments} Fragments</b>.</p>
    <p class="discret">${Object.keys(P.compendium).length} Personas inscrites sur ${total}.</p>
    <div class="filtres"><label>Arcane <select data-velvet="arc"><option value="">Toutes</option>${VELVET.ARCANES.map(a => `<option value="${a}" ${V.arc === a ? "selected" : ""}>${esc(ARCANES[a] || a)}</option>`).join("")}</select></label></div>
    <div class="grille-cartes">${ids.map(id => { const prix = VELVET.prixCompendium(id), ok = P.fragments >= prix && M.C[id].rang <= max;
      return `<div class="emplacement">${carteJeu({id, uid:"cp-" + id})}<button type="button" class="btn petit" data-act="vr-acheter" data-id="${id}" ${ok ? "" : "disabled"} title="${M.C[id].rang > max ? "Rang de Voleur fantôme insuffisant" : P.fragments < prix ? "Fragments insuffisants" : ""}">Racheter · ${prix}</button><small class="discret">${P.collection[id] ? `vous en avez ${P.collection[id]}` : "aucun exemplaire"}</small></div>`; }).join("") || `<p class="discret">Aucune Persona inscrite pour cette Arcane.</p>`}</div>`;
}
function ongletChaise(){
  const V = ui.velvet, P = PROFIL.profil, ids = personasCollection();
  const choix = V.chaise && P.collection[V.chaise] ? V.chaise : null, skills = choix ? VELVET.skillsPersona(choix) : [];
  return `<p>Sacrifiez une Persona pour obtenir la carte de l’un des skills qu’elle a appris. Une Persona apprend ses skills en montant de niveau, comme dans P5R : elle gagne de l’expérience quand elle est dans votre deck de marché, et davantage quand vous la jouez. Les skills uniques ne s’obtiennent que de cette façon.</p>
    ${choix ? `<div class="vr-chaise"><div>${carteJeu({id:choix, uid:"ch-p"}, {niveau: nivDe(choix)})}<button type="button" class="btn petit" data-act="vr-chaise-annuler">Choisir une autre Persona</button></div>
      <div><h3>Skills de ${esc(M.C[choix].nom)}</h3>${skills.length ? `<div class="rangee">${skills.map(s => `<div class="emplacement">${carteJeu({id:s.id, uid:"ch-" + s.id}, {classe: s.ok ? "" : "verrou"})}
          ${s.ok ? `<button type="button" class="btn petit" data-act="vr-chaise-demander" data-id="${s.id}">Obtenir</button>` : `<small class="discret">${esc(s.raison)}</small>`}</div>`).join("")}</div>`
        : `<p class="discret">Cette Persona ne connaît aucun skill disponible en carte.</p>`}</div></div>`
      : `<h3>Choisissez une Persona</h3>${filtresVelvet()}<div class="grille-cartes">${ids.map(id => `<div class="pile">${carteJeu({id, uid:"chc-" + id}, {act:"vr-chaise", id, niveau: nivDe(id)})}<span class="nb">×${P.collection[id]}</span></div>`).join("") || `<p class="discret">Aucune Persona ne correspond.</p>`}</div>`}`;
}
function confirmVelvetHTML(){
  const V = ui.velvet, c = V.confirm; if(!c) return "";
  const corps = c.type === "fusion" ? `<p>${esc(M.C[V.a].nom)} et ${esc(M.C[V.b].nom)} vont disparaître de votre collection pour donner <b>${esc(M.C[c.id].nom)}</b>.</p>`

  return `<div class="voile"><div class="fenetre velvet-fenetre"><h2>${c.type === "fusion" ? "Lancer la fusion ?" : "Utiliser la chaise électrique ?"}</h2>${corps}
    <p class="discret">Si ces cartes sont dans un de vos decks, il sera complété automatiquement avec d’autres cartes.</p>
    <div class="actions"><button type="button" class="btn fort" data-act="vr-confirmer">Confirmer</button><button type="button" class="btn" data-act="vr-annuler">Annuler</button></div></div></div>`;
}
function resultatVelvetHTML(){
  const r = ui.velvet.resultat; if(!r) return "";
  return `<div class="voile"><div class="fenetre velvet-fenetre"><h2>${r.titre}</h2><div class="rangee">${carteJeu({id:r.id, uid:"res"})}</div>
    <p>${esc(r.texte)}</p>${r.decks && r.decks.length ? `<p class="discret">Deck${r.decks.length > 1 ? "s" : ""} complété${r.decks.length > 1 ? "s" : ""} automatiquement : ${esc(r.decks.join(", "))}.</p>` : ""}
    <div class="actions"><button type="button" class="btn fort" data-act="vr-fermer">Continuer</button></div></div></div>`;
}
function velvetHTML(){
  const V = ui.velvet, o = V.onglet;
  const corps = o === "compendium" ? ongletCompendium() : o === "chaise" ? ongletChaise() : ongletFusion();
  return `<div class="cafe velvet"><div class="barre-nav"><button type="button" class="lien-btn" data-act="aller" data-id="accueil">← Accueil</button></div>
    <div class="titre velvet-titre"><h1>Velvet Room</h1><p>« Bienvenue dans la Velvet Room. » Fusion, compendium et chaise électrique.</p></div>
    <nav class="onglets" aria-label="Services de la Velvet Room">${[["fusion","Fusion"],["compendium","Compendium"],["chaise","Chaise électrique"]].map(([k, l]) => `<button type="button" data-act="vr-onglet" data-id="${k}" aria-current="${o === k ? "page" : "false"}">${l}</button>`).join("")}</nav>
    <section class="cafe-corps">${V.erreur ? `<div class="erreur" role="alert">${esc(V.erreur)}</div>` : ""}${corps}</section>
    <aside class="loupe-flottante panneau" aria-label="Loupe"><div class="loupe-contenu">${loupeHTML(ui.loupe)}</div></aside>
    ${confirmVelvetHTML()}${resultatVelvetHTML()}</div>`;
}
function actionVelvet(act, id){
  const V = ui.velvet; V.erreur = null;
  switch(act){
    case "vr-onglet": V.onglet = id; V.confirm = null; break;
    case "vr-choisir":
      if(V.a === id && V.b !== id && (PROFIL.profil.collection[id] || 0) < 2){ V.a = null; break; }
      if(!V.a) V.a = id; else if(!V.b) V.b = id; else V.b = id; break;
    case "vr-vider": V[id] = null; break;
    case "vr-fusion-demander": { const r = VELVET.resultatFusion(V.a, V.b); if(r.ok) V.confirm = {type:"fusion", id:r.id}; else V.erreur = r.raison; break; }
    case "vr-chaise": V.chaise = id; break;
    case "vr-chaise-annuler": V.chaise = null; break;
    case "vr-chaise-demander": V.confirm = {type:"chaise", id}; break;
    case "vr-annuler": V.confirm = null; break;
    case "vr-confirmer": {
      const c = V.confirm; V.confirm = null;
      if(c.type === "fusion"){ const r = VELVET.fusionner(V.a, V.b); if(r.ok){ V.resultat = {titre:"Fusion réussie !", id:r.id, texte:`${M.C[r.id].nom} rejoint votre collection.`, decks:r.decks}; V.a = V.b = null; } else V.erreur = r.raison; }
      else { const r = VELVET.chaise(V.chaise, c.id); if(r.ok){ V.resultat = {titre:"Exécution réussie", id:c.id, texte:`Vous obtenez la carte ${M.C[c.id].nom}.`, decks:r.decks}; V.chaise = null; } else V.erreur = r.raison; }
      break;
    }
    case "vr-fermer": V.resultat = null; break;
    case "vr-acheter": { const r = VELVET.acheter(id); if(r.ok) V.resultat = {titre:"Rachat au compendium", id, texte:`${M.C[id].nom} rejoint votre collection (−${r.prix} Fragments).`}; else V.erreur = r.raison; break; }
    default: return;
  }
  render();
}

    <div class="colonnes">${col(0, "Vous")}${col(1, "L’ordinateur")}</div>
    <section class="bloc" style="margin-top:20px"><h2>Règles du duel</h2><div class="reglages">

// Moment du jeu pour la musique

  }
  if(ui.ecran === "leblanc") return "leblanc";

// Zones qui défilent à l’intérieur de la page : leur position est gardée d’un affichage à l’autre
const ZONES_DEFILEMENT = [".a-items", ".ed-deck", ".deck-liste", ".detail", ".journal", ".rangee", ".a-liste", ".fenetre"];
function render(){
  const x = window.scrollX, y = window.scrollY, dockMain = document.querySelector(".main-cartes"), sx = dockMain ? dockMain.scrollLeft : 0;
  const ecranAvant = ui.ecran, defilements = ZONES_DEFILEMENT.map(sel => [...document.querySelectorAll(sel)].map(e => [e.scrollTop, e.scrollLeft]));
  if(ui.ecran === "jeu" && S) recompense();
  const actif = document.activeElement, idActif = actif && actif.id, pos = actif && actif.selectionStart;
  if(!PROFIL.etat.pret){ app.innerHTML = `<div class="chargement"><p>Chargement…</p></div>`; return; }
  if(STOCKAGE.connexionRequise()){ S = null; ui.ecran = "accueil"; app.innerHTML = connexionHTML(); return; }
  if(ui.ecran === "admin" && !PROFIL.etat.admin) ui.ecran = "accueil";
  app.innerHTML = ui.ecran === "admin" ? ADMIN.html() : ui.ecran === "jeu" && S ? jeuHTML() : ui.ecran === "accueil" ? accueilHTML() : ui.ecran === "bientot" ? bientotHTML() : ui.ecran === "leblanc" ? leblancHTML() : ui.ecran === "velvet" ? velvetHTML() : prepHTML();
  if(idActif){ const el = document.getElementById(idActif); if(el){ el.focus({preventScroll:true}); try { if(pos != null) el.setSelectionRange(pos, pos); } catch(e){} } }
  if(typeof MUSIQUE !== "undefined") MUSIQUE.jouer(slotMusique());
  // Sur le même écran, rien ne bouge : ni la page, ni les listes qui défilent
  if(ui.ecran === ecranAvant){
    ZONES_DEFILEMENT.forEach((sel, k) => document.querySelectorAll(sel).forEach((e, i) => { const p = defilements[k][i]; if(p){ e.scrollTop = p[0]; e.scrollLeft = p[1]; } }));
    window.scrollTo(x, y);
  }
  if(ui.ecran === "jeu" && S){ effets(); const m = document.querySelector(".main-cartes"); if(m) m.scrollLeft = sx; window.scrollTo(x, y); }
}
function cutin(texte, petit){
  const b = document.createElement("div"); b.className = "cutin" + (petit ? " petit" : ""); b.setAttribute("aria-live", "polite");
  b.innerHTML = `<span>${texte}</span>`; document.body.appendChild(b); setTimeout(() => b.remove(), 1050);
}
function effets(){
  const nouveaux = S.fx.filter(f => f.n > ui.fxVu); ui.fxVu = S.fxN || 0;
  let cut = null;
  for(const f of nouveaux){
    if(f.t === "aoa") cut = ["All-Out Attack !", false];
    else if(f.t === "visite" && !cut) cut = ["Carte de visite !", false];
    else if(f.t === "onemore" && (!cut || cut[1])) cut = ["One More !", true];
    const cible = f.j !== undefined ? app.querySelector(`[data-bandeau="${f.j}"]`) : null;
    if(!cible) continue;
    const txt = f.t === "degats" ? `−${f.v} PV` : f.t === "soin" ? `+${f.v} PV` : f.t === "capa" ? "Capacité !" : null;
    if(!txt) continue;
    const s = document.createElement("span"); s.className = "flot " + (f.t === "soin" ? "soin" : f.t === "capa" ? "info" : ""); s.textContent = txt;
    cible.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
  if(ui.dernierCourant !== S.courant && S.vainqueur === null){ if(S.courant === 0 && !cut) cut = ["À vous !", true]; ui.dernierCourant = S.courant; }
  if(cut && !ui.rapide) cutin(cut[0], cut[1]);
}
